# ============================================================
# Codex Project Configuration
#
# Main Codex Thread가 프로젝트의 Manager Agent 역할을 한다.
# ============================================================

# ------------------------------------------------------------
# Main / Manager 모델
# ------------------------------------------------------------

# 복잡한 요구사항 분석, Architecture 결정,
# Sub-Agent 업무 분배 및 최종 통합 판단을 담당한다.
model = "gpt-6-astra"

# 일반적인 Manager 업무에는 High를 기본값으로 사용한다.
# xhigh/max는 특별히 어려운 문제에서만 일시적으로 사용하는 것을 권장한다.
model_reasoning_effort = "high"


# ------------------------------------------------------------
# Multi-Agent 설정
# ------------------------------------------------------------

[agents]
# Root Manager가 동시에 실행할 수 있는 Sub-Agent 수를 제한한다. 
# 모든 Agent를 항상 실행한다는 의미가 아니다. 
max_concurrent_threads_per_session = 6
