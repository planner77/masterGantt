name: Playwright setup 계측
description: Chromium OS dependency와 headless-shell 설치 비용을 분리 계측한다. browser cache는 baseline 10회 전에는 활성화하지 않는다.
outputs:
  playwright-version:
    description: 설치된 Playwright version
    value: ${{ steps.version.outputs.value }}
runs:
  using: composite
  steps:
    - name: Playwright version 확인
      id: version
      shell: bash
      run: |
        version="$(node -p 'require("@playwright/test/package.json").version')"
        echo "value=$version" >> "$GITHUB_OUTPUT"

    - name: Chromium OS dependency 계측 시작
      id: deps-start
      shell: bash
      run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

    - name: Chromium OS dependency 설치
      shell: bash
      run: |
        set -euo pipefail

        # #487 Main CI #2203.1: npx timeout can leave a sudo apt-get child
        # holding /var/lib/apt/lists/lock after the parent exits.
        # Normalize the known slow Azure runner mirror BEFORE the first apt
        # operation, including Ubuntu 24.04 mirror+file:/etc/apt/apt-mirrors.txt indirection.
        azure_sources=()
        for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
          [[ -f "$source" ]] || continue
          if grep -Fq 'azure.archive.ubuntu.com/ubuntu' "$source"; then
            azure_sources+=("$source")
          fi
        done
        if (( ${#azure_sources[@]} > 0 )); then
          echo "::notice::Selecting the official Ubuntu archive before Playwright dependency installation."
          for source in "${azure_sources[@]}"; do
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
          done
        fi

        # APT network deadlines let sudo apt-get unwind locks rather than
        # relying only on the outer npx timeout to terminate child processes.
        sudo tee /etc/apt/apt.conf.d/99mastergantt-playwright-ci >/dev/null <<'APT_CONF'
        Acquire::http::Timeout "45";
        Acquire::https::Timeout "45";
        Acquire::Retries "1";
        APT_CONF

        install_deps() {
          timeout --signal=TERM --kill-after=10s 360s npx --no-install playwright install-deps chromium
        }
        install_status=0
        install_deps || install_status=$?
        if (( install_status == 0 )); then
          exit 0
        fi

        # Only retry after a normalized Azure source failed. A timed-out npm
        # ancestor may leave its apt-get child active. Never overlap apt-get
        # instances, kill unrelated processes or weaken validation.
        if (( ${#azure_sources[@]} == 0 )); then
          echo "Playwright OS deps failed (exit=$install_status); no Azure mirror recovery available." >&2
          exit "$install_status"
        fi
        if ! command -v fuser >/dev/null 2>&1; then
          echo "Cannot verify APT lock release: fuser is unavailable." >&2
          exit "$install_status"
        fi
        apt_locked() {
          local locks=()
          for lock in /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock; do
            [[ -e "$lock" ]] && locks+=("$lock")
          done
          (( ${#locks[@]} == 0 )) && return 1
          sudo fuser -s "${locks[@]}" 2>/dev/null
        }
        for (( attempt=0; attempt<30; attempt++ )); do
          if ! apt_locked; then
            echo "::warning::Playwright OS deps first attempt failed (exit=$install_status); APT locks released, retrying once."
            install_deps
            exit 0
          fi
          sleep 2
        done
        echo "APT lock still held after 60 seconds; refusing overlapping Playwright install-deps retry." >&2
        exit "$install_status"
    - name: Chromium OS dependency 시간 기록
      if: ${{ always() && steps.deps-start.outputs.started_ms != '' }}
      shell: bash
      run: node scripts/record-ci-setup-metric.mjs --metric playwright-os-deps --started-ms "${{ steps.deps-start.outputs.started_ms }}" --cache "not-enabled"

    - name: Chromium headless shell 계측 시작
      id: browser-start
      shell: bash
      run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

    - name: Chromium headless shell 설치
      shell: bash
      run: npx --no-install playwright install --only-shell chromium

    - name: Chromium headless shell 시간 기록
      if: ${{ always() && steps.browser-start.outputs.started_ms != '' }}
      shell: bash
      run: node scripts/record-ci-setup-metric.mjs --metric playwright-headless-shell --started-ms "${{ steps.browser-start.outputs.started_ms }}" --cache "not-enabled"
