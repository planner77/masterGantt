name: Playwright setup 계측
description: Chromium OS dependency와 headless-shell cache/install 시간을 계측한다.
outputs:
  browser-cache-hit:
    description: Playwright browser cache exact key hit 여부
    value: ${{ steps.browser-cache.outputs.cache-hit }}
  playwright-version:
    description: 설치된 Playwright version
    value: ${{ steps.version.outputs.value }}
runs:
  using: composite
  steps:
    - name: Playwright version 확인
      id: version
      shell: bash
      run: echo "value=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Chromium OS dependency 계측 시작
      id: deps-start
      shell: bash
      run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

    - name: Chromium OS dependency 설치
      shell: bash
      run: npx --no-install playwright install-deps chromium

    - name: Chromium OS dependency 시간 기록
      if: always()
      shell: bash
      run: node scripts/record-ci-setup-metric.mjs --metric playwright-os-deps --started-ms "${{ steps.deps-start.outputs.started_ms }}"

    - name: Playwright browser cache 계측 시작
      id: browser-cache-start
      shell: bash
      run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

    - name: Playwright browser cache 복원
      id: browser-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.value }}-headless-shell-v1

    - name: Playwright browser cache 시간·hit 기록
      shell: bash
      run: node scripts/record-ci-setup-metric.mjs --metric playwright-browser-cache --started-ms "${{ steps.browser-cache-start.outputs.started_ms }}" --cache "exact-hit=${{ steps.browser-cache.outputs.cache-hit || 'false' }}"

    - name: Chromium headless shell ensure 계측 시작
      id: browser-start
      shell: bash
      run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

    - name: Chromium headless shell ensure
      shell: bash
      run: npx --no-install playwright install --only-shell chromium

    - name: Chromium headless shell 시간 기록
      if: always()
      shell: bash
      run: node scripts/record-ci-setup-metric.mjs --metric playwright-headless-shell --started-ms "${{ steps.browser-start.outputs.started_ms }}"
