name: Issue 64 release cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-64-release-helper.yml"

permissions:
  contents: write
  actions: read

jobs:
  cleanup:
    name: v0.15.0 릴리스 확인 및 작업 브랜치 삭제
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: d4cb240b55c1ec57f68f18d21e1061a750eb10b3
      RELEASE_TAG: v0.15.0
      RELEASE_RUN_ID: "35284876023"
      WORK_BRANCH: feat/issue-64-structured-logging
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 릴리스 tag 및 workflow 성공 확인
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"
          run="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          test "$(jq -r .head_sha <<<"$run")" = "$TARGET_SHA"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .run_attempt <<<"$run")" = "2"
      - name: 작업 브랜치 삭제
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$WORK_BRANCH" >/dev/null 2>&1; then
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$WORK_BRANCH"
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$WORK_BRANCH" >/dev/null 2>&1; then
            echo "Failed to delete branch: $WORK_BRANCH" >&2
            exit 1
          fi
      - name: 완료 요약
        shell: bash
        run: |
          {
            echo "## Issue #64 release cleanup"
            echo
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Release commit: \`$TARGET_SHA\`"
            echo "- Release workflow run: \`$RELEASE_RUN_ID\` (attempt 2, success)"
            echo "- Deleted branch: \`$WORK_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
