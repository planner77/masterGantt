name: Issue 64 release helper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-64-release-helper.yml"

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: v0.15.0 릴리스 게시 및 작업 브랜치 정리
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: d4cb240b55c1ec57f68f18d21e1061a750eb10b3
      RELEASE_TAG: v0.15.0
      WORK_BRANCH: feat/issue-64-structured-logging
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 릴리스 대상과 기존 tag 확인
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "0.15.0"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: annotated release tag 생성 및 push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: release image workflow 실행
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" \
            -f ref="$RELEASE_TAG"
      - name: release workflow 완료 확인
        id: release
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          run_url=""
          for _ in $(seq 1 240); do
            runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=50")"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" ]]; then
              run_id="$(jq -r .id <<<"$run")"
              run_url="$(jq -r .html_url <<<"$run")"
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              echo "Release run $run_id: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "Release workflow failed: $run_url" >&2
                  exit 1
                fi
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Timed out while waiting for release workflow." >&2
          exit 1
      - name: 작업 브랜치 삭제
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$WORK_BRANCH"
      - name: 완료 요약
        shell: bash
        run: |
          {
            echo "## Issue #64 release orchestration"
            echo
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Release commit: \`$TARGET_SHA\`"
            echo "- Release workflow: ${{ steps.release.outputs.run_url }}"
            echo "- Deleted branch: \`$WORK_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
