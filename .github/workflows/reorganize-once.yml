name: Prepare approved repository reorganization

# Temporary work-branch preparation only. The connector creates trees/commits/refs.
on:
  push:
    branches: [chore/reorganize-deployment]
    paths:
      - .github/workflows/reorganize-once.yml
      - scripts/reorganize-once.py
permissions: {}
concurrency:
  group: mastergantt-approved-reorganization
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.repository == 'planner77/masterGantt' && github.ref == 'refs/heads/chore/reorganize-deployment' && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Prepare validated content blobs without moving repository refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/reorganize-once.py').resolve()
          source = script.read_text(encoding='utf-8')
          old = 'require(run("git", "rev-parse", "HEAD^") == BASE, "Base moved before bootstrap")'
          assert source.count(old) == 1
          source = source.replace(old, 'require(run("git", "rev-parse", "HEAD^") == "d5bbb249a888cfca588900297c805a2b9c48fa1c", "Bootstrap parent moved")')
          beginning = source.index('    def publish_tree(')
          ending = source.index('\n\nif __name__ == "__main__":')
          source = source[:beginning] + '''
              known_blobs = {line.split()[2] for line in run("git", "ls-tree", "-r", bootstrap_sha).splitlines()}
              def export_tree(old_local, new_local):
                  entries = []
                  for path in run("git", "diff", "--no-renames", "--name-only", old_local, new_local).splitlines():
                      info = run("git", "ls-tree", new_local, "--", path)
                      if not info:
                          entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                          continue
                      mode, kind, sha = info.split("\\t")[0].split()
                      require(kind == "blob" and mode in ("100644", "100755"), "Unexpected Git entry")
                      if sha not in known_blobs:
                          content = subprocess.check_output(["git", "show", f"{new_local}:{path}"], cwd=ROOT).decode("utf-8")
                          result = post("git/blobs", {"content": content, "encoding": "utf-8"})
                          require(result["sha"] == sha, "Blob differs from validated content")
                          known_blobs.add(sha)
                      entries.append({"path": path, "mode": mode, "type": "blob", "sha": sha})
                  return {"base_tree": run("git", "rev-parse", old_local + "^{tree}"), "tree_sha": run("git", "rev-parse", new_local + "^{tree}"), "tree_elements": entries}
              report = {"baseline": BASE, "bootstrap_sha": bootstrap_sha, "deployment": export_tree(bootstrap_sha, commit_a), "tests": export_tree(commit_a, commit_b), "static_checks": "PASS: shell/discovery syntax, Markdown links, whitespace, source/lockfile preservation", "runtime_checks": "NOT TESTED: connector PRs required"}
              print("REORGANIZATION_OBJECTS=" + json.dumps(report, separators=(",", ":")))
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("Static preparation passed. No tree, commit or branch was written by this job. Connector operations and PR CI remain required.", encoding="utf-8")
          ''' + source[ending:]
          exec(compile(source, str(script), 'exec'), {'__name__': '__main__', '__file__': str(script)})
          PY
