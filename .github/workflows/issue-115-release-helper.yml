name: Issue 115 릴리스 완료 자동화

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-115-release-helper.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release:
    name: v0.27.1 GHCR 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      RELEASE_TAG: v0.27.1
      WORK_BRANCH: fix/issue-115-calendar-preview
      FEATURE_MERGE_SHA: 692ed6dc51674e00eabb096a9ae46696b6b82cfd
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 승인된 Issue #115 Lifecycle 완료
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$GITHUB_SHA"
          test "$(git show "$target_sha:package.json" | jq -r .version)" = "0.27.1"
          git merge-base --is-ancestor "$FEATURE_MERGE_SHA" "$target_sha"

          pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/137")"
          test "$(jq -r '.merged_at // ""' <<<"$pr")" != ""
          test "$(jq -r '.base.ref' <<<"$pr")" = "main"
          test "$(jq -r '.head.ref' <<<"$pr")" = "$WORK_BRANCH"
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$FEATURE_MERGE_SHA"

          main_ci_url=""
          for _ in $(seq 1 300); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=50")"
            run="$(jq -c --arg sha "$target_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
              test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
              main_ci_url="$(jq -r .html_url <<<"$run")"
              break
            fi
            sleep 15
          done
          test -n "$main_ci_url"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$target_sha" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$target_sha"

          release_run_url=""
          existing_runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
          successful="$(jq -c --arg sha "$target_sha" --arg tag "$RELEASE_TAG" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$existing_runs")"
          if [[ -n "$successful" ]]; then
            release_run_url="$(jq -r .html_url <<<"$successful")"
          else
            dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" -f ref="$RELEASE_TAG"
            for _ in $(seq 1 480); do
              runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=100")"
              run="$(jq -c --arg sha "$target_sha" --arg tag "$RELEASE_TAG" --arg after "$dispatched_after" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .created_at >= $after)] | sort_by(.created_at) | last // empty' <<<"$runs")"
              if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
                test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
                release_run_url="$(jq -r .html_url <<<"$run")"
                break
              fi
              sleep 15
            done
          fi
          test -n "$release_run_url"

          python3 scripts/safe_branch_cleanup.py --repo "$GITHUB_REPOSITORY" --pr 137 --branch "$WORK_BRANCH" --target-sha "$target_sha" --delete

          body="$(printf '%s\n' "Issue Lifecycle 완료:" "- 기능 PR: #137" "- 버전: 0.27.1" "- 릴리스 기준 SHA: $target_sha" "- main CI: $main_ci_url" "- GHCR 정식 릴리스 이미지: $release_run_url" "- 정식 릴리스 태그: $RELEASE_TAG" "- 작업 브랜치 정리: $WORK_BRANCH (scripts/safe_branch_cleanup.py)")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/115/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/115" -f state="closed" -f state_reason="completed"
