name: Finalize historical v0.8.3 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v0.8.3-release.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-v0.8.3-release
  cancel-in-progress: false

jobs:
  finalize:
    name: Create annotated v0.8.3 tag and dispatch release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.8.3
      TARGET_SHA: e6f26aca216d58976577b316e813cd59d60ed158
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify historical release target
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          package_version="$(git show "$TARGET_SHA:package.json" | jq -r '.version')"
          lock_version="$(git show "$TARGET_SHA:package-lock.json" | jq -r '.version')"

          test "$package_version" = "0.8.3"
          test "$lock_version" = "0.8.3"
          git cat-file -e "$TARGET_SHA:.github/workflows/release-image.yml"

      - name: Create annotated release tag when absent
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
            test "$tag_type" = "tag"
            tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tagged_commit" = "$TARGET_SHA"
            echo "$RELEASE_TAG already exists as the expected annotated tag."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG - Issue #37 edit permission recheck; PR #45; CI #151/#152 passed"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch release image workflow explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-image.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          echo "Dispatched release-image.yml for $RELEASE_TAG"
