name: Issue 40 version sync

on:
  push:
    branches: [fix/issue-40-stable-scroll-assertion]
    paths:
      - .github/workflows/issue-40-version-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: package-lock 버전 동기화
        run: npm install --package-lock-only --ignore-scripts
      - name: 변경된 lockfile 커밋
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: 0.8.2 package-lock 버전 동기화"
          git push
