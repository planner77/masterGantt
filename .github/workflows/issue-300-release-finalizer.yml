name: Issue 300 릴리스 마무리

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-300-release-finalizer.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release_finalize:
    name: v0.54.1 릴리스 및 Issue 300 종료
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FEATURE_PR: "304"
      FINALIZER_BRANCH: ops/issue-300-release-finalize
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: v0.54.1 릴리스 검증 및 GHCR 게시
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue_lifecycle.py release \
            --issue 300 \
            --pr "$FEATURE_PR" \
            --release-required true \
            --release-authorized true \
            --expected-version 0.54.1 \
            --authorization-note "사용자가 2026-09-30에 Issue #300의 병합, main CI, GHCR 게시 및 자동 release finalize 실행을 명시적으로 요청함."

      - name: Finalizer PR 확인 및 finalizer 브랜치 안전 정리
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          finalizer_pr="$(
            gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&head=$owner:$FINALIZER_BRANCH&per_page=20" |
              jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)] | last | .number // empty'
          )"
          test -n "$finalizer_pr"
          python3 scripts/safe_branch_cleanup.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$finalizer_pr" \
            --branch "$FINALIZER_BRANCH" \
            --target-sha "$GITHUB_SHA" \
            --delete

      - name: Issue 300 lifecycle 최종 정리 및 종료
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue_lifecycle.py finalize \
            --issue 300 \
            --pr "$FEATURE_PR" \
            --release-required true \
            --release-authorized true \
            --expected-version 0.54.1 \
            --authorization-note "사용자가 2026-09-30에 Issue #300의 병합, main CI, GHCR 게시 및 자동 release finalize 실행을 명시적으로 요청함."
