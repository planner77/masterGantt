name: Issue 76 release helper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-76-release-helper.yml"

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  release:
    name: v0.21.0 GHCR 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_TAG: v0.21.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 릴리스 대상 버전과 main 포함 여부 확인
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "0.21.0"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: main CI 및 임시 GHCR 검증 성공 확인
        id: main_ci
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 240); do
            runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=50")"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" ]]; then
              run_id="$(jq -r .id <<<"$run")"
              run_url="$(jq -r .html_url <<<"$run")"
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              echo "main CI #$run_id: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                test "$conclusion" = "success"
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "main CI 완료 대기 시간이 초과되었습니다." >&2
          exit 1

      - name: annotated release tag 생성 및 push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"
          else
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"

      - name: release image workflow 실행
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" \
            -f ref="$RELEASE_TAG"

      - name: GHCR release image workflow 성공 확인
        id: release
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 240); do
            runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=50")"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" ]]; then
              run_id="$(jq -r .id <<<"$run")"
              run_url="$(jq -r .html_url <<<"$run")"
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              echo "release run $run_id: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                test "$conclusion" = "success"
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "release workflow 완료 대기 시간이 초과되었습니다." >&2
          exit 1

      - name: Issue #76 작업 브랜치 정리
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/issue-76-project-workspace-ux"
            "feat/issue-76-project-workspace-ux-rebased"
            "feat/issue-76-project-workspace-ux-final"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            fi
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "작업 브랜치 삭제에 실패했습니다: $branch" >&2
              exit 1
            fi
          done

      - name: Issue #76 완료 기록 및 종료
        shell: bash
        env:
          MAIN_CI_URL: ${{ steps.main_ci.outputs.run_url }}
          RELEASE_RUN_URL: ${{ steps.release.outputs.run_url }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
Issue Lifecycle 완료:
- version: 0.21.0
- main CI/GHCR commit artifact validation: $MAIN_CI_URL
- GHCR release image: $RELEASE_RUN_URL
- release tag: $RELEASE_TAG
- Issue #76 작업 브랜치 정리 완료
EOF
)"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/76/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/76" -f state="closed" -f state_reason="completed"

      - name: 완료 요약
        shell: bash
        run: |
          {
            echo "## Issue #76 Lifecycle 완료"
            echo
            echo "- release tag: `$RELEASE_TAG`"
            echo "- main CI: ${{ steps.main_ci.outputs.run_url }}"
            echo "- GHCR release: ${{ steps.release.outputs.run_url }}"
            echo "- 작업 브랜치 3개 정리"
            echo "- Issue #76 closed"
          } >> "$GITHUB_STEP_SUMMARY"
