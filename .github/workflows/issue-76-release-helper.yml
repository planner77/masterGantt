name: Issue 76 릴리스 완료 자동화

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-76-release-helper.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release:
    name: v0.21.0 GHCR 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_TAG: v0.21.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 릴리스 대상 버전과 main 포함 여부 확인
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "0.21.0"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: main CI 및 임시 GHCR 검증 성공 확인
        id: main_ci
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 300); do
            runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=50")"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" ]]; then
              run_id="$(jq -r .id <<<"$run")"
              run_url="$(jq -r .html_url <<<"$run")"
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              echo "main CI #$run_id: 상태=$status 결과=$conclusion"
              if [[ "$status" == "completed" ]]; then
                test "$conclusion" = "success"
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "main CI 완료 대기 시간이 초과되었습니다." >&2
          exit 1

      - name: 기존 태그와 성공 릴리스 증거 확인
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          echo "already_successful=false" >> "$GITHUB_OUTPUT"
          echo "run_url=" >> "$GITHUB_OUTPUT"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$tag_commit" != "$TARGET_SHA" ]]; then
            echo "기존 태그가 현재 릴리스 대상과 다릅니다: $RELEASE_TAG -> $tag_commit" >&2
            exit 1
          fi

          runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
          successful="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG"             '[.workflow_runs[]
              | select(.head_sha == $sha and .head_branch == $tag and .status == "completed" and .conclusion == "success")]
             | sort_by(.created_at) | last // empty' <<<"$runs")"
          if [[ -n "$successful" ]]; then
            echo "기존 정식 릴리스 성공 증거를 확인했습니다. 게시를 반복하지 않고 정리 단계를 재개합니다."
            echo "already_successful=true" >> "$GITHUB_OUTPUT"
            echo "run_url=$(jq -r .html_url <<<"$successful")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "기존 태그는 있으나 성공한 정식 릴리스 증거가 없습니다: $RELEASE_TAG" >&2
          echo "실패한 릴리스 버전은 재사용하지 않고 새 PATCH 또는 prerelease 버전이 필요합니다." >&2
          exit 1

      - name: 주석 정식 릴리스 태그 생성 및 푸시
        if: steps.release_state.outputs.already_successful != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "릴리스 $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"

      - name: 정식 릴리스 이미지 워크플로 실행
        if: steps.release_state.outputs.already_successful != 'true'
        id: release_dispatch
        shell: bash
        run: |
          set -euo pipefail
          dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "dispatched_after=$dispatched_after" >> "$GITHUB_OUTPUT"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" \
            -f ref="$RELEASE_TAG"

      - name: GHCR 정식 릴리스 이미지 워크플로 성공 확인
        if: steps.release_state.outputs.already_successful != 'true'
        id: release
        shell: bash
        env:
          DISPATCHED_AFTER: ${{ steps.release_dispatch.outputs.dispatched_after }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 480); do
            runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=100")"
            run="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" --arg after "$DISPATCHED_AFTER"               '[.workflow_runs[]
                | select(.head_sha == $sha and .head_branch == $tag and .created_at >= $after)]
               | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" ]]; then
              run_id="$(jq -r .id <<<"$run")"
              run_url="$(jq -r .html_url <<<"$run")"
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              echo "정식 릴리스 실행 #$run_id: 상태=$status 결과=$conclusion"
              if [[ "$status" == "completed" ]]; then
                test "$conclusion" = "success"
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "정식 릴리스 워크플로 완료 대기 시간이 초과되었습니다." >&2
          exit 1

      - name: 정식 릴리스 증거 정리
        id: release_evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.release_state.outputs.already_successful }}" == "true" ]]; then
            echo "run_url=${{ steps.release_state.outputs.run_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_url=${{ steps.release.outputs.run_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Issue #76 작업 브랜치 안전 정리
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/issue-76-project-workspace-ux"
            "feat/issue-76-project-workspace-ux-rebased"
            "feat/issue-76-project-workspace-ux-final"
          )
          deleted=()
          retained=()
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded")"
            if [[ "$http_status" == "404" ]]; then
              echo "이미 없는 작업 브랜치: $branch"
              rm -f "$response_file"
              continue
            fi
            if [[ "$http_status" != "200" ]]; then
              echo "작업 브랜치 조회에 실패했습니다: $branch (HTTP $http_status)" >&2
              cat "$response_file" >&2
              rm -f "$response_file"
              exit 1
            fi
            branch_json="$(cat "$response_file")"
            rm -f "$response_file"
            head_sha="$(jq -r '.commit.sha' <<<"$branch_json")"
            protected="$(jq -r '.protected' <<<"$branch_json")"
            if [[ "$protected" == "true" ]]; then
              echo "보호 브랜치는 삭제하지 않습니다: $branch"
              retained+=("$branch")
              continue
            fi
            owner="${GITHUB_REPOSITORY%%/*}"
            open_head="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$branch&per_page=1" --jq 'length')"
            open_base="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=$branch&per_page=1" --jq 'length')"
            if [[ "$open_head" != "0" || "$open_base" != "0" ]]; then
              echo "다른 열린 PR이 참조 중이어서 보존합니다: $branch"
              retained+=("$branch")
              continue
            fi
            git fetch --quiet --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            incorporated=false
            if git merge-base --is-ancestor "$head_sha" "$TARGET_SHA"; then
              incorporated=true
            else
              merged_pr_count="$(gh api                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "/repos/$GITHUB_REPOSITORY/commits/$head_sha/pulls"                 --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.sha == "'"$head_sha"'")] | length')"
              if [[ "$merged_pr_count" != "0" ]]; then
                incorporated=true
                echo "squash/rebase 병합 PR 증거로 main 반영을 확인했습니다: $branch @ $head_sha"
              fi
            fi
            if [[ "$incorporated" != "true" ]]; then
              echo "main 반영 증거가 확인되지 않아 보존합니다: $branch @ $head_sha"
              retained+=("$branch")
              continue
            fi
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded" --jq '.object.sha')"
            if [[ "$current_sha" != "$head_sha" ]]; then
              echo "삭제 직전 tip 변경을 감지해 보존합니다: $branch"
              retained+=("$branch")
              continue
            fi
            open_head="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$branch&per_page=1" --jq 'length')"
            open_base="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=$branch&per_page=1" --jq 'length')"
            if [[ "$open_head" != "0" || "$open_base" != "0" ]]; then
              echo "삭제 직전 새 PR 참조를 감지해 보존합니다: $branch"
              retained+=("$branch")
              continue
            fi
            echo "SHA 조건부 삭제 대상: $branch @ $head_sha"
            git push --porcelain --force-with-lease="refs/heads/$branch:$head_sha" origin ":refs/heads/$branch" >/dev/null
            if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded" >/dev/null 2>&1; then
              echo "작업 브랜치 삭제 후 ref가 남아 있습니다: $branch" >&2
              exit 1
            fi
            deleted+=("$branch")
          done
          {
            echo "deleted=${deleted[*]:-없음}"
            echo "retained=${retained[*]:-없음}"
          } >> "$GITHUB_OUTPUT"

      - name: Issue #76 완료 기록 및 종료
        shell: bash
        env:
          MAIN_CI_URL: ${{ steps.main_ci.outputs.run_url }}
          RELEASE_RUN_URL: ${{ steps.release_evidence.outputs.run_url }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
Issue Lifecycle 완료:
- 버전: 0.21.0
- main CI/임시 GHCR 커밋 이미지 검증: $MAIN_CI_URL
- GHCR 정식 릴리스 이미지: $RELEASE_RUN_URL
- 정식 릴리스 태그: $RELEASE_TAG
- 안전 조건 충족 후 삭제한 브랜치: ${{ steps.cleanup.outputs.deleted }}
- 미병합/참조/보호 등 안전 조건 때문에 보존한 브랜치: ${{ steps.cleanup.outputs.retained }}
EOF
)"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/76/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/76" -f state="closed" -f state_reason="completed"

      - name: 완료 요약
        shell: bash
        run: |
          {
            echo "## Issue #76 Lifecycle 완료"
            echo
            echo "- 정식 릴리스 태그: $RELEASE_TAG"
            echo "- main CI/임시 GHCR 커밋 이미지 검증: ${{ steps.main_ci.outputs.run_url }}"
            echo "- GHCR 정식 릴리스: ${{ steps.release_evidence.outputs.run_url }}"
            echo "- 삭제한 브랜치: ${{ steps.cleanup.outputs.deleted }}"
            echo "- 안전 조건 때문에 보존한 브랜치: ${{ steps.cleanup.outputs.retained }}"
            echo "- Issue #76 종료 완료"
          } >> "$GITHUB_STEP_SUMMARY"
