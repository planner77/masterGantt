name: Issue 76 릴리스 완료 자동화

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-76-release-helper.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release:
    name: v0.21.0 GHCR 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_TAG: v0.21.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Issue #76 승인된 릴리스 Lifecycle 완료
        shell: bash
        run: |
          set -euo pipefail

          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "0.21.0"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          echo "main CI와 임시 GHCR 검증 완료를 기다립니다."
          main_ci_url=""
          for _ in $(seq 1 300); do
            runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=50")"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" ]]; then
              run_id="$(jq -r .id <<<"$run")"
              main_ci_url="$(jq -r .html_url <<<"$run")"
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              echo "main CI #$run_id: 상태=$status 결과=$conclusion"
              if [[ "$status" == "completed" ]]; then
                test "$conclusion" = "success"
                break
              fi
            fi
            sleep 15
          done
          test -n "$main_ci_url"
          main_ci_conclusion="$(gh api "$main_ci_url" 2>/dev/null || true)"
          # URL은 완료 증거 기록용이며 실제 판정은 위 API 응답의 success로 끝난다.

          release_run_url=""
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
            test "$tag_commit" = "$TARGET_SHA"
            runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
            successful="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -z "$successful" ]]; then
              echo "기존 태그는 있으나 성공한 정식 릴리스 증거가 없습니다: $RELEASE_TAG" >&2
              echo "실패한 릴리스 버전은 재사용하지 않습니다." >&2
              exit 1
            fi
            release_run_url="$(jq -r .html_url <<<"$successful")"
            echo "기존 성공 릴리스를 확인해 게시를 반복하지 않고 정리 단계를 재개합니다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "릴리스 $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"

            dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api --method POST               -H "Accept: application/vnd.github+json"               "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches"               -f ref="$RELEASE_TAG"

            for _ in $(seq 1 480); do
              runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=100")"
              run="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" --arg after "$dispatched_after" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .created_at >= $after)] | sort_by(.created_at) | last // empty' <<<"$runs")"
              if [[ -n "$run" ]]; then
                run_id="$(jq -r .id <<<"$run")"
                release_run_url="$(jq -r .html_url <<<"$run")"
                status="$(jq -r .status <<<"$run")"
                conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
                echo "정식 릴리스 #$run_id: 상태=$status 결과=$conclusion"
                if [[ "$status" == "completed" ]]; then
                  test "$conclusion" = "success"
                  break
                fi
              fi
              sleep 15
            done
            test -n "$release_run_url"
          fi

          pr94="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/94")"
          test "$(jq -r '.merged_at // ""' <<<"$pr94")" != ""
          test "$(jq -r '.base.ref' <<<"$pr94")" = "main"

          branches=(
            "feat/issue-76-project-workspace-ux"
            "feat/issue-76-project-workspace-ux-rebased"
            "feat/issue-76-project-workspace-ux-final"
          )
          deleted=()
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            response_file="$(mktemp)"
            http_status="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}'               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded")"
            if [[ "$http_status" == "404" ]]; then
              echo "이미 없는 작업 브랜치: $branch"
              rm -f "$response_file"
              continue
            fi
            if [[ "$http_status" != "200" ]]; then
              echo "작업 브랜치 조회 실패: $branch (HTTP $http_status)" >&2
              cat "$response_file" >&2
              rm -f "$response_file"
              exit 1
            fi
            branch_json="$(cat "$response_file")"
            rm -f "$response_file"
            head_sha="$(jq -r '.commit.sha' <<<"$branch_json")"
            protected="$(jq -r '.protected' <<<"$branch_json")"
            test "$protected" = "false"

            owner="${GITHUB_REPOSITORY%%/*}"
            open_head="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$branch&per_page=1" --jq 'length')"
            open_base="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=$branch&per_page=1" --jq 'length')"
            test "$open_head" = "0"
            test "$open_base" = "0"

            if [[ "$branch" == "feat/issue-76-project-workspace-ux-final" ]]; then
              git fetch --quiet --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
              git merge-base --is-ancestor "$head_sha" "$TARGET_SHA"
            else
              closed_pr_count="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$owner:$branch&per_page=20" --jq 'length')"
              test "$closed_pr_count" != "0"
            fi

            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded" --jq '.object.sha')"
            test "$current_sha" = "$head_sha"
            git push --porcelain --force-with-lease="refs/heads/$branch:$head_sha" origin ":refs/heads/$branch" >/dev/null

            set +e
            git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1
            verify_rc=$?
            set -e
            if [[ "$verify_rc" != "2" ]]; then
              echo "작업 브랜치 삭제 확인 실패: $branch (git ls-remote rc=$verify_rc)" >&2
              exit 1
            fi
            deleted+=("$branch")
          done

          deleted_text="${deleted[*]:-이미 없음}"
          body="$(printf '%s\n' \
            "Issue Lifecycle 완료:" \
            "- 버전: 0.21.0" \
            "- main CI/임시 GHCR 커밋 이미지 검증: $main_ci_url" \
            "- GHCR 정식 릴리스 이미지: $release_run_url" \
            "- 정식 릴리스 태그: $RELEASE_TAG" \
            "- 삭제한 Issue #76 작업 브랜치: $deleted_text")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/76/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/76" -f state="closed" -f state_reason="completed"

          {
            echo "## Issue #76 Lifecycle 완료"
            echo
            echo "- 정식 릴리스 태그: $RELEASE_TAG"
            echo "- main CI/임시 GHCR 검증: $main_ci_url"
            echo "- GHCR 정식 릴리스: $release_run_url"
            echo "- 삭제한 작업 브랜치: $deleted_text"
            echo "- Issue #76 종료 완료"
          } >> "$GITHUB_STEP_SUMMARY"
