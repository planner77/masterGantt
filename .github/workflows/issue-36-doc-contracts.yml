name: Issue 36 one-time contract docs update

on:
  push:
    branches:
      - feature/issue-36-task-editor-fields
    paths:
      - .release/issue-36-doc-contracts.trigger

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Update API and DB source-of-truth documents
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/API.md",
              '  "progress": 25,\n  "parentExternalId": null,',
              '  "progress": 25,\n  "description": "Foundation work",\n  "url": "https://intranet.example/tasks/ACT-100",\n  "parentExternalId": null,',
          )
          replace_once(
              "docs/API.md",
              '  "name": "Foundation",\n  "type": "task",',
              '  "name": "Foundation",\n  "description": "기초 작업 상세 설명",\n  "url": "https://intranet.example/tasks/ACT-100",\n  "type": "task",',
          )
          replace_once(
              "docs/API.md",
              'Strict 입력은 `externalId?`, `parentTaskId?`, `convertParentToSummary?: true`, `name`, `type`, `scheduleMode?`, `start`, `end?`, `duration`, `progress`, `parentExternalId?: null`이다.',
              'Strict 입력은 `externalId?`, `parentTaskId?`, `convertParentToSummary?: true`, `name`, `description?`, `url?`, `type`, `scheduleMode?`, `start`, `end?`, `duration`, `progress`, `parentExternalId?: null`이다.',
          )
          replace_once(
              "docs/API.md",
              'Mutable allowlist는 `name`, `scheduleMode`, `start`, `duration`, `progress`, optional assertion `end`다.',
              'Mutable allowlist는 `name`, `description`, `url`, `scheduleMode`, `start`, `duration`, `progress`, optional assertion `end`다. `description`은 최대 10,000 Unicode code point이며 공백만 입력하면 `null`로 정규화한다. `url`은 trim 후 최대 4,096 code point의 `http:`/`https:` URL만 허용하고 `javascript:`, `data:`, `vbscript:`, `file:` 등 다른 scheme은 거부한다.',
          )
          replace_once(
              "docs/DB_SCHEMA.md",
              '| `name` | TEXT | N | trim 후 빈 문자열 불가 |\n| `type` | TEXT | N | `task`, `summary`, `milestone` CHECK |',
              '| `name` | TEXT | N | trim 후 빈 문자열 불가 |\n| `description` | TEXT | Y | 작업 다중 행 설명, 공백-only 입력은 API에서 NULL 정규화 |\n| `url` | TEXT | Y | 작업 링크. API에서 `http:`/`https:`만 허용 |\n| `type` | TEXT | N | `task`, `summary`, `milestone` CHECK |',
          )
      - name: Commit docs and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-36-doc-contracts.yml .release/issue-36-doc-contracts.trigger
          git add docs/API.md docs/DB_SCHEMA.md
          git commit -m "docs: Task Description과 URL API·DB 계약 갱신 (#36)"
          git push origin HEAD:feature/issue-36-task-editor-fields
