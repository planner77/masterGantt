name: Issue 84 릴리스 완료 자동화

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-84-release-helper.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release:
    name: v0.25.0 GHCR 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_TAG: v0.25.0
      WORK_BRANCH: feat/issue-84-project-list-search-v2
      RELEASE_BRANCH: chore/issue-84-release-finalization
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 승인된 Issue #84 Lifecycle 완료
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "0.25.0"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          pr114="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/114")"
          test "$(jq -r '.merged_at // ""' <<<"$pr114")" != ""
          test "$(jq -r '.base.ref' <<<"$pr114")" = "main"
          app_sha="$(jq -r '.merge_commit_sha' <<<"$pr114")"
          app_head_sha="$(jq -r '.head.sha' <<<"$pr114")"
          test -n "$app_sha"
          test -n "$app_head_sha"
          git merge-base --is-ancestor "$app_sha" "$TARGET_SHA"

          main_ci_url=""
          for _ in $(seq 1 300); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=50")"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
              test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
              main_ci_url="$(jq -r .html_url <<<"$run")"
              break
            fi
            sleep 15
          done
          test -n "$main_ci_url"

          tag_existed=false
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_existed=true
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"

          release_run_url=""
          existing_runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
          successful="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$existing_runs")"
          if [[ -n "$successful" ]]; then
            release_run_url="$(jq -r .html_url <<<"$successful")"
          else
            if [[ "$tag_existed" == "true" ]]; then
              echo "기존 $RELEASE_TAG 태그에 동일 target의 성공 release 증거가 없습니다. 실패한 version/tag는 재사용하지 않습니다." >&2
              exit 1
            fi
            dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" -f ref="$RELEASE_TAG"
            for _ in $(seq 1 480); do
              runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=100")"
              run="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" --arg after "$dispatched_after" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .created_at >= $after)] | sort_by(.created_at) | last // empty' <<<"$runs")"
              if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
                test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
                release_run_url="$(jq -r .html_url <<<"$run")"
                break
              fi
              sleep 15
            done
          fi
          test -n "$release_run_url"

          owner="${GITHUB_REPOSITORY%%/*}"
          cleanup_branch_safely() {
            branch="$1"
            expected_head="${2:-}"
            encoded="${branch//\//%2F}"
            branch_http="$(curl -sSLo /tmp/branch.json -w '%{http_code}' -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded")"
            if [[ "$branch_http" == "404" ]]; then
              return 0
            fi
            test "$branch_http" = "200"
            branch_sha="$(jq -r '.commit.sha' /tmp/branch.json)"

            if [[ -n "$expected_head" ]]; then
              test "$branch_sha" = "$expected_head"
              merged_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$owner:$branch&base=main&per_page=100" --jq "[.[] | select(.merged_at != null and .head.sha == \"$branch_sha\")] | sort_by(.merged_at) | last // empty")"
            else
              prs="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$owner:$branch&base=main&per_page=100")"
              merged_pr="$(jq -c --arg sha "$branch_sha" '[.[] | select(.merged_at != null and .head.sha == $sha)] | sort_by(.merged_at) | last // empty' <<<"$prs")"
            fi
            test -n "$merged_pr"
            merged_head_sha="$(jq -r .head.sha <<<"$merged_pr")"
            merged_commit_sha="$(jq -r .merge_commit_sha <<<"$merged_pr")"
            test "$branch_sha" = "$merged_head_sha"
            test -n "$merged_commit_sha"
            git merge-base --is-ancestor "$merged_commit_sha" "$TARGET_SHA"
            test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$branch&per_page=1" --jq 'length')" = "0"
            test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=$branch&per_page=1" --jq 'length')" = "0"
            git push --porcelain --force-with-lease="refs/heads/$branch:$branch_sha" origin ":refs/heads/$branch" >/dev/null
          }

          cleanup_branch_safely "$WORK_BRANCH" "$app_head_sha"
          cleanup_branch_safely "$RELEASE_BRANCH"

          release_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$owner:$RELEASE_BRANCH&base=main&per_page=100" --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number')"
          body="$(printf '%s\n' \
            "Issue Lifecycle 완료:" \
            "- 기능 PR: #114" \
            "- 릴리스 마무리 PR: #$release_pr" \
            "- 버전: 0.25.0" \
            "- 기능 병합 SHA: $app_sha" \
            "- 릴리스 기준 SHA: $TARGET_SHA" \
            "- main CI: $main_ci_url" \
            "- GHCR 정식 릴리스 이미지: $release_run_url" \
            "- 정식 릴리스 태그: $RELEASE_TAG" \
            "- 작업 브랜치 정리: $WORK_BRANCH, $RELEASE_BRANCH" \
            "- branch cleanup safety: remote tip == merged PR head + merged commit ancestor + force-with-lease")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/84/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/84" -f state="closed" -f state_reason="completed"
