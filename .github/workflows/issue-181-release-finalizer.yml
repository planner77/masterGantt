name: Issue 181 release finalizer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-181-release-finalizer.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  finalize:
    name: v0.34.1 release, cleanup, and close
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RELEASE_TAG: v0.34.1
      RELEASE_VERSION: "0.34.1"
      FEATURE_BRANCH: fix/issue-181-project-filter-density
      FEATURE_PR: "205"
      FEATURE_HEAD_SHA: dc46ed20c6444895b321c3ff525a84ddee68337d
      FEATURE_MERGE_SHA: 1dea2ab7897ceeebc22f5fa0ee025fbfe1690ee3
      FINALIZER_BRANCH: rebase/issue-181-main-sync
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release prerequisites and finalizer PR
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$GITHUB_SHA"

          test "$(git show "$target_sha:package.json" | jq -r .version)" = "$RELEASE_VERSION"
          test "$(git show "$target_sha:package-lock.json" | jq -r .version)" = "$RELEASE_VERSION"
          test "$(git show "$target_sha:package-lock.json" | jq -r '.packages[""].version')" = "$RELEASE_VERSION"
          git merge-base --is-ancestor "$FEATURE_MERGE_SHA" "$target_sha"

          feature_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$FEATURE_PR")"
          test "$(jq -r '.merged_at // ""' <<<"$feature_pr")" != ""
          test "$(jq -r '.head.sha' <<<"$feature_pr")" = "$FEATURE_HEAD_SHA"

          owner="${GITHUB_REPOSITORY%%/*}"
          finalizer_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&head=$owner:$FINALIZER_BRANCH&per_page=10" | jq -r '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number // empty')"
          test -n "$finalizer_pr"
          echo "FINALIZER_PR=$finalizer_pr" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"

      - name: Wait for main CI success
        shell: bash
        run: |
          set -euo pipefail
          main_ci_url=""
          for _ in $(seq 1 300); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=50")"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
              test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
              main_ci_url="$(jq -r .html_url <<<"$run")"
              break
            fi
            sleep 15
          done
          test -n "$main_ci_url"
          echo "MAIN_CI_URL=$main_ci_url" >> "$GITHUB_ENV"

      - name: Create annotated tag and complete release-image workflow
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"

          release_run_url=""
          release_run_id=""
          existing_runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
          successful="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$existing_runs")"
          if [[ -n "$successful" ]]; then
            release_run_url="$(jq -r .html_url <<<"$successful")"
            release_run_id="$(jq -r .id <<<"$successful")"
          else
            dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" -f ref="$RELEASE_TAG"
            for _ in $(seq 1 480); do
              runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=100")"
              run="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" --arg after "$dispatched_after" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .created_at >= $after)] | sort_by(.created_at) | last // empty' <<<"$runs")"
              if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
                test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
                release_run_url="$(jq -r .html_url <<<"$run")"
                release_run_id="$(jq -r .id <<<"$run")"
                break
              fi
              sleep 15
            done
          fi
          test -n "$release_run_url"
          test -n "$release_run_id"
          echo "RELEASE_RUN_URL=$release_run_url" >> "$GITHUB_ENV"
          echo "RELEASE_RUN_ID=$release_run_id" >> "$GITHUB_ENV"

      - name: Safely delete Issue 181 branches
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/safe_branch_cleanup.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$FEATURE_PR" \
            --branch "$FEATURE_BRANCH" \
            --target-sha "$TARGET_SHA" \
            --delete

          python3 scripts/safe_branch_cleanup.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$FINALIZER_PR" \
            --branch "$FINALIZER_BRANCH" \
            --target-sha "$TARGET_SHA" \
            --delete

      - name: Record final evidence and close Issue 181
        shell: bash
        run: |
          set -euo pipefail
          body="$(printf '%s\n' \
            '## FINAL · Issue #181 완료' \
            '' \
            '**최종 상태:** COMPLETED' \
            '' \
            '- 기능 PR: #205 (merged)' \
            "- release finalizer PR: #$FINALIZER_PR (merged)" \
            "- 최종 main SHA: $TARGET_SHA" \
            '- 최종 버전: 0.34.1' \
            '- 정식 annotated tag: v0.34.1' \
            '- GHCR exact image: ghcr.io/planner77/mastergantt:0.34.1' \
            "- main CI: $MAIN_CI_URL" \
            "- release workflow: $RELEASE_RUN_URL" \
            "- branch cleanup: $FEATURE_BRANCH / $FINALIZER_BRANCH" \
            '- release_required=true / release_authorized=true' \
            '- 잔여 차단 사항: 없음')"

          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/181/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/181" -f state=closed -f state_reason=completed
