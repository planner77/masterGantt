name: Sync PR39 version

on:
  push:
    branches:
      - feat/issues-27-33-35-36-37

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issues-27-33-35-36-37
      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: package 버전을 0.8.0으로 동기화
        run: npm version 0.8.0 --no-git-tag-version
      - name: 임시 동기화 workflow 제거 및 반영
        run: |
          git rm .github/workflows/sync-pr39-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: 버전을 0.8.0으로 동기화"
          git push origin HEAD:feat/issues-27-33-35-36-37
