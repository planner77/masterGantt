name: Issue 19 Prepare

on:
  push:
    branches: [feat/issue-19-resource-catalog]
    paths:
      - .github/workflows/issue19-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    name: Issue 19 version and schema test preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Bump version and update schema expectations
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.12.0 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/server/db/database.test.ts')
          text = path.read_text(encoding='utf-8')
          old = 'expect(migrations.applied).toEqual(["0001_initial_schema.sql", "0002_task_description_url.sql"]);'
          new = '''expect(migrations.applied).toEqual([\n        "0001_initial_schema.sql",\n        "0002_task_description_url.sql",\n        "0003_resource_catalog.sql",\n      ]);'''
          if old not in text:
              raise SystemExit('migration expectation anchor not found')
          text = text.replace(old, new, 1)

          old = '''      expect(tables).toEqual([\n        "edit_sessions",\n        "links",\n        "project_holidays",\n        "projects",\n        "schema_migrations",\n        "tasks",\n      ]);'''
          new = '''      expect(tables).toEqual([\n        "edit_sessions",\n        "links",\n        "project_holidays",\n        "projects",\n        "resource_catalog_admin_sessions",\n        "resource_catalog_state",\n        "resource_group_members",\n        "resource_groups",\n        "resources",\n        "schema_migrations",\n        "task_assignments",\n        "tasks",\n      ]);'''
          if old not in text:
              raise SystemExit('table expectation anchor not found')
          text = text.replace(old, new, 1)

          old = '''      expect(indexes).toEqual([\n        "edit_sessions_project_expires_idx",\n        "links_project_predecessor_idx",\n        "links_project_successor_idx",\n        "tasks_project_parent_idx",\n        "tasks_project_sort_order_idx",\n      ]);'''
          new = '''      expect(indexes).toEqual([\n        "edit_sessions_project_expires_idx",\n        "links_project_predecessor_idx",\n        "links_project_successor_idx",\n        "resource_admin_sessions_expiry_idx",\n        "resource_group_members_resource_idx",\n        "task_assignments_group_idx",\n        "task_assignments_group_unique_idx",\n        "task_assignments_project_task_idx",\n        "task_assignments_resource_idx",\n        "task_assignments_resource_unique_idx",\n        "tasks_project_parent_idx",\n        "tasks_project_sort_order_idx",\n      ]);'''
          if old not in text:
              raise SystemExit('index expectation anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '## [Unreleased]\n\n'
          section = '''## [0.12.0] - 2026-09-15\n\n### Added\n\n- Issue #19: 프로젝트에 종속되지 않는 글로벌 리소스와 리소스 그룹을 관리하고, Task/Summary/Milestone에 개별 리소스 또는 그룹을 직접 할당·해제할 수 있다.\n- 별도 `resource_catalog_admin` 세션, catalog revision, Project revision 기반 동시성 검증과 SQLite `0003_resource_catalog.sql` migration을 추가한다.\n- `/resources` 관리 화면과 Task Editor의 리소스/그룹 다중 할당 UI를 추가한다. SVAR PRO Resource API는 사용하지 않는다.\n\n### Changed\n\n- Assignment PUT 성공 응답을 `project`, `tasks`, `links`, `assignments` 전체 canonical aggregate와 strong Project ETag를 반환하는 계약으로 확정한다.\n- 사용자 workflow와 API/DB 계약을 하위 호환으로 확장하므로 Semantic Versioning 정책에 따라 `0.11.1`에서 `0.12.0`으로 증가한다.\n\n'''
          if anchor not in text:
              raise SystemExit('changelog anchor not found')
          changelog.write_text(text.replace(anchor, anchor + section, 1), encoding='utf-8')
          PY
      - name: Verify generated version files
        run: node scripts/verify-release-version.mjs
      - name: Commit preparation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md tests/server/db/database.test.ts
          git commit -m "chore: Issue 19 버전 0.12.0 및 schema 테스트 갱신 (#19)"
          git push origin HEAD:feat/issue-19-resource-catalog
