name: 범용 Release Completion Finalizer

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Finalizer Resume · explicit handoff · {0} · Release Run {1} · Resume Run #{2}.{3}', inputs.target_sha, inputs.release_run_id, github.run_number, github.run_attempt) || format('Finalizer Resume · {0} · Resume Run #{1}.{2}', github.event.workflow_run.display_title, github.run_number, github.run_attempt) }}

on:
  workflow_run:
    workflows: ["Publish release image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "완료된 release가 검증한 exact main merge SHA"
        required: true
        type: string
      release_run_id:
        description: "완료 evidence를 기다릴 source Publish release image run ID"
        required: true
        type: string

concurrency:
  # Main CI finalizer와 동일 group을 공유해 first-parent lifecycle mutation을 직렬화한다.
  group: mastergantt-release-finalizer
  queue: max

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read
  packages: write

jobs:
  resume:
    name: Release 완료 후 정확한 Merge Lifecycle Resume
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # workflow_run은 tag/manual ref를 가리킬 수 있다. write 권한 workflow에서
      # triggering ref의 repository code를 실행하지 않고 trusted default branch만 실행한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: release 완료 target SHA 검증
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release resume target SHA 형식이 올바르지 않습니다: $TARGET_SHA" >&2
            exit 1
          }

      - name: explicit source Release 완료 evidence 대기
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "Release run ID 형식이 올바르지 않습니다: $RELEASE_RUN_ID" >&2
            exit 1
          }

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
            status="$(jq -r '.status // empty' <<<"$run_json")"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
              head_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
              workflow_path="$(jq -r '.path // empty' <<<"$run_json")"
              [[ "$workflow_path" == ".github/workflows/release-image.yml" ]] || {
                echo "Unexpected source workflow: $workflow_path" >&2
                exit 1
              }
              [[ "$head_sha" == "$TARGET_SHA" ]] || {
                echo "Release source SHA mismatch: $head_sha != $TARGET_SHA" >&2
                exit 1
              }
              [[ "$conclusion" == "success" ]] || {
                echo "Release source run did not succeed: $conclusion" >&2
                exit 1
              }
              echo "Source Release 완료 확인: run=$RELEASE_RUN_ID sha=$TARGET_SHA"
              sleep 2
              exit 0
            fi
            sleep 5
          done

          echo "Source Release run 완료를 제한 시간 안에 확인하지 못했습니다: $RELEASE_RUN_ID" >&2
          exit 1

      - name: release 완료 evidence로 lifecycle 재개
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.workflow_run.head_sha }}
        run: python3 scripts/auto_release_finalizer.py --target-sha "$TARGET_SHA"
