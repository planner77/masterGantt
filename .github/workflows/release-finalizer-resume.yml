name: 범용 Release Completion Finalizer

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Finalizer Resume · explicit handoff · {0} · Resume Run #{1}.{2}', inputs.target_sha, github.run_number, github.run_attempt) || format('Finalizer Resume · {0} · Resume Run #{1}.{2}', github.event.workflow_run.display_title, github.run_number, github.run_attempt) }}

on:
  workflow_run:
    workflows: ["Publish release image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "완료된 release가 검증한 exact main merge SHA"
        required: true
        type: string

concurrency:
  # Main CI finalizer와 동일 group을 공유해 first-parent lifecycle mutation을 직렬화한다.
  group: mastergantt-release-finalizer
  queue: max

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: read

jobs:
  resume:
    name: Release 완료 후 정확한 Merge Lifecycle Resume
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # workflow_run은 tag/manual ref를 가리킬 수 있다. write 권한 workflow에서
      # triggering ref의 repository code를 실행하지 않고 trusted default branch만 실행한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: release 완료 target SHA 검증
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release resume target SHA 형식이 올바르지 않습니다: $TARGET_SHA" >&2
            exit 1
          }

      - name: release 완료 evidence로 lifecycle 재개
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.workflow_run.head_sha }}
        run: python3 scripts/auto_release_finalizer.py --target-sha "$TARGET_SHA"
