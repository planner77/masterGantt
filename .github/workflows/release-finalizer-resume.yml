name: 범용 Release Completion Finalizer

run-name: "Finalizer Resume · ${{ github.event.workflow_run.display_title }} · Resume Run #${{ github.run_number }}.${{ github.run_attempt }}"

on:
  workflow_run:
    workflows: ["Publish release image"]
    types: [completed]

concurrency:
  # Main CI finalizer와 동일 group을 공유해 first-parent lifecycle mutation을 직렬화한다.
  group: mastergantt-release-finalizer
  queue: max

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: read

jobs:
  resume:
    name: Release 완료 후 정확한 Merge Lifecycle Resume
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: release 완료 evidence로 lifecycle 재개
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/auto_release_finalizer.py --target-sha "$TARGET_SHA"
