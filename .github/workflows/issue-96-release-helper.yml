name: Issue 96 릴리스 완료 자동화

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-96-release-helper.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release:
    name: v0.21.1 GHCR 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_TAG: v0.21.1
      WORK_BRANCH: feat/issue-96-task-editor-density
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 승인된 Issue #96 Lifecycle 완료
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "0.21.1"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          main_ci_url=""
          main_ci_success=false
          for _ in $(seq 1 300); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=50")"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" ]]; then
              main_ci_url="$(jq -r .html_url <<<"$run")"
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              if [[ "$status" == "completed" ]]; then
                test "$conclusion" = "success"
                main_ci_success=true
                break
              fi
            fi
            sleep 15
          done
          test -n "$main_ci_url"
          test "$main_ci_success" = "true"

          release_run_url=""
          release_success=false
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
            successful="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -z "$successful" ]]; then
              echo "기존 태그는 있으나 성공한 정식 릴리스 증거가 없습니다: $RELEASE_TAG" >&2
              exit 1
            fi
            release_run_url="$(jq -r .html_url <<<"$successful")"
            release_success=true
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"

            dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" -f ref="$RELEASE_TAG"

            for _ in $(seq 1 480); do
              runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=100")"
              run="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" --arg after "$dispatched_after" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .created_at >= $after)] | sort_by(.created_at) | last // empty' <<<"$runs")"
              if [[ -n "$run" ]]; then
                release_run_url="$(jq -r .html_url <<<"$run")"
                status="$(jq -r .status <<<"$run")"
                conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
                if [[ "$status" == "completed" ]]; then
                  test "$conclusion" = "success"
                  release_success=true
                  break
                fi
              fi
              sleep 15
            done
          fi
          test -n "$release_run_url"
          test "$release_success" = "true"

          owner="${GITHUB_REPOSITORY%%/*}"
          encoded="${WORK_BRANCH//\//%2F}"
          branch_response="$(mktemp)"
          branch_http="$(curl --silent --show-error --location --output "$branch_response" --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded")"
          if [[ "$branch_http" == "404" ]]; then
            echo "이미 없는 작업 브랜치: $WORK_BRANCH"
            rm -f "$branch_response"
          elif [[ "$branch_http" != "200" ]]; then
            echo "작업 브랜치 조회 실패: $WORK_BRANCH (HTTP $branch_http)" >&2
            cat "$branch_response" >&2
            rm -f "$branch_response"
            exit 1
          else
            branch_sha="$(jq -r '.commit.sha' < "$branch_response")"
            protected="$(jq -r '.protected' < "$branch_response")"
            rm -f "$branch_response"
            test "$protected" = "false"

            open_head="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$WORK_BRANCH&per_page=1" --jq 'length')"
            open_base="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=$WORK_BRANCH&per_page=1" --jq 'length')"
            test "$open_head" = "0"
            test "$open_base" = "0"

            git fetch --quiet --no-tags origin "refs/heads/$WORK_BRANCH:refs/remotes/origin/$WORK_BRANCH"
            git merge-base --is-ancestor "$branch_sha" "$TARGET_SHA"
            current_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded" --jq '.object.sha')"
            test "$current_sha" = "$branch_sha"

            open_head="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$WORK_BRANCH&per_page=1" --jq 'length')"
            open_base="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=$WORK_BRANCH&per_page=1" --jq 'length')"
            test "$open_head" = "0"
            test "$open_base" = "0"

            git push --porcelain --force-with-lease="refs/heads/$WORK_BRANCH:$branch_sha" origin ":refs/heads/$WORK_BRANCH" >/dev/null
            set +e
            git ls-remote --exit-code --heads origin "refs/heads/$WORK_BRANCH" >/dev/null 2>&1
            verify_rc=$?
            set -e
            if [[ "$verify_rc" != "2" ]]; then
              echo "작업 브랜치 삭제 확인 실패: $WORK_BRANCH (git ls-remote rc=$verify_rc)" >&2
              exit 1
            fi
          fi

          body="$(printf '%s\n'             "Issue Lifecycle 완료:"             "- 버전: 0.21.1"             "- main CI/임시 GHCR 검증: $main_ci_url"             "- GHCR 정식 릴리스 이미지: $release_run_url"             "- 정식 릴리스 태그: $RELEASE_TAG"             "- 작업 브랜치 정리: $WORK_BRANCH")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/96/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/96" -f state="closed" -f state_reason="completed"
