name: GHCR 임시 이미지 보관 정책 적용

on:
  push:
    branches:
      - chore/ghcr-ephemeral-cleanup

permissions:
  contents: write

jobs:
  apply:
    name: workflow와 운영 문서 갱신
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/ghcr-ephemeral-cleanup
      - name: GHCR 임시 이미지 자동 삭제 정책 반영
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-ghcr-ephemeral-policy.py
          rm scripts/apply-ghcr-ephemeral-policy.py
          rm .github/workflows/apply-ghcr-ephemeral-policy.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs .github/workflows scripts/delete-ghcr-package-version-by-tag.mjs
          git commit -m "ci: GHCR 임시 이미지 검증 후 자동 삭제"
          git push origin HEAD:chore/ghcr-ephemeral-cleanup
