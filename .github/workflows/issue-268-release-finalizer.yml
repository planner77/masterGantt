name: Issue 268 release finalizer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-268-release-finalizer.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release_finalize:
    name: v0.53.4 release and close Issue 268
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FEATURE_PR: "276"
      FINALIZER_BRANCH: ops/issue-268-release-finalize
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve finalizer PR and safely remove finalizer branch
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          finalizer_pr="$(
            gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&head=$owner:$FINALIZER_BRANCH&per_page=20" |
              jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)] | last | .number // empty'
          )"
          test -n "$finalizer_pr"
          python3 scripts/safe_branch_cleanup.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$finalizer_pr" \
            --branch "$FINALIZER_BRANCH" \
            --target-sha "$GITHUB_SHA" \
            --delete

      - name: Release v0.53.4, clean feature branch, and close Issue 268
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue_lifecycle.py release_finalize \
            --issue 268 \
            --pr "$FEATURE_PR" \
            --release-required true \
            --release-authorized true \
            --expected-version 0.53.4 \
            --authorization-note "User explicitly requested merge, main CI, GHCR publish, and release finalize for Issue #268 on 2026-09-29."
