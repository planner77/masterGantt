name: Issue 36 one-time E2E aria fix

on:
  push:
    branches:
      - feature/issue-36-task-editor-fields
    paths:
      - .release/issue-36-e2e-aria-fix.trigger

permissions:
  contents: write

jobs:
  fix-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Align slider assertions with accessibility contract
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/e2e/project-task-editor-persistence.spec.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace('await expect(editor.getByText("75%", { exact: true })).toBeVisible();', 'await expect(progress).toHaveAttribute("aria-valuetext", "75%");')
          text = text.replace('await expect(information.getByText("75%", { exact: true })).toBeVisible();', 'await expect(information.getByLabel("진행률 (%)", { exact: true })).toHaveAttribute("aria-valuetext", "75%");')
          path.write_text(text, encoding="utf-8")
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-36-e2e-aria-fix.yml .release/issue-36-e2e-aria-fix.trigger
          git add tests/e2e/project-task-editor-persistence.spec.ts
          git commit -m "test: Slider 현재값을 접근성 계약으로 검증 (#36)"
          git push origin HEAD:feature/issue-36-task-editor-fields
