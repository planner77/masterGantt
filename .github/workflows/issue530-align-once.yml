name: "Issue #530 브랜치 통합 준비"
run-name: "Issue #530 · PR #555 통합 후보 생성 · ${{ github.run_number }}.${{ github.run_attempt }}"
on:
  push:
    branches: [test/issue-530-resource-kpi-integration]
    paths: [.github/workflows/issue530-align-once.yml]
permissions:
  contents: write
concurrency:
  group: issue530-alignment-preparation
  cancel-in-progress: false
jobs:
  prepare:
    name: 기존 이력 보존·대상 검증·후보 객체 생성
    if: github.repository == 'planner77/masterGantt' && github.ref == 'refs/heads/test/issue-530-resource-kpi-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: a87954a7ce76ac14e1095953486aafbb03f33e02
      EXPECTED_MAIN: 4f2d8d084c011a33a3fbd633695f97f4b4ec5893
    steps:
      - name: 정확한 요청 head 조회
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 통합 기준 확인
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
      - name: 3-way 통합·문서 양쪽 보존·Milestone 테스트 정합화
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def show(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}']).decode('utf-8')
          source = os.environ['EXPECTED_SOURCE']
          main = os.environ['EXPECTED_MAIN']
          assert git('rev-parse', 'HEAD^') == source, 'PR source moved before preparation'
          assert git('rev-parse', 'origin/main') == main, 'main changed; review the new base before retrying'
          base = git('merge-base', source, main)
          assert base == 'dca2f7821f277ef31ee3dbcbdc1e51ad257209f0'
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', main], check=False)
          assert result.returncode in (0, 1), 'git merge could not run'
          conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
          resolved = []
          for name in conflicts:
              if name == 'CHANGELOG.md':
                  continue
              assert name.endswith('.md'), f'Non-document conflict requires manual review: {name}'
              ancestor, ours, theirs = [subprocess.check_output(['git', 'show', f':{stage}:{name}']).decode('utf-8') for stage in (1, 2, 3)]
              assert ancestor, f'Empty ancestor cannot be resolved additively: {name}'
              if ours == theirs:
                  combined, method = ours, 'identical'
              elif ours.startswith(ancestor):
                  combined, method = theirs + ours[len(ancestor):], 'preserve-main-and-source-append'
              elif ours.endswith(ancestor):
                  combined, method = ours[:-len(ancestor)] + theirs, 'preserve-source-prefix-and-main'
              elif theirs.startswith(ancestor):
                  combined, method = ours + theirs[len(ancestor):], 'preserve-source-and-main-append'
              elif theirs.endswith(ancestor):
                  combined, method = theirs[:-len(ancestor)] + ours, 'preserve-main-prefix-and-source'
              else:
                  raise RuntimeError(f'Not a provably additive document conflict: {name}')
              Path(name).write_text(combined, encoding='utf-8')
              subprocess.run(['git', 'add', '--', name], check=True)
              resolved.append({'path': name, 'method': method})
          main_package = json.loads(show(main, 'package.json'))
          assert main_package['version'] == '0.102.2', 'Reassess version against changed main'
          version = '0.102.3'
          header = '# Changelog\n\n'
          original_changelog = show(source, 'CHANGELOG.md')
          base_changelog = show(base, 'CHANGELOG.md')
          main_changelog = show(main, 'CHANGELOG.md')
          assert all(text.startswith(header) for text in (original_changelog, base_changelog, main_changelog))
          tail = base_changelog[len(header):]
          assert original_changelog[len(header):].endswith(tail)
          addition = original_changelog[len(header):-len(tail)]
          assert addition.count('## [0.102.2] - 2026-10-08') == 1
          assert 'Issue #530' in addition
          addition = addition.replace('## [0.102.2] - 2026-10-08', f'## [{version}] - 2026-10-09', 1)
          Path('CHANGELOG.md').write_text(header + addition + main_changelog[len(header):], encoding='utf-8')
          resolved.append({'path': 'CHANGELOG.md', 'method': 'retain-both-release-entries-and-reassign-source-patch'})
          for name in ['package.json', 'package-lock.json']:
              path = Path(name)
              data = json.loads(path.read_text())
              assert data['version'] == main_package['version']
              data['version'] = version
              if name == 'package-lock.json':
                  assert data['packages']['']['version'] == main_package['version']
                  data['packages']['']['version'] = version
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          ui_path = Path('tests/e2e/resource-kpi-integration-ui.spec.ts')
          ui = ui_path.read_text()
          main_ui = '\n'.join(show(main, str(path)) for path in Path('src/features/milestones').glob('*.tsx'))
          replacements = {
              '단계 검색': 'Milestone 검색',
              '단계 표시·공수 범위 조건': 'Milestone 표시·공수 범위 조건',
              'M1 · 전체 단계 원인': 'M1 · 전체 Milestone 원인',
              '범위 내 단계 공수 표 가로 스크롤': '범위 내 Milestone 공수 표 가로 스크롤',
          }
          locator_changes = []
          for old, new in replacements.items():
              count = ui.count(old)
              assert count > 0, f'Expected previous locator missing: {old}'
              assert new.removeprefix('M1') in main_ui, f'New locator does not match main source: {new}'
              ui = ui.replace(old, new)
              locator_changes.append({'old': old, 'new': new, 'count': count})
          ui_path.write_text(ui, encoding='utf-8')
          subprocess.run(['git', 'add', '--', 'CHANGELOG.md', 'package.json', 'package-lock.json', str(ui_path)], check=True)
          assert not git('diff', '--name-only', '--diff-filter=U'), 'Unresolved conflicts remain'
          subprocess.run(['git', 'rm', '--', '.github/workflows/issue530-align-once.yml'], check=True)
          metadata = {'issue': 530, 'pr': 555, 'sourceHead': source, 'workflowHead': git('rev-parse', 'HEAD'),
                      'mainHead': main, 'mergeBase': base, 'version': version,
                      'conflicts': conflicts, 'resolutions': resolved, 'locatorChanges': locator_changes}
          Path('/tmp/issue530-prepare.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(metadata, ensure_ascii=False))
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Node 의존성 준비
        uses: ./.github/actions/node-setup
        with:
          node-version: "22"
      - name: 버전·타입·변경 lint 검증
        run: |
          npm run version:check
          npm run typecheck
          npx --no-install eslint src/features/gantt/peer-viewport-capture.ts src/features/gantt/project-gantt.tsx src/features/projects/project-readonly-view.tsx src/features/resources/resource-navigation-viewport.ts tests/e2e/resource-kpi-integration-ui.spec.ts
      - name: viewport·Resource KPI 대상 Vitest 검증
        run: npm test -- tests/features/resources/resource-navigation-viewport.test.ts tests/domain/resource-kpi-integration.test.ts tests/server/resources/resource-kpi-integration.test.ts --reporter=json --outputFile=/tmp/issue530-vitest.json
      - name: 증거 기록·후보 Git 객체 생성 (ref 변경 없음)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def entries(ref):
              result = {}
              for record in subprocess.check_output(['git', 'ls-tree', '-r', '-z', ref]).split(b'\0'):
                  if not record:
                      continue
                  metadata, path = record.split(b'\t', 1)
                  mode, kind, sha = metadata.decode().split()
                  result[path.decode()] = {'mode': mode, 'type': kind, 'sha': sha}
              return result
          metadata = json.loads(Path('/tmp/issue530-prepare.json').read_text())
          tests = json.loads(Path('/tmp/issue530-vitest.json').read_text())
          assert tests['success'] and tests['numFailedTests'] == 0 and tests['numPassedTests'] > 0
          metadata['fastFeedback'] = {
              'location': 'GitHub Actions branch preparation, not full PR CI',
              'version': 'PASS', 'typecheck': 'PASS', 'changedLint': 'PASS',
              'vitest': {'status': 'PASS', 'passed': tests['numPassedTests'], 'failed': tests['numFailedTests'], 'suites': tests['numPassedTestSuites']},
              'fullPrQuality': 'NOT TESTED', 'fullPrE2e': 'NOT TESTED', 'fullPrDocker': 'NOT TESTED',
              'independentQa': 'NOT TESTED', 'windowsExcelDrm': 'NOT TESTED',
          }
          metadata['releaseAuthorized'] = False
          metadata['preparationRun'] = f"https://github.com/planner77/masterGantt/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          evidence = Path('docs/evidence/issue530/alignment-20261009.json')
          evidence.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          section = f'''## 2026-10-09 최신 main 재정렬 — PR #555

          기존 head `{metadata['sourceHead']}`의 기능·검증 이력을 보존하고 main `{metadata['mainHead']}`를 통합했다. 후보 버전은 `{metadata['version']}`이다. CHANGELOG의 main 0.102.2와 #530 PATCH 항목을 분리하고 양쪽 문서 추가를 보존했다. #495의 Milestone 표기와 #530 frame별 Core/native viewport·canonical queue·입력 취소를 함께 유지하며, 신규 UI 테스트의 이전 접근성 이름 4종을 현행 소스와 대조해 변경했다. 기존 assertion·공수 기대값·CI gate는 삭제하거나 완화하지 않았다.

          [현재 정렬 증거](../../evidence/issue530/alignment-20261009.json)는 최초 PR 실행과 구분한다. GitHub Actions 통합 준비에서 version/typecheck/변경 lint와 대상 Vitest {tests['numPassedTests']}개 PASS를 확인했다. 이는 전체 PR CI PASS가 아니다. 새 head quality/e2e/docker, 독립 QA, Windows Excel/DRM은 NOT TESTED다. 과거 243개/18개 실행은 아래 초기 구현 이력으로만 유지한다. 새 full PR CI 등록까지만 승인되었으며 병합·Main CI·GHCR·Release·tag·Issue 종료는 수행하지 않는다. `release_required=true`, `release_authorized=false`다.

          DESIGN/AGENTS/API/DB/보안/집계/기존 CI workflow 계약 변경은 N/A다. 임시 통합 실행 workflow는 후보 tree에서 제거하고 원래 CI workflow와 required gate를 유지한다. 후보 Git 객체 생성과 PR ref 갱신을 분리하고, 게시 시 expected-head를 확인한다.

          '''
          packet = Path('docs/exec-plans/active/ISSUE_530.md')
          text = packet.read_text()
          first, rest = text.split('\n', 1)
          packet.write_text(first + '\n\n' + section + rest.lstrip('\n'), encoding='utf-8')
          plan = Path('docs/exec-plans/active/PLAN.md')
          plan.write_text('## Issue #530 — 최신 main 통합 후보 / 새 PR CI 등록 (2026-10-09)\n\n'
              + f"main `{metadata['mainHead']}`를 통합한 후보 `{metadata['version']}`. [현재 실행 계획](ISSUE_530.md)의 2026-10-09 절을 따른다. "
              + f"원격 통합 준비의 version/typecheck/변경 lint·대상 Vitest {tests['numPassedTests']}개 PASS와 기존 PR CI #2199.1 성공 이력을 구분한다. "
              + '새 head 전체 PR CI 및 독립 QA는 NOT TESTED이며 병합·Main CI·GHCR/Release/tag·Issue 종료는 승인 범위 밖이다.\n\n'
              + plan.read_text(), encoding='utf-8')
          test_plan = Path('docs/TEST_PLAN.md')
          test_plan.write_text(test_plan.read_text() + '\n\n## Issue #530 최신 main 정렬 후 검증 경계 (2026-10-09)\n\n'
              + f"후보 `{metadata['version']}` / main `{metadata['mainHead']}`. [재정렬 증거](evidence/issue530/alignment-20261009.json)에 실제 충돌·보존 방법·locator 변경·원격 준비 실행을 기록했다. "
              + f"대상 Vitest {tests['numPassedTests']}개·typecheck·version·변경 lint PASS. "
              + '기존 243개/18개 실행·PNG와 새 실행을 혼동하지 않는다. E2E의 Milestone 접근성 이름 4종을 현행 소스와 대조했으나 실제 브라우저 재실행은 새 full PR CI에서 검증한다. '
              + 'quality/e2e/docker 및 독립 QA는 NOT TESTED이며 Windows Excel/DRM·운영 검증 역시 별도다.\n', encoding='utf-8')
          subprocess.run(['git', 'add', '--', str(evidence), str(packet), str(plan), str(test_plan)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert not git('diff', '--name-only', '--diff-filter=U')
          local_tree = git('write-tree')
          main_entries = entries(metadata['mainHead'])
          source_entries = entries(metadata['workflowHead'])
          candidate_entries = entries(local_tree)
          assert '.github/workflows/issue530-align-once.yml' not in candidate_entries
          for path in ['.github/workflows/ci.yml', '.github/workflows/release-image.yml', 'AGENTS.md', 'DESIGN.md']:
              assert candidate_entries[path] == main_entries[path], f'Upstream policy changed unexpectedly: {path}'
          known_blobs = {entry['sha'] for entry in [*main_entries.values(), *source_entries.values()] if entry['type'] == 'blob'}
          base_url = 'https://api.github.com/repos/planner77/masterGantt/'
          def post(endpoint, data):
              req = urllib.request.Request(base_url + endpoint, data=json.dumps(data).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'masterGantt-issue530-alignment'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          changes = []
          for path in sorted(main_entries.keys() | candidate_entries.keys()):
              previous, current = main_entries.get(path), candidate_entries.get(path)
              if previous == current:
                  continue
              if current is None:
                  changes.append({'path': path, 'mode': previous['mode'], 'type': previous['type'], 'sha': None})
                  continue
              if current['type'] == 'blob' and current['sha'] not in known_blobs:
                  content = subprocess.check_output(['git', 'cat-file', 'blob', current['sha']])
                  created = post('git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
                  assert created['sha'] == current['sha'], f'Blob hash mismatch: {path}'
                  known_blobs.add(current['sha'])
              changes.append({'path': path, **current})
          remote_tree = post('git/trees', {'base_tree': git('rev-parse', metadata['mainHead'] + '^{tree}'), 'tree': changes})
          assert remote_tree['sha'] == local_tree, 'Remote/local tree mismatch'
          commit = post('git/commits', {
              'message': 'fix: Issue #530 최신 main 통합과 Milestone 회귀 정합화\n\nRefs #530\n\n새 PR CI 등록까지만 승인. main/Release/ref 자동 변경 없음.',
              'tree': local_tree, 'parents': [metadata['workflowHead'], metadata['mainHead']],
          })
          result = {'candidateSha': commit['sha'], 'treeSha': local_tree,
                    'parents': [metadata['workflowHead'], metadata['mainHead']],
                    'version': metadata['version'], 'changedFiles': len(changes),
                    'passedTests': tests['numPassedTests'], 'preparationRun': metadata['preparationRun'],
                    'refUpdated': False, 'fullPrCiStarted': False}
          print('ISSUE530_CANDIDATE=' + json.dumps(result, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Issue #530 통합 후보 Git 객체 생성 완료\n\n```json\n' + json.dumps(result, ensure_ascii=False, indent=2) + '\n```\n\nPR ref는 변경하지 않았습니다. 연결 도구에서 부모/tree와 expected-head를 확인한 뒤 게시해야 합니다.\n')
          PY
