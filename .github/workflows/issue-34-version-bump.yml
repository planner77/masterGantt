name: Issue 34 version bump helper

on:
  push:
    branches:
      - feat/issue-34-task-relations

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-34-task-relations
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: package/lock 버전을 0.10.0으로 동기화
        run: npm version 0.10.0 --no-git-tag-version
      - name: changelog 0.10.0 항목 추가
        shell: python
        run: |
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          entry = '''## [0.10.0] - 2026-09-15\n\n### Added\n\n- Issue #34: Task Editor에 현재 작업의 선행/후행 관계를 조회 전용으로 표시한다. 상대 작업명과 externalId, 관계 유형, lag를 함께 보여주며 Editor 기준 revision과 동일한 canonical snapshot만 채택해 stale 관계 혼합을 차단한다. 사용자 기능 추가에 따라 버전을 `0.10.0`으로 갱신한다.\n\n'''
          if '## [0.10.0]' not in text:
              text = text.replace(marker, marker + '\n' + entry, 1)
              path.write_text(text, encoding='utf-8')
      - name: 변경 커밋 및 push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: v0.10.0 버전 동기화'
          git push origin HEAD:feat/issue-34-task-relations
