name: Issue 87 병합 브랜치 정리

# 사용자 요청에 따른 PR #88의 브랜치 정리만 수행한다.
# 쓰기 권한의 cleanup은 PR 코드/artifact/cache를 내려받거나 실행하지 않는다.
# read-only validation만 PR의 고정 검증 스크립트를 실행한다.
on:
  pull_request:
    paths:
      - ".github/workflows/issue-87-branch-cleanup.yml"
      - "scripts/verify-issue-87-cleanup.py"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: issue-87-branch-cleanup
  cancel-in-progress: false

jobs:
  validation:
    name: Issue 87 브랜치 정리 안전 조건 검증
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 모형 조건 및 실제 로컬 Git lease 회귀 검증
        run: python3 scripts/verify-issue-87-cleanup.py

  cleanup:
    name: PR 88 main CI·GHCR 검증 후 작업 브랜치 정리
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'planner77/masterGantt' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: 대상·검증 근거·미병합 변경 확인 후 한정 삭제
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = "planner77/masterGantt"
          BRANCH = "docs/issue-87-agent-lifecycle"
          PR_NUMBER = 88


          def require(condition, reason):
              if not condition:
                  raise SystemExit(reason)


          def api(path, method="GET", allowed=(200,)):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + path,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status, raw = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, raw = error.code, b""
              require(status in allowed, "GitHub API 검증 실패: " + method + " " + path + " (" + str(status) + ")")
              return status, json.loads(raw) if raw else None


          def delete_verified_ref(head_sha):
              # 단일 삭제 refspec에 SHA lease를 적용한다. commit/history force update가 아니다.
              ref = "refs/heads/" + BRANCH
              env = {key: value for key, value in os.environ.items()
                     if not key.startswith("GIT_")}
              authorization = base64.b64encode(
                  ("x-access-token:" + os.environ["GH_TOKEN"]).encode()
              ).decode()
              env.update({
                  "GIT_TERMINAL_PROMPT": "0",
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_CONFIG_GLOBAL": os.devnull,
                  "GIT_CONFIG_COUNT": "1",
                  "GIT_CONFIG_KEY_0": "http.https://github.com/.extraheader",
                  "GIT_CONFIG_VALUE_0": "AUTHORIZATION: basic " + authorization,
              })
              with tempfile.TemporaryDirectory(prefix="issue-87-ref-") as directory:
                  initialized = subprocess.run(
                      ["git", "init", "--bare", "--object-format=sha1", "--template=", directory],
                      env=env, capture_output=True, text=True, timeout=30,
                  )
                  require(initialized.returncode == 0, "정리용 빈 Git 저장소 초기화 실패")
                  deleted = subprocess.run(
                      ["git", "-C", directory, "push", "--porcelain",
                       "--force-with-lease=" + ref + ":" + head_sha,
                       "https://github.com/" + REPO + ".git", ":" + ref],
                      env=env, capture_output=True, text=True, timeout=60,
                  )
                  # 인증 헤더와 외부 응답은 출력하지 않는다. 실패 시 재시도/강제 삭제하지 않는다.
                  require(deleted.returncode == 0,
                          "SHA 조건부 삭제 실패: 변경된 tip·보호/권한·네트워크 상태 확인 필요")


          def main():
              require(os.environ["GITHUB_REPOSITORY"] == REPO, "대상 저장소 불일치")
              require(os.environ["GITHUB_EVENT_NAME"] == "workflow_run", "허용되지 않은 이벤트")
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
                  event = json.load(handle)
              trigger = event["workflow_run"]
              _, run = api("/actions/runs/" + str(int(trigger["id"])))
              require(run["event"] == "push" and run["head_branch"] == "main", "main push CI가 아님")
              require(run["repository"]["full_name"] == REPO and run["head_repository"]["full_name"] == REPO, "CI 저장소 불일치")
              require(run["path"] == ".github/workflows/ci.yml", "허용되지 않은 workflow")
              require(run["status"] == "completed" and run["conclusion"] == "success", "main CI 미완료 또는 실패")
              require(run["run_attempt"] == trigger["run_attempt"], "CI attempt 변경 감지")
              merge_sha = run["head_sha"]
              require(re.fullmatch(r"[0-9a-f]{40}", merge_sha) is not None, "잘못된 merge SHA")
              _, pr = api("/pulls/" + str(PR_NUMBER))
              if not pr["merged"] or pr["merge_commit_sha"] != merge_sha:
                  print("이번 CI는 PR #88 병합 검증이 아니므로 정리하지 않습니다.")
                  return
              require(pr["base"]["ref"] == "main" and pr["head"]["ref"] == BRANCH, "PR branch 불일치")
              require(pr["head"]["repo"]["full_name"] == REPO and pr["base"]["repo"]["full_name"] == REPO, "PR 저장소 불일치")
              head_sha = pr["head"]["sha"]
              require(re.fullmatch(r"[0-9a-f]{40}", head_sha) is not None, "잘못된 head SHA")
              _, jobs = api("/actions/runs/" + str(run["id"]) + "/jobs?filter=latest&per_page=100")
              require(jobs["total_count"] <= 100, "검증 job 페이지 범위 초과")
              for name in (
                  "Build, static checks, and unit tests",
                  "Chromium end-to-end tests",
                  "Docker build and runtime smoke test",
                  "Main 임시 commit 이미지 게시·검증·정리",
              ):
                  matches = [job for job in jobs["jobs"] if job["name"] == name]
                  require(len(matches) == 1 and matches[0]["status"] == "completed" and matches[0]["conclusion"] == "success", "필수 gate 실패/누락: " + name)
              # 이번 고정 대상은 merge commit 방식만 허용한다. squash/rebase를 추정하지 않는다.
              _, commit = api("/git/commits/" + merge_sha)
              parents = commit["parents"]
              require(len(parents) == 2 and parents[1]["sha"] == head_sha,
                      "PR #88은 merge_method=merge가 필수이며 squash/rebase 후 자동 삭제하지 않음")
              for base, head in ((head_sha, merge_sha), (merge_sha, "main")):
                  _, comparison = api("/compare/" + base + "..." + head)
                  require(comparison["merge_base_commit"]["sha"] == base, "main에서 미병합 또는 이탈한 commit 감지")
              for key, value in (("head", "planner77:" + BRANCH), ("base", BRANCH)):
                  query = urllib.parse.urlencode({"state": "open", key: value, "per_page": 1})
                  _, opened = api("/pulls?" + query)
                  require(isinstance(opened, list) and not opened, "다른 열린 PR이 작업 브랜치를 사용함")
              status, branch = api("/branches/" + urllib.parse.quote(BRANCH, safe=""), allowed=(200, 404))
              if status == 200:
                  require(not branch["protected"], "보호된 브랜치 삭제 금지")
                  require(branch["commit"]["sha"] == head_sha, "브랜치에 새 commit 존재")
                  _, current_ref = api("/git/ref/heads/" + BRANCH)
                  require(current_ref["object"]["sha"] == head_sha, "삭제 직전 branch 변경 감지")
                  print("삭제 대상 확인: " + BRANCH + " @ " + head_sha)
                  delete_verified_ref(head_sha)
              api("/git/ref/heads/" + BRANCH, allowed=(404,))
              summary = "\n".join((
                  "## Issue #87 작업 브랜치 정리 완료",
                  "- PR: #88",
                  "- Merge SHA: `" + merge_sha + "`",
                  "- 검증한 CI run: " + run["html_url"],
                  "- quality / e2e / docker / main GHCR: success",
                  "- 작업 브랜치: `" + BRANCH + "` (삭제 후 404 확인)",
                  "- tag / 정식 release / package / 운영 데이터는 변경하지 않았습니다.",
                  "",
              ))
              print(summary)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write(summary)


          if __name__ == "__main__":
              main()
          PY
