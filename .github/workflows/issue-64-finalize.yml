name: Issue 64 최종화

on:
  push:
    branches:
      - feat/issue-64-structured-logging
    paths:
      - .github/workflows/issue-64-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'planner77/masterGantt' && github.ref == 'refs/heads/feat/issue-64-structured-logging'
    runs-on: ubuntu-24.04
    steps:
      - name: 작업 브랜치 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-64-structured-logging
          fetch-depth: 0
      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: 버전 및 문서 계약 갱신
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.15.0 --no-git-tag-version --allow-same-version
          python3 <<'PY'
          from pathlib import Path
          import re

          def append_once(path, marker, section):
              p = Path(path)
              text = p.read_text()
              if marker not in text:
                  if not text.endswith('\n'):
                      text += '\n'
                  text += '\n' + section.strip() + '\n'
                  p.write_text(text)

          # README: stale reservation wording removal + concise operations contract.
          p = Path('README.md')
          text = p.read_text()
          text = re.sub(
              r'^\| `TRUST_PROXY`, `LOG_LEVEL` \|.*$',
              '| `TRUST_PROXY` | `true`일 때만 검증된 reverse proxy의 `X-Request-ID`를 상관관계 ID로 신뢰. Origin/HTTP/Cookie 정책은 변경하지 않음 |\n| `LOG_LEVEL` | `debug`, `info`, `warn`, `error`. development 기본 `debug`, 그 외 기본 `info` |',
              text,
              flags=re.M,
          )
          text = text.replace(
              '`TRUST_PROXY`·`LOG_LEVEL`은 아직 앱이 소비하지 않는 예약 변수이므로 이를 바꿔 HTTP 운영이나 Origin 오류를 해결할 수 없다.',
              '`TRUST_PROXY`는 request ID 신뢰 경계에만 적용되고 `LOG_LEVEL`은 서버 로그 필터에 적용된다. 둘 다 HTTP 허용, Origin 검증 또는 Cookie 보안 정책을 완화하지 않는다.',
          )
          p.write_text(text)
          append_once('README.md', '## 운영 로그 및 요청 추적', '''
          ## 운영 로그 및 요청 추적

          서버는 Docker `stdout/stderr`에 JSON 한 줄 구조화 로그를 출력한다. `LOG_LEVEL=debug|info|warn|error`로 필터링하며 잘못된 값은 환경별 안전 기본값으로 fallback하고 진단 이벤트를 남긴다. 신뢰 가능한 Nginx 앞단에서만 `TRUST_PROXY=true`를 사용하고 `$request_id`를 `X-Request-ID`로 전달한다. 응답 `X-Request-ID`, 오류 body의 `error.requestId`, 애플리케이션 로그의 `requestId`는 동일하다.

          ```bash
          docker logs <container>
          docker compose --env-file .env -f deploy/compose.yml logs -f app
          ```

          장애 조사는 `사용자 requestId → Nginx access log → Docker application log → errorCode/reasonCode/component` 순서로 수행한다. 상세 schema, 보안 금지 필드, readiness 전환 이벤트와 로그 회전 지침은 [운영 로깅 및 요청 추적](docs/LOGGING.md)을 따른다.
          ''')

          # Deployment: activate variables and document Docker/runtime events.
          p = Path('docs/DEPLOYMENT.md')
          text = p.read_text()
          text = re.sub(r'^\| `LOG_LEVEL` \| 예약 \|.*$', '| `LOG_LEVEL` | 선택 | `debug`, `info`, `warn`, `error`; production 기본 `info`. 잘못된 값은 안전 기본값 + 진단 경고 |', text, flags=re.M)
          text = re.sub(r'^\| `TRUST_PROXY` \| 예약 \|.*$', '| `TRUST_PROXY` | 선택 | `true`일 때만 검증된 reverse proxy `X-Request-ID`를 신뢰. Origin/HTTPS/Cookie 정책과 무관 |', text, flags=re.M)
          p.write_text(text)
          append_once('docs/DEPLOYMENT.md', '## 구조화 로그와 Docker 운영 (Issue #64)', '''
          ## 구조화 로그와 Docker 운영 (Issue #64)

          애플리케이션, runtime configuration 검사와 DB migration은 컨테이너 내부 파일이 아니라 `stdout/stderr`에 JSON 한 줄 로그를 남긴다. 주요 운영 이벤트는 `application_started`, `runtime_configuration_validated|invalid`, `database_migration_started|completed|failed`, `http_request_completed`, `readiness_unavailable|recovered`다. 비밀번호, Cookie, Authorization, session token, hash/digest, 전체 request body 및 DB record는 기록하지 않는다.

          ```bash
          docker logs <container>
          docker compose --env-file .env -f deploy/compose.yml logs -f app
          ```

          Docker daemon의 `json-file` 또는 `local` logging driver와 `max-size`/`max-file` 보존 정책은 호스트 운영 기준에 맞춰 별도로 설정한다. daemon 전역 변경은 다른 컨테이너 영향을 먼저 검토한다. Windows Nginx는 `proxy_set_header X-Request-ID $request_id;`를 사용하고 access log에도 `$request_id`를 포함하여 응답 헤더와 Docker 로그를 같은 ID로 조회한다. 상세 기준은 [LOGGING.md](LOGGING.md)를 따른다.
          ''')

          # HTTP operation: supersede old reservation wording without changing transport policy.
          p = Path('docs/HTTP_OPERATION.md')
          text = p.read_text().replace(
              '`TRUST_PROXY`, `LOG_LEVEL`은 기존 미사용 예약 상태다.',
              '`TRUST_PROXY`는 검증된 `X-Request-ID` 수용 여부에만 사용하고 `LOG_LEVEL`은 구조화 서버 로그 필터에 사용한다. 두 값은 APP_BASE_URL, Origin 검증, HTTP 허용 또는 Secure Cookie 정책을 변경하지 않는다.',
          )
          p.write_text(text)
          append_once('docs/HTTP_OPERATION.md', '## Request ID와 로그 설정', '''
          ## Request ID와 로그 설정

          신뢰 가능한 reverse proxy가 애플리케이션에 직접 연결되는 구성에서만 `TRUST_PROXY=true`로 두고 Nginx `$request_id`를 `X-Request-ID`로 전달한다. 앱은 형식과 길이를 검증하며 유효하지 않으면 새 UUID를 생성한다. `LOG_LEVEL`은 `debug|info|warn|error`만 지원한다. 두 설정은 transport 보안 우회 수단이 아니다.
          ''')

          append_once('docs/API.md', '## 공통 Request ID / Correlation 계약', '''
          ## 공통 Request ID / Correlation 계약

          주요 API 응답은 `X-Request-ID`를 반환한다. 오류 응답의 `error.requestId`는 이 헤더와 서버 구조화 로그의 `requestId`와 동일하다. 기본 `TRUST_PROXY=false`에서는 클라이언트 제공 `X-Request-ID`를 무시하고 서버 UUID를 사용한다. `TRUST_PROXY=true`인 신뢰 프록시 경계에서도 UUID 또는 Nginx `$request_id` 32-hex 형식만 수용하고 그 외 값은 재생성한다. 이 설정은 인증, Origin, revision, Cookie 또는 HTTP/HTTPS 정책을 변경하지 않는다.
          ''')

          append_once('docs/TEST_PLAN.md', '## Issue #64 구조화 로그 및 요청 추적 회귀', '''
          ## Issue #64 구조화 로그 및 요청 추적 회귀

          - `LOG_LEVEL` 필터와 잘못된 설정 fallback을 단위 테스트한다.
          - trusted/untrusted `X-Request-ID`, 응답 header, 오류 body와 server log 상관관계를 검증한다.
          - 2xx/4xx/5xx lifecycle level, 예상하지 못한 500의 client/server 정보 분리, 민감 필드 redaction을 검증한다.
          - readiness failure category 및 장애→복구 전환을 검증하고 정상 health probe가 반복 `info` 로그를 만들지 않는지 확인한다.
          - migration CLI가 성공/실패 구조화 진단을 stderr에 남기면서 DB path/내부 오류 원문을 노출하지 않는지 검증한다.
          - Docker Compose smoke에서 `runtime_configuration_validated`, `database_migration_completed`, `application_started` 이벤트가 `docker compose logs app`으로 조회되는지 확인한다.
          ''')

          # Changelog: insert without touching historical entries.
          p = Path('CHANGELOG.md')
          text = p.read_text()
          marker = '## [0.15.0] - 2026-09-18'
          if marker not in text:
              block = '''## [0.15.0] - 2026-09-18

          ### Added

          - Issue #64: Docker/server stdout에 JSON 한 줄 구조화 logger, 실제 `LOG_LEVEL` 필터, 민감 필드 redaction과 안전한 500 진단을 추가한다.
          - 검증된 `X-Request-ID` 또는 서버 UUID를 API lifecycle, 오류 body, 응답 header와 서버 로그에서 동일하게 사용하는 request correlation을 추가한다.
          - runtime configuration, DB migration, application startup과 readiness 장애/복구 운영 이벤트 및 Nginx↔Docker 추적 문서를 추가한다.

          ### Changed

          - Issue #61의 리소스 관리자 인증 진단을 공통 logger에 연결하고 주요 Project/Task/Resource/Export API를 동일 request lifecycle 체계에 편입한다.
          - 하위 호환 운영 관측성 및 request-correlation 기능 추가이므로 Semantic Versioning 정책에 따라 `0.14.1`에서 `0.15.0`으로 증가한다.

          '''
              text = text.replace('## [Unreleased]\n', '## [Unreleased]\n\n' + block, 1)
              p.write_text(text)

          # Docker smoke: prove structured logs are visible through Compose stdout/stderr collection.
          p = Path('scripts/verify-compose-smoke.sh')
          text = p.read_text()
          needle = "verify_row\necho 'Compose startup, restart, forced recreation and SQLite volume persistence: PASS'\n"
          replacement = """verify_row
          logs=\"$(dc logs --no-color app 2>&1)\"
          grep -q '\"event\":\"runtime_configuration_validated\"' <<<\"$logs\"
          grep -q '\"event\":\"database_migration_completed\"' <<<\"$logs\"
          grep -q '\"event\":\"application_started\"' <<<\"$logs\"
          echo 'Compose structured stdout/stderr logging: PASS'
          echo 'Compose startup, restart, forced recreation and SQLite volume persistence: PASS'
          """
          if 'Compose structured stdout/stderr logging: PASS' not in text:
              if needle not in text:
                  raise SystemExit('compose smoke insertion point not found')
              text = text.replace(needle, replacement, 1)
              p.write_text(text)
          PY
          git rm .github/workflows/issue-64-finalize.yml
          git config user.name 'planner77'
          git config user.email '45478892+planner77@users.noreply.github.com'
          git add package.json package-lock.json README.md CHANGELOG.md docs/DEPLOYMENT.md docs/HTTP_OPERATION.md docs/API.md docs/TEST_PLAN.md scripts/verify-compose-smoke.sh
          git commit -m 'chore: 0.15.0 버전 및 운영 문서 갱신 (#64)'
          git push origin HEAD:feat/issue-64-structured-logging
