name: Issue 36 one-time E2E contract fix

on:
  push:
    branches:
      - feature/issue-36-task-editor-fields
    paths:
      - .release/issue-36-e2e-fix.trigger

permissions:
  contents: write

jobs:
  fix-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Align E2E with integer progress slider
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/e2e/project-task-editor-persistence.spec.ts",
              '''  const progress = editor.getByLabel("진행률 (%)", { exact: true });\n  await progress.evaluate((element) => {\n    const input = element as HTMLInputElement;\n    input.value = "75";\n    input.dispatchEvent(new Event("input", { bubbles: true }));\n    input.dispatchEvent(new Event("change", { bubbles: true }));\n  });''',
              '''  const progress = editor.getByLabel("진행률 (%)", { exact: true });\n  await progress.fill("75");\n  await expect(progress).toHaveValue("75");\n  await expect(progress).toHaveAttribute("aria-valuetext", "75%");''',
          )
          replace_once(
              "tests/e2e/project-task-editor.spec.ts",
              'await editor(page).getByLabel("진행률 (%)", { exact: true }).fill("35.5");',
              'await editor(page).getByLabel("진행률 (%)", { exact: true }).fill("36");',
          )
          replace_once(
              "tests/e2e/project-task-editor.spec.ts",
              'progress: 35.5',
              'progress: 36',
          )
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-36-e2e-fix.yml .release/issue-36-e2e-fix.trigger
          git add tests/e2e/project-task-editor-persistence.spec.ts tests/e2e/project-task-editor.spec.ts
          git commit -m "test: 진행률 Slider E2E를 1% 단위 계약에 맞춤 (#36)"
          git push origin HEAD:feature/issue-36-task-editor-fields
