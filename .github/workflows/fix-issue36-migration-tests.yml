name: Fix Issue 36 migration test expectations

on:
  push:
    branches:
      - feature/issue-36-task-editor-fields
    paths:
      - .github/workflows/fix-issue36-migration-tests.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/issue-36-task-editor-fields
          fetch-depth: 0
      - name: Update migration expectations and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/server/db/database.test.ts')
          text = path.read_text()
          old = 'expect(migrations.applied).toEqual(["0001_initial_schema.sql"]);'
          new = 'expect(migrations.applied).toEqual(["0001_initial_schema.sql", "0002_task_description_url.sql"]);'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/server/migration-cli.test.ts')
          text = path.read_text()
          old_applied = 'applied: ["0001_initial_schema.sql"],'
          new_applied = 'applied: ["0001_initial_schema.sql", "0002_task_description_url.sql"],'
          old_count = 'expect(database.prepare("SELECT count(*) AS count FROM schema_migrations").get())\n        .toEqual({ count: 1 });'
          new_count = 'expect(database.prepare("SELECT count(*) AS count FROM schema_migrations").get())\n        .toEqual({ count: 2 });'
          assert text.count(old_applied) == 1
          assert text.count(old_count) == 1
          path.write_text(text.replace(old_applied, new_applied, 1).replace(old_count, new_count, 1))
          PY
          git rm .github/workflows/fix-issue36-migration-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/server/db/database.test.ts tests/server/migration-cli.test.ts
          git commit -m "test: 신규 Task 필드 migration 기대값 갱신 (#36)"
          git push origin HEAD:feature/issue-36-task-editor-fields
