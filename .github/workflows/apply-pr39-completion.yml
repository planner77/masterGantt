name: Apply PR39 completion patch
on:
  push:
    branches: [feat/issues-27-33-35-36-37]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issues-27-33-35-36-37
      - name: 누락 기능과 회귀 테스트 패치
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/gantt/project-gantt.tsx'); s=p.read_text()
          s=s.replace('const [apiInstanceId, setApiInstanceId] = useState<string | null>(null);', 'const [apiInstanceId, setApiInstanceId] = useState<string | null>(null);\n  const [scaleMode, setScaleMode] = useState<"day" | "week">("day");')
          old='''  const scales = useMemo(() => [\n    {\n      unit: "month",\n      step: 1,\n      format: (date: Date) => new Intl.DateTimeFormat(locales, {\n        year: "numeric",\n        month: "long",\n      }).format(date),\n    },\n    {\n      unit: "day",\n      step: 1,\n      format: (date: Date) => new Intl.DateTimeFormat(locales, {\n        day: "numeric",\n        weekday: "narrow",\n      }).format(date),\n    },\n  ], [locales]);'''
          new='''  const scales = useMemo(() => [\n    { unit: "month", step: 1, format: (date: Date) => new Intl.DateTimeFormat(locales, { year: "numeric", month: "long" }).format(date) },\n    scaleMode === "day"\n      ? { unit: "day", step: 1, format: (date: Date) => new Intl.DateTimeFormat(locales, { day: "numeric", weekday: "narrow" }).format(date) }\n      : { unit: "week", step: 1, format: (date: Date, next?: Date) => {\n          const end = next ? new Date(next.getTime() - 86400000) : date;\n          const f = new Intl.DateTimeFormat(locales, { month: "numeric", day: "numeric" });\n          return `${f.format(date)}–${f.format(end)}`;\n        } },\n  ], [locales, scaleMode]);'''
          assert old in s; s=s.replace(old,new)
          marker='''  useEffect(() => {\n    const root = ganttScrollReference.current;\n    if (!root) return;\n    const setNativeAddAccessibility = () => {'''
          click='''  useEffect(() => {\n    const root = ganttScrollReference.current;\n    if (!root) return;\n    const openTaskUrl = (event: MouseEvent) => {\n      if (event.button !== 0) return;\n      const match = resolveTaskContextTarget(event.target, root, (id) => tasksByIdReference.current.has(id));\n      const task = match ? tasksByIdReference.current.get(match.taskId) : undefined;\n      if (!task?.url) return;\n      window.open(task.url, "_blank", "noopener,noreferrer");\n    };\n    root.addEventListener("click", openTaskUrl);\n    return () => root.removeEventListener("click", openTaskUrl);\n  }, []);\n\n'''+marker
          assert marker in s; s=s.replace(marker,click,1)
          willow='''      <Willow>\n        <div\n          aria-label="프로젝트 일정 Grid와 Gantt 차트"'''
          controls='''      <Willow>\n        <div className="project-gantt-scale-controls" role="group" aria-label="Chart 표시 단위">\n          <button type="button" className={scaleMode === "day" ? "primary-button" : "secondary-button"} aria-pressed={scaleMode === "day"} onClick={() => setScaleMode("day")}>일</button>\n          <button type="button" className={scaleMode === "week" ? "primary-button" : "secondary-button"} aria-pressed={scaleMode === "week"} onClick={() => setScaleMode("week")}>주</button>\n        </div>\n        <div\n          aria-label="프로젝트 일정 Grid와 Gantt 차트"'''
          assert willow in s; s=s.replace(willow,controls,1); p.write_text(s)

          p=Path('src/features/projects/project-readonly-view.tsx'); s=p.read_text()
          imp='import { ProjectLinkButton } from "@/components/project-link-button";'
          assert imp in s; s=s.replace(imp, imp+'\nimport { ProjectCopyButton } from "@/features/projects/project-copy-button";',1)
          anchor='<ProjectLinkButton projectName={project.name} projectUrl={projectUrl} />'
          assert anchor in s; s=s.replace(anchor, anchor+'\n        <ProjectCopyButton snapshot={state.snapshot} enabled={editing} busy={busy || editorSession !== null || pendingTaskDelete !== null} />',1); p.write_text(s)

          p=Path('tests/server/db/database.test.ts'); s=p.read_text(); s=s.replace('expect(applied).toEqual([1]);','expect(applied).toEqual([1, 2]);'); p.write_text(s)
          p=Path('tests/server/migration-cli.test.ts'); s=p.read_text(); s=s.replace('expect(JSON.parse(first.stdout)).toEqual({ applied: [1] });','expect(JSON.parse(first.stdout)).toEqual({ applied: [1, 2] });'); p.write_text(s)

          p=Path('src/server/security/route-security-inventory.ts'); s=p.read_text(); needle='{ template: "/api/projects/{publicId}", method: "DELETE", policy: "origin-session-if-match", mutatesState: true },'; assert needle in s; s=s.replace(needle, needle+'\n  { template: "/api/projects/{publicId}/copy", method: "POST", policy: "origin-session-if-match", mutatesState: true },',1); p.write_text(s)
          PY
          git rm .github/workflows/apply-pr39-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 프로젝트 복사·일주 전환·URL 실행 완성"
          git push origin HEAD:feat/issues-27-33-35-36-37
