name: Issue 37 lockfile sync

on:
  push:
    branches:
      - fix/issue-37-edit-permission-recheck

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Sync package version metadata
        run: npm version 0.8.3 --no-git-tag-version --allow-same-version
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: 0.8.3 lockfile 버전 동기화"
          git push origin HEAD:fix/issue-37-edit-permission-recheck
