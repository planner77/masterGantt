name: Finalize Issue 35 v0.9.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v0.9.0-issue35.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-issue-35-v0.9.0-release
  cancel-in-progress: false

jobs:
  finalize:
    name: Create annotated v0.9.0 tag and dispatch release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.9.0
      TARGET_SHA: c9156e9134c576b5c2e7a4866284a21508b7ba09
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify Issue 35 release target
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          package_version="$(git show "$TARGET_SHA:package.json" | jq -r '.version')"
          lock_version="$(git show "$TARGET_SHA:package-lock.json" | jq -r '.version')"
          test "$package_version" = "0.9.0"
          test "$lock_version" = "0.9.0"
          git cat-file -e "$TARGET_SHA:.github/workflows/release-image.yml"

      - name: Create annotated release tag when absent
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
            test "$tag_type" = "tag"
            tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tagged_commit" = "$TARGET_SHA"
            echo "$RELEASE_TAG already exists as the expected annotated tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG

Issue #35: Gantt Chart day/week scale toggle. PR #46 and main CI #154 passed."
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch release image workflow explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-image.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          echo "Dispatched release-image.yml for $RELEASE_TAG"
