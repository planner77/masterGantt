name: Issue 36 one-time contract docs update retry

on:
  push:
    branches:
      - feature/issue-36-task-editor-fields
    paths:
      - .release/issue-36-doc-contracts-retry.trigger

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Update API and DB source-of-truth documents
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/API.md",
              '  "progress": 25,\n  "parentExternalId": null,',
              '  "progress": 25,\n  "description": "Foundation work",\n  "url": "https://intranet.example/tasks/ACT-100",\n  "parentExternalId": null,',
          )
          replace_once(
              "docs/API.md",
              'Strict 입력은 `externalId?`, `parentTaskId?`, `convertParentToSummary?: true`, `name`, `type`, `scheduleMode?`, `start`, `end?`, `duration`, `progress`, `parentExternalId?: null`이다.',
              'Strict 입력은 `externalId?`, `parentTaskId?`, `convertParentToSummary?: true`, `name`, `description?`, `url?`, `type`, `scheduleMode?`, `start`, `end?`, `duration`, `progress`, `parentExternalId?: null`이다. `description`은 최대 10,000 Unicode code point이며 공백-only 값은 `null`로 정규화한다. `url`은 trim 후 최대 4,096 code point의 `http:`/`https:` URL만 허용한다.',
          )
          replace_once(
              "docs/API.md",
              'Mutable allowlist는 `name`, `scheduleMode`, `start`, `duration`, `progress`, optional assertion `end`다.',
              'Mutable allowlist는 `name`, `description`, `url`, `scheduleMode`, `start`, `duration`, `progress`, optional assertion `end`다. `description`은 최대 10,000 Unicode code point이며 공백만 입력하면 `null`로 정규화한다. `url`은 trim 후 최대 4,096 code point의 `http:`/`https:` URL만 허용하고 `javascript:`, `data:`, `vbscript:`, `file:` 등 다른 scheme은 거부한다.',
          )
          replace_once(
              "docs/DB_SCHEMA.md",
              '| `name` | TEXT | N | trim 후 빈 문자열 불가 |\n| `type` | TEXT | N | `task`, `summary`, `milestone` CHECK |',
              '| `name` | TEXT | N | trim 후 빈 문자열 불가 |\n| `description` | TEXT | Y | 작업 다중 행 설명, 공백-only 입력은 API에서 NULL 정규화 |\n| `url` | TEXT | Y | 작업 링크. API에서 `http:`/`https:`만 허용 |\n| `type` | TEXT | N | `task`, `summary`, `milestone` CHECK |',
          )
          replace_once(
              "docs/TASK_EDITOR.md",
              '일반 작업은 작업명·시작일·기간(근무일)·진행률을 입력하고 **저장**한다.',
              '일반 작업은 작업명·시작일·기간(근무일)과 0~100% 진행률 Slider, 여러 줄 Description, `http://`/`https://` URL을 입력하고 **저장**한다.',
          )
          replace_once(
              "docs/TASK_EDITOR.md",
              '`task-editor-model.ts`는 DTO를 초안으로 복사하고 변경된 name/start/duration/progress만 command로 만든다.',
              '`task-editor-model.ts`는 DTO를 초안으로 복사하고 변경된 name/start/duration/progress/description/url만 command로 만든다.',
          )
          replace_once(
              "docs/TASK_EDITOR.md",
              '서버 session/Origin/revision/스케줄러 계약, DB 스키마와 API는 변경하지 않는다.',
              '서버 session/Origin/revision/스케줄러 계약을 유지하며, Issue #36의 Description/URL은 동일 PATCH 경로와 SQLite migration/canonical snapshot 계약으로 저장한다.',
          )
      - name: Commit docs and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/issue-36-doc-contracts.yml .release/issue-36-doc-contracts.trigger
          git rm -f .github/workflows/issue-36-doc-contracts-retry.yml .release/issue-36-doc-contracts-retry.trigger
          git add docs/API.md docs/DB_SCHEMA.md docs/TASK_EDITOR.md
          git commit -m "docs: Issue #36 Task Editor API·DB 계약 갱신"
          git push origin HEAD:feature/issue-36-task-editor-fields
