name: 일회성 v0.11.1 lockfile 동기화

on:
  push:
    paths:
      - .github/workflows/one-time-sync-v0.11.1.yml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: package와 lockfile 버전을 0.11.1로 동기화
        run: npm version 0.11.1 --no-git-tag-version --allow-same-version
      - name: 동기화 결과 확인
        run: node scripts/verify-release-version.mjs
      - name: 일회성 workflow 제거 후 작업 브랜치에 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-sync-v0.11.1.yml
          git add package.json package-lock.json
          git commit -m "chore: lockfile 버전을 0.11.1로 동기화 (#51)"
          git push origin HEAD:${GITHUB_REF_NAME}
