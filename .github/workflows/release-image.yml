name: Publish release image

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && inputs.pr_number != '' && format('GHCR Release · Issue #{0} · PR #{1} · {2} · Run #{3}.{4}', inputs.issue_number, inputs.pr_number, github.ref_name, github.run_number, github.run_attempt) || format('GHCR Release · {0} · Run #{1}.{2}', github.ref_name, github.run_number, github.run_attempt) }}

on:
  push:
    tags:
      - "v*"
  # 연결된 운영 도구가 GITHUB_TOKEN으로 annotated tag를 만든 경우 push 이벤트가
  # 새 workflow를 재귀 실행하지 않으므로, 같은 tag ref를 명시해 수동 실행할 수 있다.
  # prepare job의 SemVer/package 일치 및 annotated tag 검증은 동일하게 적용된다.
  workflow_dispatch:
    inputs:
      issue_number:
        description: "관련 Primary Issue 번호(자동 lifecycle 경로에서 전달)"
        required: false
        type: string
      pr_number:
        description: "관련 Pull Request 번호(자동 lifecycle 경로에서 전달)"
        required: false
        type: string

# A release tag must never have its publish run cancelled by a later push.
concurrency:
  # 모든 version을 직렬화해 mutable stable alias가 병렬 release로 역행하지 않게 한다.
  # queue:max로 근접한 여러 release 요청도 pending 교체 없이 순차 보존한다.
  group: ghcr-release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    name: Validate SemVer and calculate immutable tags
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.tags.outputs.image_name }}
      exact_image: ${{ steps.tags.outputs.exact_image }}
      rolling_tags: ${{ steps.tags.outputs.rolling_tags }}
      version: ${{ steps.tags.outputs.version }}
      target_sha: ${{ steps.tags.outputs.target_sha }}
    steps:
      # actions/checkout v7.0.1
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Annotated tag 여부를 tag object 자체로 검사해야 하므로 tag history를 받는다.
          fetch-depth: 0
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Enforce exact package/tag SemVer agreement
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag_arguments=()
          while IFS= read -r previous_tag; do
            if [[ -n "$previous_tag" ]]; then
              previous_tag_arguments+=(--previous-tag "$previous_tag")
            fi
          done < <(git tag --list 'v*')
          node scripts/verify-release-version.mjs "$RELEASE_TAG" "${previous_tag_arguments[@]}"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Release authority must be an annotated Git tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Calculate lowercase GHCR tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          target_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image_name=$image_name"
            echo "version=$version"
            echo "target_sha=$target_sha"
            echo "exact_image=$image_name:$version"
            echo "rolling_tags<<EOF"
            # Prereleases keep only the exact SemVer tag. Stable releases alone
            # move major/minor/latest consumer convenience tags after digest verification.
            if [[ "$version" != *-* ]]; then
              IFS=. read -r major minor _ <<< "$version"
              echo "$image_name:$major.$minor"
              echo "$image_name:$major"
              echo "$image_name:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  quality_static:
    name: Release static quality
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 20
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: "22"
      - name: Node/npm version 기록
        run: |
          node --version
          npm --version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: node scripts/check-markdown-links.mjs
      - name: Release production build 계측 시작
        id: release-build-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - name: Release production build 시간 기록
        if: ${{ always() && steps.release-build-start.outputs.started_ms != '' }}
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric release-production-build --started-ms "${{ steps.release-build-start.outputs.started_ms }}"
      - name: Release static setup 계측 artifact 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-setup-metrics-static
          path: ${{ runner.temp }}/ci-setup-metrics-${{ github.job }}.jsonl
          if-no-files-found: error
          retention-days: 30

  release_e2e_shard:
    name: Release Chromium E2E shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: "22"
      - name: Playwright setup 계측
        uses: ./.github/actions/playwright-setup
      - name: Release E2E shard 실행
        env:
          CI_E2E_FULLY_PARALLEL: "true"
          E2E_TIMING_OUTPUT: test-results/e2e-timing-shard-${{ matrix.shard }}.json
          E2E_TIMING_SHARD: ${{ matrix.shard }}
          E2E_TIMING_SHARD_COUNT: "6"
        shell: bash
        run: |
          set -euo pipefail
          export E2E_RUN_STARTED_MS="$(date +%s%3N)"
          set +e
          selection="$(node scripts/e2e-shard-planner.mjs select --plan tests/config/e2e-shard-plan.json --shard "${{ matrix.shard }}" --total 6)"
          selection_status=$?
          set -e
          if [[ "$selection_status" -eq 0 ]]; then
            mapfile -t shard_files < <(printf '%s\n' "$selection" | sed '/^$/d')
            if (( ${#shard_files[@]} == 0 )); then
              echo "Historical shard plan assigned zero files; refusing to run an accidental full suite." >&2
              exit 1
            fi
            echo "Historical timing shard plan 사용: ${#shard_files[@]} files"
            npm run test:e2e -- "${shard_files[@]}"
          else
            echo "Historical timing plan 없음/불일치 — Playwright native 6-way sharding fallback"
            npm run test:e2e -- --shard=${{ matrix.shard }}/6
          fi
      - name: Release E2E timing artifact 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-timing-release-shard-${{ matrix.shard }}
          path: test-results/e2e-timing-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Release E2E setup 계측 artifact 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-setup-metrics-e2e-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-setup-metrics-${{ github.job }}.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: 실패 shard Playwright report 업로드
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Release quality gates
    if: always()
    runs-on: ubuntu-latest
    needs: [prepare, quality_static, release_e2e_shard]
    timeout-minutes: 5
    steps:
      - name: Release quality 결과 집계
        shell: bash
        env:
          PREPARE: ${{ needs.prepare.result }}
          STATIC: ${{ needs.quality_static.result }}
          E2E: ${{ needs.release_e2e_shard.result }}
        run: |
          set -euo pipefail
          [[ "$PREPARE" == "success" ]] || {
            echo "Release prepare가 실패하거나 취소되었습니다: $PREPARE" >&2
            exit 1
          }
          [[ "$STATIC" == "success" ]] || {
            echo "Release static quality가 실패하거나 취소되었습니다: $STATIC" >&2
            exit 1
          }
          [[ "$E2E" == "success" ]] || {
            echo "하나 이상의 Release Chromium E2E shard가 실패하거나 취소되었습니다: $E2E" >&2
            exit 1
          }


  container:
    name: Main verified digest 릴리스 후보 재검증
    runs-on: ubuntu-latest
    needs: [prepare, quality]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      candidate_digest: ${{ steps.candidate.outputs.digest }}
      candidate_image: ${{ steps.candidate.outputs.image }}
    steps:
      # actions/checkout v7.0.1
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      # docker/setup-buildx-action v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      # docker/login-action v4.6.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Main verified candidate exact digest 확인
        id: candidate
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.target_sha }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="${IMAGE_NAME}:ci-${EXPECTED_SHA}"
          if ! inspect_output="$(docker buildx imagetools inspect "$candidate" 2>/dev/null)"; then
            echo "Verified main candidate가 없습니다: $candidate" >&2
            echo "정식 release는 exact main CI가 보존한 candidate digest를 사용해야 합니다." >&2
            exit 1
          fi
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspect_output")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Candidate digest 형식이 올바르지 않습니다: $digest" >&2
            exit 1
          }
          exact="${IMAGE_NAME}@${digest}"
          docker pull "$exact"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$exact")"
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$exact")"
          source="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$exact")"
          [[ "$revision" == "$EXPECTED_SHA" ]] || {
            echo "Candidate revision label mismatch: $revision != $EXPECTED_SHA" >&2
            exit 1
          }
          [[ "$version" == "$EXPECTED_VERSION" ]] || {
            echo "Candidate version label mismatch: $version != $EXPECTED_VERSION" >&2
            exit 1
          }
          [[ "$source" == "https://github.com/${GITHUB_REPOSITORY}" ]] || {
            echo "Candidate source label mismatch: $source" >&2
            exit 1
          }
          {
            echo "digest=$digest"
            echo "image=$exact"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Main verified release candidate"
            echo
            echo "- Candidate: `$candidate`"
            echo "- Exact digest: `$digest`"
            echo "- Source SHA: `$EXPECTED_SHA`"
            echo "- Version: `$EXPECTED_VERSION`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 릴리스 후보 Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: "22"
      - name: 릴리스 후보 Playwright setup 계측
        uses: ./.github/actions/playwright-setup
      - name: 릴리스 후보 HTTP·HTTPS 전송 정책 회귀 검사
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx libnss3-tools
          bash scripts/verify-transport-smoke.sh "$CANDIDATE_IMAGE"
      - name: 릴리스 후보 image content policy 검증
        run: sh scripts/verify-image-policy.sh "${{ steps.candidate.outputs.image }}"
      - name: 릴리스 후보 migration·readiness·SQLite persistence 검증
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name mastergantt-release-candidate \
            --env APP_BASE_URL=https://gantt.example.invalid \
            --publish 127.0.0.1:3000:3000 \
            "$CANDIDATE_IMAGE"
          wait_for_ready() {
            for _ in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
                return 0
              fi
              sleep 1
            done
            docker logs mastergantt-release-candidate
            return 1
          }
          wait_for_ready
          docker exec mastergantt-release-candidate node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH); db.exec('CREATE TABLE IF NOT EXISTS release_candidate_smoke (value TEXT NOT NULL)'); db.prepare('INSERT INTO release_candidate_smoke (value) VALUES (?)').run('persisted'); db.close()"
          docker restart mastergantt-release-candidate
          wait_for_ready
          docker exec mastergantt-release-candidate node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH, { readonly: true }); const row = db.prepare('SELECT COUNT(*) AS count FROM release_candidate_smoke WHERE value = ?').get('persisted'); db.close(); if (row.count !== 1) process.exit(1)"
      - name: 릴리스 후보 Project·Task API persistence 검증
        run: node scripts/verify-registry-api-smoke.mjs http://127.0.0.1:3000 mastergantt-release-candidate
      - name: 실패 시 candidate logs
        if: failure()
        run: docker logs mastergantt-release-candidate || true
      - name: Release candidate setup 계측 artifact 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-setup-metrics-candidate
          path: ${{ runner.temp }}/ci-setup-metrics-${{ github.job }}.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: release-candidate container 정리
        if: always()
        run: docker rm --force --volumes mastergantt-release-candidate || true


  publish:
    name: Verified digest attestation·최종 tag promotion
    runs-on: ubuntu-latest
    needs: [prepare, quality, container]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      # actions/checkout v7.0.1
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      # docker/setup-buildx-action v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Docker version 기록
        run: docker version --format '{{.Server.Version}}'
      # docker/login-action v4.6.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: exact SemVer tag 충돌 사전 확인
        env:
          EXACT_IMAGE: ${{ needs.prepare.outputs.exact_image }}
          CANDIDATE_DIGEST: ${{ needs.container.outputs.candidate_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if inspect_output="$(docker buildx imagetools inspect "$EXACT_IMAGE" 2>/dev/null)"; then
            existing_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspect_output")"
            [[ "$existing_digest" == "$CANDIDATE_DIGEST" ]] || {
              echo "Refusing exact tag conflict: $EXACT_IMAGE -> $existing_digest, expected $CANDIDATE_DIGEST" >&2
              exit 1
            }
            echo "Exact SemVer tag가 이미 동일 verified digest를 가리킵니다. idempotent retry로 계속합니다."
          fi

      - name: verified candidate digest GitHub Attestation
        id: attest
        if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        # actions/attest v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ needs.prepare.outputs.image_name }}
          subject-digest: ${{ needs.container.outputs.candidate_digest }}
          push-to-registry: true

      - name: 최종 exact·rolling tag를 verified digest로 promotion
        env:
          EXACT_IMAGE: ${{ needs.prepare.outputs.exact_image }}
          VERIFIED_IMAGE: ${{ needs.container.outputs.candidate_image }}
          CANDIDATE_DIGEST: ${{ needs.container.outputs.candidate_digest }}
          ROLLING_TAGS: ${{ needs.prepare.outputs.rolling_tags }}
        shell: bash
        run: |
          set -euo pipefail

          tag_arguments=(--tag "$EXACT_IMAGE")
          while IFS= read -r destination; do
            if [[ -n "$destination" ]]; then
              tag_arguments+=(--tag "$destination")
            fi
          done <<< "$ROLLING_TAGS"

          docker buildx imagetools create \
            --prefer-index=false \
            "${tag_arguments[@]}" \
            --metadata-file /tmp/promotion-metadata.json \
            "$VERIFIED_IMAGE"

          promoted_digest="$(jq -r '."containerimage.descriptor".digest // empty' /tmp/promotion-metadata.json)"
          [[ "$promoted_digest" == "$CANDIDATE_DIGEST" ]] || {
            echo "Digest promotion changed the verified digest: $promoted_digest != $CANDIDATE_DIGEST" >&2
            exit 1
          }

          {
            echo "## Verified digest release promotion"
            echo
            echo "- Exact tag: $EXACT_IMAGE"
            echo "- Digest: $CANDIDATE_DIGEST"
            echo "- Source candidate: ci-${{ needs.prepare.outputs.target_sha }}"
            echo "- Build: reused exact Main verified digest; no release rebuild."
            echo "- Candidate runtime/API/transport gates: PASS before publication."
            echo "- SBOM/provenance: inherited from the Main BuildKit digest."
            if [[ -n "$ROLLING_TAGS" ]]; then
              echo "- Stable rolling aliases:"
              while IFS= read -r destination; do
                [[ -z "$destination" ]] && continue
                echo "  - $destination"
              done <<< "$ROLLING_TAGS"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true


  resume_finalizer:
    name: Release 완료 lifecycle handoff
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    timeout-minutes: 5
    # Exact/rolling tag publication은 이미 완료된 상태다. Handoff 오류가 immutable
    # release 성공을 실패로 뒤집지 않으며 workflow_run completion listener도 fallback으로 남긴다.
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Generic Finalizer Resume 명시적 dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release target SHA 형식이 올바르지 않습니다: $TARGET_SHA" >&2
            exit 1
          }
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-finalizer-resume.yml/dispatches" \
            -f ref=main \
            -f "inputs[target_sha]=$TARGET_SHA" \
            -f "inputs[release_run_id]=${GITHUB_RUN_ID}"
          {
            echo "## Release lifecycle handoff"
            echo
            echo "- Resume workflow: release-finalizer-resume.yml"
            echo "- Target SHA: `$TARGET_SHA`"
            echo "- Trigger: explicit workflow_dispatch"
            echo "- workflow_run completion listener: fallback 유지"
          } >> "$GITHUB_STEP_SUMMARY" || true
