name: One-time release v0.11.0

on:
  push:
    paths:
      - .github/workflows/one-time-release-v0.11.0.yml

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: e6a1a637c496c365af3d2944aec38dbab0a93962
      TAG_NAME: v0.11.0
      WORK_BRANCH: feature/issue-36-task-editor-fields
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: annotated tag 생성
        run: |
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "$TAG_NAME already exists"
          else
            git tag -a "$TAG_NAME" "$TARGET_SHA" -m "masterGantt $TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
          fi
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG_NAME release already exists"
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "$TAG_NAME" \
              --notes "Issue #36 Task Editor 확장 릴리스\n\n- 진행률 Slider\n- Description 및 URL 필드\n- 안전한 http/https URL 새 탭 실행\n- SQLite migration 및 canonical snapshot 반영\n- 프로젝트 복사 원자성 및 기존 소수 진행률 호환성 보정\n- 관련 API/DB/Task Editor 문서 갱신"
          fi
      - name: release-image workflow 실행 및 완료 대기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-image.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG_NAME"
          sleep 5
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-image.yml --branch "$TAG_NAME" --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "release-image run id: $RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: 작업 브랜치 삭제
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$WORK_BRANCH" || {
            echo "branch already absent or deletion returned non-success"
            gh api "repos/$GITHUB_REPOSITORY/branches/$WORK_BRANCH" && exit 1 || true
          }
      - name: 일회성 workflow 제거
        run: |
          git rm .github/workflows/one-time-release-v0.11.0.yml
          git commit -m "chore: 일회성 v0.11.0 릴리스 workflow 제거"
          git push origin HEAD:main
