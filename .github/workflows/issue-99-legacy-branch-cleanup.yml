name: Issue 99 과거 브랜치 정리 기록

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-99-legacy-branch-cleanup.yml"

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: read

jobs:
  cleanup:
    name: Issue #99 저장소 정리 상태 고정
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_SHA: 527df06f945c8b0820eaca68b1ecbfce991ec3b4
      RELEASE_TAG: v0.26.0
      CLEANUP_BRANCH: chore/issue-99-legacy-branch-cleanup
      STABILIZATION_BRANCH: fix/issue-99-release-validation
      STABILIZATION_PR: 133
      LEGACY_BRANCH_1: feat/issue-99-password-policy
      LEGACY_BRANCH_2: feat/issue-99-password-policy-v2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 릴리스 완료 증거와 cleanup PR 검증
        shell: bash
        run: |
          set -euo pipefail

          test "$(gh api "/repos/$GITHUB_REPOSITORY/issues/99" --jq .state)" = "closed"

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"

          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
          release_ok="$(jq -r --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" '
            [.workflow_runs[]
              | select(.head_sha == $sha)
              | select(.head_branch == $tag)
              | select(.status == "completed")
              | select(.conclusion == "success")]
            | length
          ' <<<"$runs")"
          test "$release_ok" -ge 1

          owner="${GITHUB_REPOSITORY%%/*}"
          prs="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$owner:$CLEANUP_BRANCH&base=main&per_page=20")"
          pr="$(jq -c '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last // empty' <<<"$prs")"
          test -n "$pr"
          cleanup_pr_number="$(jq -r .number <<<"$pr")"
          cleanup_head_sha="$(jq -r .head.sha <<<"$pr")"
          test "$(jq -r .merge_commit_sha <<<"$pr")" = "$TARGET_SHA"
          test "$(git rev-parse "$TARGET_SHA^2")" = "$cleanup_head_sha"
          echo "CLEANUP_PR_NUMBER=$cleanup_pr_number" >> "$GITHUB_ENV"

          stabilization_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$STABILIZATION_PR")"
          test "$(jq -r '.merged_at // ""' <<<"$stabilization_pr")" != ""
          test "$(jq -r .head.ref <<<"$stabilization_pr")" = "$STABILIZATION_BRANCH"
          stabilization_merge_sha="$(jq -r .merge_commit_sha <<<"$stabilization_pr")"
          test -n "$stabilization_merge_sha"
          git merge-base --is-ancestor "$stabilization_merge_sha" "$TARGET_SHA"
          echo "STABILIZATION_MERGE_SHA=$stabilization_merge_sha" >> "$GITHUB_ENV"

      - name: release validation 작업 브랜치 안전 삭제
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/safe_branch_cleanup.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$STABILIZATION_PR" \
            --branch "$STABILIZATION_BRANCH" \
            --target-sha "$STABILIZATION_MERGE_SHA" \
            --delete

      - name: cleanup PR 작업 브랜치 안전 삭제
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/safe_branch_cleanup.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$CLEANUP_PR_NUMBER" \
            --branch "$CLEANUP_BRANCH" \
            --target-sha "$TARGET_SHA" \
            --delete

      - name: Issue #99 최종 저장소 상태 기록
        shell: bash
        run: |
          body="$(printf '%s\n'             "추가 저장소 정리 확인:"             "- 정식 릴리스: $RELEASE_TAG @ $RELEASE_SHA"             "- release validation branch 삭제: $STABILIZATION_BRANCH"             "- cleanup branch 삭제: $CLEANUP_BRANCH"             "- 정책상 보존: $LEGACY_BRANCH_1 (closed/unmerged PR branch)"             "- 정책상 보존: $LEGACY_BRANCH_2 (closed/unmerged PR branch)"             "- 보존 근거: docs/CI_CD.md Issue #99 절 및 scripts/safe_branch_cleanup.py merged-head 계약")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/99/comments" -f body="$body"
