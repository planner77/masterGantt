name: Issue 99 legacy branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-99-legacy-branch-cleanup.yml"

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: read

jobs:
  cleanup:
    name: Issue #99 과거 브랜치 안전 정리
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_SHA: 527df06f945c8b0820eaca68b1ecbfce991ec3b4
      RELEASE_TAG: v0.26.0
      CLEANUP_BRANCH: chore/issue-99-legacy-branch-cleanup
      LEGACY_BRANCH_1: feat/issue-99-password-policy
      LEGACY_BRANCH_1_SHA: 3312856a28c848f18aa14159f2fb246e2145c386
      LEGACY_BRANCH_2: feat/issue-99-password-policy-v2
      LEGACY_BRANCH_2_SHA: 153ecd45517ca6dfb6fa684c8e69c6316ab5033b
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 릴리스 완료 증거와 cleanup PR 검증
        shell: bash
        run: |
          set -euo pipefail

          issue_state="$(gh api "/repos/$GITHUB_REPOSITORY/issues/99" --jq .state)"
          test "$issue_state" = "closed"

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"

          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
          release_ok="$(jq -r --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" '
            [.workflow_runs[]
              | select(.head_sha == $sha)
              | select(.head_branch == $tag)
              | select(.status == "completed")
              | select(.conclusion == "success")]
            | length
          ' <<<"$runs")"
          test "$release_ok" -ge 1

          owner="${GITHUB_REPOSITORY%%/*}"
          prs="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&head=$owner:$CLEANUP_BRANCH&base=main&per_page=20")"
          pr="$(jq -c '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last // empty' <<<"$prs")"
          test -n "$pr"
          test "$(jq -r .merge_commit_sha <<<"$pr")" = "$TARGET_SHA"
          cleanup_head_sha="$(jq -r .head.sha <<<"$pr")"
          test -n "$cleanup_head_sha"
          test "$(git rev-parse "$TARGET_SHA^2")" = "$cleanup_head_sha"
          echo "CLEANUP_HEAD_SHA=$cleanup_head_sha" >> "$GITHUB_ENV"

      - name: 과거 작업 브랜치 및 cleanup 브랜치 SHA lease 삭제
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"

          cleanup_branch() {
            local branch="$1"
            local expected_sha="$2"
            local encoded="${branch//\//%2F}"

            http="$(curl -sSLo /tmp/branch.json -w '%{http_code}'               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded")"

            if [[ "$http" == "404" ]]; then
              echo "Branch already absent: $branch"
              return 0
            fi

            test "$http" = "200"
            actual_sha="$(jq -r .commit.sha /tmp/branch.json)"
            test "$actual_sha" = "$expected_sha"
            test "$(jq -r .protected /tmp/branch.json)" = "false"

            test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$branch&per_page=1" --jq 'length')" = "0"
            test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=$branch&per_page=1" --jq 'length')" = "0"

            git push --porcelain               --force-with-lease="refs/heads/$branch:$actual_sha"               origin ":refs/heads/$branch" >/dev/null

            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Branch deletion verification failed: $branch" >&2
              exit 1
            fi
            echo "Deleted: $branch @ $actual_sha"
          }

          cleanup_branch "$LEGACY_BRANCH_1" "$LEGACY_BRANCH_1_SHA"
          cleanup_branch "$LEGACY_BRANCH_2" "$LEGACY_BRANCH_2_SHA"
          cleanup_branch "$CLEANUP_BRANCH" "$CLEANUP_HEAD_SHA"

      - name: Issue #99 정리 완료 기록
        shell: bash
        run: |
          body="$(printf '%s\n'             "추가 저장소 정리 완료:"             "- 정식 릴리스: $RELEASE_TAG @ $RELEASE_SHA"             "- 삭제: $LEGACY_BRANCH_1"             "- 삭제: $LEGACY_BRANCH_2"             "- 삭제: $CLEANUP_BRANCH")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/99/comments" -f body="$body"
