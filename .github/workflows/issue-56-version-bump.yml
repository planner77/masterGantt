name: Issue 56 version bump

on:
  push:
    branches:
      - feat/issue-56-resource-workload
    paths:
      - .github/workflows/issue-56-version-bump.yml

permissions:
  contents: write

jobs:
  bump:
    name: Bump package manifests to 0.14.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-56-resource-workload
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Update package manifests and remove helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.13.0"
          npm version 0.14.0 --no-git-tag-version
          git rm .github/workflows/issue-56-version-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: Issue #56 버전 0.14.0 반영"
          git push origin HEAD:feat/issue-56-resource-workload
