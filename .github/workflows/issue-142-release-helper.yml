name: Issue 142 릴리스 완료 자동화

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-142-release-helper.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release:
    name: v0.33.0 GHCR 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RELEASE_TAG: v0.33.0
      RELEASE_SHA: 13b2390e65f4f13d0f22a19878146a42fcaaec50
      FEATURE_BRANCH: fix/issue-142-chart-cell-alignment
      FEATURE_PR: "162"
      FEATURE_HEAD_SHA: 214227e96d14ac72cf08f98ab648aa4dfdc431bb
      FEATURE_MERGE_SHA: e5adc9448909fa41d1e1f6d097860159c33fa8cf
      STACK_PR: "161"
      STACK_MERGE_SHA: f685b6d2f2d9036b5f94efdec4e6ab7301ed6620
      FINALIZER_BRANCH: ops/issue-142-release-v0.33.0
      REPAIR_BRANCH: fix/issue-142-release-helper-stacked-cleanup
      PROOF_BRANCH: fix/issue-142-stacked-cleanup-merge-proof
      DISPATCH_BRANCH: fix/issue-142-release-helper-dispatch
      PIN_BRANCH: fix/issue-142-release-sha-pin
      FINAL_FIX_BRANCH: fix/issue-142-final-cleanup
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Issue #142 완료 증거 검증
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$GITHUB_SHA"

          test "$(git show "$target_sha:package.json" | jq -r .version)" = "0.33.0"
          git merge-base --is-ancestor "$RELEASE_SHA" "$target_sha"
          git merge-base --is-ancestor "$STACK_MERGE_SHA" "$target_sha"

          feature_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$FEATURE_PR")"
          test "$(jq -r '.merged_at // ""' <<<"$feature_pr")" != ""
          test "$(jq -r '.head.ref' <<<"$feature_pr")" = "$FEATURE_BRANCH"
          test "$(jq -r '.head.sha' <<<"$feature_pr")" = "$FEATURE_HEAD_SHA"
          test "$(jq -r '.merge_commit_sha' <<<"$feature_pr")" = "$FEATURE_MERGE_SHA"

          stack_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$STACK_PR")"
          test "$(jq -r '.merged_at // ""' <<<"$stack_pr")" != ""
          test "$(jq -r '.base.ref' <<<"$stack_pr")" = "main"
          test "$(jq -r '.merge_commit_sha' <<<"$stack_pr")" = "$STACK_MERGE_SHA"

          main_ci_url=""
          for _ in $(seq 1 300); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=50")"
            run="$(jq -c --arg sha "$target_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
              test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
              main_ci_url="$(jq -r .html_url <<<"$run")"
              break
            fi
            sleep 15
          done
          test -n "$main_ci_url"
          echo "MAIN_CI_URL=$main_ci_url" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"

      - name: v0.33.0 annotated tag 생성 및 GHCR release 완료
        shell: bash
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"

          release_run_url=""
          existing_runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
          successful="$(jq -c --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$existing_runs")"
          if [[ -n "$successful" ]]; then
            release_run_url="$(jq -r .html_url <<<"$successful")"
          else
            dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" -f ref="$RELEASE_TAG"
            for _ in $(seq 1 480); do
              runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=100")"
              run="$(jq -c --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" --arg after "$dispatched_after" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .created_at >= $after)] | sort_by(.created_at) | last // empty' <<<"$runs")"
              if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
                test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
                release_run_url="$(jq -r .html_url <<<"$run")"
                break
              fi
              sleep 15
            done
          fi
          test -n "$release_run_url"
          echo "RELEASE_RUN_URL=$release_run_url" >> "$GITHUB_ENV"

      - name: Issue #142 작업 브랜치 안전 삭제
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"

          python3 scripts/safe_stacked_branch_cleanup.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$FEATURE_PR" \
            --branch "$FEATURE_BRANCH" \
            --carrier-pr "$STACK_PR" \
            --target-sha "$TARGET_SHA" \
            --delete

          finalizer_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&head=$owner:$FINALIZER_BRANCH&per_page=10" | jq -r '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number // empty')"
          test -n "$finalizer_pr"
          python3 scripts/safe_branch_cleanup.py --repo "$GITHUB_REPOSITORY" --pr "$finalizer_pr" --branch "$FINALIZER_BRANCH" --target-sha "$TARGET_SHA" --delete

          for cleanup_branch in "$REPAIR_BRANCH" "$PROOF_BRANCH" "$DISPATCH_BRANCH" "$PIN_BRANCH" "$FINAL_FIX_BRANCH"; do
            cleanup_pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&head=$owner:$cleanup_branch&per_page=10" | jq -r '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number // empty')"
            test -n "$cleanup_pr"
            python3 scripts/safe_branch_cleanup.py --repo "$GITHUB_REPOSITORY" --pr "$cleanup_pr" --branch "$cleanup_branch" --target-sha "$TARGET_SHA" --delete
          done

      - name: Issue #142 FINAL 기록 및 종료
        shell: bash
        run: |
          set -euo pipefail
          body="$(printf '%s\n'             "## FINAL · Issue #142 완료"             ""             "**최종 상태:** COMPLETED"             ""             "- 기능 PR: #162 (stacked, merged)"             "- main 통합 PR: #161 (merged)"             "- 기능 head: $FEATURE_HEAD_SHA"             "- 기능 merge SHA: $FEATURE_MERGE_SHA"             "- main 통합 merge SHA: $STACK_MERGE_SHA"             "- 최종 버전: 0.33.0"             "- 정식 tag: $RELEASE_TAG"             "- main CI: $MAIN_CI_URL"             "- GHCR 정식 release: $RELEASE_RUN_URL"             "- 작업 브랜치 삭제: $FEATURE_BRANCH"             "- finalization 브랜치 삭제: $FINALIZER_BRANCH"             "- helper 보완 브랜치 삭제: $REPAIR_BRANCH, $PROOF_BRANCH, $DISPATCH_BRANCH, $PIN_BRANCH, $FINAL_FIX_BRANCH"             "- 문서 동기화: CHANGELOG / PROJECT_UX / REQUIREMENTS / TEST_PLAN"             "- #142 PR CI #857: PASS"             "- 잔여 차단 사항: 없음")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/142/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/142" -f state="closed" -f state_reason="completed"
