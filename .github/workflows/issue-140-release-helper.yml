name: Issue 140 릴리스 완료 자동화

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-140-release-helper.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release:
    name: v0.32.0 GHCR 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RELEASE_TAG: v0.32.0
      TARGET_SHA: f685b6d2f2d9036b5f94efdec4e6ab7301ed6620
      FEATURE_BRANCH: feat/issue-140-gantt-inline-name
      FEATURE_PR: "161"
      FEATURE_HEAD_SHA: 793e34150ad7b4ea526cb50cd6ec2c4035c26211
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Issue #140 완료 증거 검증
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "0.32.0"
          git merge-base --is-ancestor "$TARGET_SHA" "$GITHUB_SHA"

          pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$FEATURE_PR")"
          test "$(jq -r '.merged_at // ""' <<<"$pr")" != ""
          test "$(jq -r '.head.ref' <<<"$pr")" = "$FEATURE_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$FEATURE_HEAD_SHA"
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$TARGET_SHA"

          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=100")"
          main_ci="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$runs")"
          test -n "$main_ci"
          echo "MAIN_CI_URL=$(jq -r .html_url <<<"$main_ci")" >> "$GITHUB_ENV"

      - name: v0.32.0 annotated tag 생성 및 GHCR release 완료
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"

          existing="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?per_page=100")"
          successful="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$existing")"
          if [[ -n "$successful" ]]; then
            release_run_url="$(jq -r .html_url <<<"$successful")"
          else
            dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" -f ref="$RELEASE_TAG"
            release_run_url=""
            for _ in $(seq 1 480); do
              runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=100")"
              run="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" --arg after "$dispatched_after" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .created_at >= $after)] | sort_by(.created_at) | last // empty' <<<"$runs")"
              if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
                test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
                release_run_url="$(jq -r .html_url <<<"$run")"
                break
              fi
              sleep 15
            done
          fi
          test -n "$release_run_url"
          echo "RELEASE_RUN_URL=$release_run_url" >> "$GITHUB_ENV"

      - name: Issue #140 작업 브랜치 안전 삭제
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/safe_branch_cleanup.py             --repo "$GITHUB_REPOSITORY"             --pr "$FEATURE_PR"             --branch "$FEATURE_BRANCH"             --target-sha "$TARGET_SHA"             --delete

      - name: Issue #140 FINAL 기록 및 종료
        shell: bash
        run: |
          set -euo pipefail
          body="$(printf '%s\n'             "## FINAL · Issue #140 완료"             ""             "**최종 상태:** COMPLETED"             ""             "- 기능 PR: #161 (merged)"             "- 기능 head: $FEATURE_HEAD_SHA"             "- main merge SHA: $TARGET_SHA"             "- 최종 버전: 0.32.0"             "- 정식 tag: $RELEASE_TAG"             "- main CI: $MAIN_CI_URL"             "- GHCR 정식 release: $RELEASE_RUN_URL"             "- 작업 브랜치 삭제: $FEATURE_BRANCH"             "- 문서 동기화: CHANGELOG / PROJECT_UX / REQUIREMENTS / TASK_EDITOR / TEST_PLAN"             "- PR CI #861: PASS"             "- main CI #862: PASS"             "- 잔여 차단 사항: 없음")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/140/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/140" -f state="closed" -f state_reason="completed"
