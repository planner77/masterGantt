name: Issue 140 릴리스 완료 자동화

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-140-release-helper.yml"

permissions:
  contents: write
  packages: write
  actions: read
  issues: write
  pull-requests: read

jobs:
  release:
    name: v0.32.0 exact GHCR 소급 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: v0.32.0
      RELEASE_VERSION: 0.32.0
      TARGET_SHA: f685b6d2f2d9036b5f94efdec4e6ab7301ed6620
      FEATURE_BRANCH: feat/issue-140-gantt-inline-name
      FEATURE_PR: "161"
      FEATURE_HEAD_SHA: 793e34150ad7b4ea526cb50cd6ec2c4035c26211
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact Issue #140 merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f685b6d2f2d9036b5f94efdec4e6ab7301ed6620
          fetch-depth: 0
          persist-credentials: false

      - name: Issue #140 완료 증거와 소급 릴리스 경계 검증
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" != "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(jq -r .version package.json)" = "$RELEASE_VERSION"

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"

          pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$FEATURE_PR")"
          test "$(jq -r '.merged_at // ""' <<<"$pr")" != ""
          test "$(jq -r '.head.ref' <<<"$pr")" = "$FEATURE_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$FEATURE_HEAD_SHA"
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$TARGET_SHA"

          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=100")"
          main_ci="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$runs")"
          test -n "$main_ci"
          echo "MAIN_CI_URL=$(jq -r .html_url <<<"$main_ci")" >> "$GITHUB_ENV"

          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "RELEASE_RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 기존 0.32.0 exact 이미지 덮어쓰기 거부
        shell: bash
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE_NAME:$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Exact image already exists: $IMAGE_NAME:$RELEASE_VERSION"
            exit 0
          fi
          echo "PUBLISH_REQUIRED=true" >> "$GITHUB_ENV"

      - name: Build and push exact v0.32.0 image only
        id: push
        if: env.PUBLISH_REQUIRED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.TARGET_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Resolve exact digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_VERSION" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
            if [[ "$digest" == sha256:* ]]; then
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Pull exact digest and start released image
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_NAME@${{ steps.digest.outputs.digest }}"
          docker pull "$image"
          docker run --detach --name mastergantt-release-smoke             --env APP_BASE_URL=https://gantt.example.invalid             --publish 127.0.0.1:3000:3000             "$image"

      - name: Verify released image readiness, persistence and API
        shell: bash
        run: |
          set -euo pipefail
          wait_for_ready() {
            for _ in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
                return 0
              fi
              sleep 1
            done
            docker logs mastergantt-release-smoke
            return 1
          }
          wait_for_ready
          docker exec mastergantt-release-smoke node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH); db.exec('CREATE TABLE IF NOT EXISTS issue140_release_smoke (value TEXT NOT NULL)'); db.prepare('INSERT INTO issue140_release_smoke (value) VALUES (?)').run('persisted'); db.close()"
          docker restart mastergantt-release-smoke
          wait_for_ready
          docker exec mastergantt-release-smoke node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH, { readonly: true }); const row = db.prepare('SELECT COUNT(*) AS count FROM issue140_release_smoke WHERE value = ?').get('persisted'); db.close(); if (row.count !== 1) process.exit(1)"
          node scripts/verify-registry-api-smoke.mjs http://127.0.0.1:3000 mastergantt-release-smoke

      - name: Verify rolling aliases were not moved backward
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = "0.32.0"
          echo "Retroactive exact release intentionally does not modify 0.32/0/latest rolling aliases."

      - name: Remove release smoke container
        if: always()
        run: docker rm --force --volumes mastergantt-release-smoke || true

      - name: Issue #140 작업 브랜치 안전 삭제
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/safe_branch_cleanup.py             --repo "$GITHUB_REPOSITORY"             --pr "$FEATURE_PR"             --branch "$FEATURE_BRANCH"             --target-sha "$TARGET_SHA"             --delete

      - name: Issue #140 FINAL 기록 및 종료
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.digest.outputs.digest }}"
          body="$(printf '%s\n'             "## FINAL · Issue #140 완료"             ""             "**최종 상태:** COMPLETED"             ""             "- 기능 PR: #161 (merged)"             "- 기능 head: $FEATURE_HEAD_SHA"             "- main merge SHA: $TARGET_SHA"             "- 최종 버전: $RELEASE_VERSION"             "- 정식 annotated tag: $RELEASE_TAG"             "- main CI: $MAIN_CI_URL"             "- GHCR exact image: $IMAGE_NAME:$RELEASE_VERSION"             "- GHCR digest: $digest"             "- 소급 릴리스 정책: exact SemVer tag만 게시, rolling alias 미변경"             "- release helper: $RELEASE_RUN_URL"             "- 작업 브랜치 삭제: $FEATURE_BRANCH"             "- 문서 동기화: CHANGELOG / PROJECT_UX / REQUIREMENTS / TASK_EDITOR / TEST_PLAN"             "- PR CI #861: PASS"             "- main CI #862: PASS"             "- 잔여 차단 사항: 없음")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/140/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/140" -f state="closed" -f state_reason="completed"
