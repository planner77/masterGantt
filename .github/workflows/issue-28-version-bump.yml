name: Issue 28 버전 동기화
run-name: Issue #28 v0.13.0 버전 파일 동기화

on:
  push:
    branches:
      - feat/issue-28-excel-export
    paths:
      - .github/workflows/issue-28-version-bump.yml

permissions:
  contents: write

jobs:
  version-bump:
    name: package 및 lockfile 버전 동기화
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: v0.13.0 버전 동기화 및 변경 로그 갱신
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.13.0 --no-git-tag-version
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'CHANGELOG.md';
          const text = fs.readFileSync(path, 'utf8');
          const marker = '## [Unreleased]\n';
          if (!text.includes(marker)) throw new Error('CHANGELOG Unreleased marker not found');
          const section = `## [0.13.0] - 2026-09-16\n\n### Added\n\n- Issue #28: 프로젝트의 Grid와 Gantt Chart를 계층/WBS, 시작·종료일, 근무일 기간, 진행률과 함께 Excel(.xlsx)로 내보내는 기능을 추가한다.\n- 내보내기 실행 때마다 작업 관계 포함/제외/취소를 명시적으로 선택하며, 관계 포함 시 Dependencies 시트와 Gantt 관계 화살표를 생성한다.\n- canonical snapshot과 strong If-Match를 사용해 동일 revision의 읽기 전용 데이터를 내보내고, 외부 Excel 서비스나 SVAR PRO export 기능에 프로젝트 데이터를 전송하지 않는다.\n\n### Changed\n\n- 사용자 기능 추가에 따라 Semantic Versioning 정책으로 애플리케이션 버전을 0.12.0에서 0.13.0으로 증가한다.\n\n`;
          fs.writeFileSync(path, text.replace(marker, `${marker}\n${section}`));
          NODE
          rm .github/workflows/issue-28-version-bump.yml

      - name: 버전 일관성 확인
        run: node scripts/verify-release-version.mjs

      - name: 버전 변경 커밋 및 브랜치 반영
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md .github/workflows/issue-28-version-bump.yml
          git commit -m 'chore: v0.13.0 버전 반영 (#28)'
          git push origin HEAD:feat/issue-28-excel-export
