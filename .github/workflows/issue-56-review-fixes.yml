name: Issue 56 review fixes

on:
  push:
    branches:
      - feat/issue-56-resource-workload
    paths:
      - .github/workflows/issue-56-review-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    name: Apply Issue 56 review fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-56-resource-workload
          fetch-depth: 0
      - name: Patch implementation, tests and DB documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Strict date validation through the scheduling domain.
          path = Path('src/server/resources/resource-catalog-service-core.ts')
          text = path.read_text()
          anchor = 'import { ProjectRepository, EditSessionRepository } from "../repositories/project-repository-core";'
          if 'import { parseDateOnly } from "../../domain/scheduling/date-only";' not in text:
              text = text.replace(anchor, 'import { parseDateOnly } from "../../domain/scheduling/date-only";\n' + anchor, 1)
          text = text.replace('const DATE_ONLY = /^\\d{4}-\\d{2}-\\d{2}$/;\n', '')
          old = '''function validDateOrNull(value: unknown): value is string | null | undefined {
            return value === undefined || value === null || (typeof value === "string" && DATE_ONLY.test(value) && !Number.isNaN(Date.parse(`${value}T00:00:00Z`)));
          }'''
          new = '''function validDateOrNull(value: unknown): value is string | null | undefined {
            if (value === undefined || value === null) return true;
            if (typeof value !== "string") return false;
            try { parseDateOnly(value, "allocationDate"); return true; } catch { return false; }
          }'''
          if old not in text:
              raise SystemExit('validDateOrNull anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Non-leaf assignments are references only and must not affect workload/unset warnings.
          path = Path('src/server/resources/resource-workload-service-core.ts')
          text = path.read_text()
          text = text.replace('if (!task || !resource) continue;\n      const effectiveStart', 'if (!task || !resource || task.type !== "task") continue;\n      const effectiveStart', 1)
          text = text.replace('const configured = assignment.allocationPercent !== null && task.type === "task";', 'const configured = assignment.allocationPercent !== null;', 1)
          path.write_text(text)

          # Reject a task schedule change when it would invalidate explicit allocation bounds.
          path = Path('src/server/projects/task-field-project-service.ts')
          text = path.read_text()
          old_import = '''import {
            ProjectService,
            type AuthorizedEditSession,
            type CreatedProject,
            type ProjectServiceOptions,
          } from "./project-service-core";'''
          new_import = '''import {
            InvalidTaskInputError,
            ProjectService,
            type AuthorizedEditSession,
            type CreatedProject,
            type ProjectServiceOptions,
          } from "./project-service-core";'''
          if old_import not in text:
              raise SystemExit('project service import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old_update = '''      const response = super.updateTask(authorization, expectedRevision, taskPublicId, input);
              if (input.description !== undefined || input.url !== undefined) {'''
          new_update = '''      const response = super.updateTask(authorization, expectedRevision, taskPublicId, input);
              const updatedSchedule = this.schedulesForFields.findTaskByPublicId(authorization.projectId, taskPublicId);
              if (!updatedSchedule) throw new Error("Updated task schedule could not be read back.");
              if (updatedSchedule.type === "task") {
                const invalidAllocation = this.resourcesForFields.listAssignments(authorization.projectId).some((assignment) =>
                  assignment.kind === "resource" && assignment.taskPublicId === taskPublicId &&
                  ((assignment.assignmentStart !== null && (assignment.assignmentStart < updatedSchedule.startDate || assignment.assignmentStart > updatedSchedule.endDate)) ||
                    (assignment.assignmentEnd !== null && (assignment.assignmentEnd < updatedSchedule.startDate || assignment.assignmentEnd > updatedSchedule.endDate))),
                );
                if (invalidAllocation) throw new InvalidTaskInputError();
              }
              if (input.description !== undefined || input.url !== undefined) {'''
          if old_update not in text:
              raise SystemExit('TaskField update anchor not found')
          text = text.replace(old_update, new_update, 1)
          path.write_text(text)

          # Forward M/M policy into canonical Compose deployments.
          path = Path('deploy/compose.yml')
          text = path.read_text()
          old_compose = '      LOG_LEVEL: ${LOG_LEVEL:-info}\n'
          new_compose = '''      LOG_LEVEL: ${LOG_LEVEL:-info}
                # 조직의 1 M/M 환산 근무일 수. 미설정/빈 값이면 M/M 조회를 비활성화한다.
                RESOURCE_MD_PER_MM: "${RESOURCE_MD_PER_MM:-}"
          '''
          if old_compose not in text:
              raise SystemExit('compose LOG_LEVEL anchor not found')
          text = text.replace(old_compose, new_compose, 1)
          path.write_text(text)

          # Update the DB source of truth for migration 0005.
          path = Path('docs/DB_SCHEMA.md')
          text = path.read_text()
          old_intro = 'Issue #54에서 Project 표시용 Owner를 위한 `0004_project_owner.sql`을 추가했다.'
          new_intro = old_intro + ' Issue #56에서 Resource 계획 투입 기간/투입률과 workload 조회 index를 위한 `0005_resource_workload.sql`을 추가했다.'
          if old_intro in text and 'Issue #56에서 Resource 계획 투입' not in text:
              text = text.replace(old_intro, new_intro, 1)
          old_assignment = 'Task/Summary/Milestone과 글로벌 Resource 또는 Group의 직접 할당을 저장한다. `(project_id, task_id)` composite FK로 Project 경계를 DB에서도 강제하고, `resource_id`와 `group_id`는 XOR CHECK로 정확히 하나만 허용한다. 부분 UNIQUE index로 같은 Task에 같은 Resource/Group의 중복 할당을 차단한다. Task/Project 삭제에는 assignment가 cascade되지만 글로벌 catalog FK는 `ON DELETE RESTRICT`다. Group assignment는 팀 참조이며 Group member 개인 assignment로 자동 확장하지 않는다.'
          new_assignment = old_assignment + '''

          `0005_resource_workload.sql`은 기존 row 호환을 위해 Resource assignment의 `assignment_start`, `assignment_end`, `allocation_percent`를 nullable로 추가한다. 두 날짜는 `YYYY-MM-DD` 길이 제약을 DB에서 두고 실제 Gregorian 날짜 검증은 Scheduling Domain의 `parseDateOnly`가 담당한다. `allocation_percent`는 NULL 또는 `0 < value <= 100`만 허용한다. 기존 NULL allocation은 100%로 추정하지 않고 `공수 미설정`으로 취급한다. Group assignment에는 이 세 필드를 사용하지 않는다. 명시 Resource allocation 기간은 leaf Task의 확정 `start_date/end_date` 안에 있어야 하며 Task 일정 변경도 같은 invariant를 다시 검증해 위반 시 transaction 전체를 rollback한다.'''
          if old_assignment in text and '`0005_resource_workload.sql`은 기존 row 호환' not in text:
              text = text.replace(old_assignment, new_assignment, 1)
          index_anchor = 'task_assignments(resource_id) WHERE resource_id IS NOT NULL\n'
          if 'task_assignments(project_id, resource_id, assignment_start, assignment_end) WHERE resource_id IS NOT NULL' not in text:
              text = text.replace(index_anchor, index_anchor + 'task_assignments(project_id, resource_id, assignment_start, assignment_end) WHERE resource_id IS NOT NULL\n', 1)
          path.write_text(text)
          PY

          cat > tests/server/resources/resource-workload-service.test.ts <<'EOF'
          import { randomUUID } from "node:crypto";
          import { join } from "node:path";

          import { describe, expect, it } from "vitest";

          import { openDatabase } from "../../../src/server/db/core";
          import { EditSessionRepository, ProjectRepository } from "../../../src/server/repositories/project-repository-core";
          import { ScheduleRepository } from "../../../src/server/repositories/schedule-repository-core";
          import { ResourceCatalogService } from "../../../src/server/resources/resource-catalog-service-core";
          import { ResourceWorkloadService } from "../../../src/server/resources/resource-workload-service-core";
          import { createSessionToken } from "../../../src/server/security/session-core";

          const migrationsDirectory = join(process.cwd(), "db", "migrations");
          const NOW = "2026-09-15T12:00:00.000Z";

          function fixture() {
            const { database } = openDatabase({ filename: ":memory:", migrationsDirectory });
            const projects = new ProjectRepository(database);
            const sessions = new EditSessionRepository(database);
            const schedules = new ScheduleRepository(database);
            const project = projects.insert({
              publicId: randomUUID(), name: "Workload fixture", description: "", passwordKdf: "scrypt",
              passwordSalt: Buffer.alloc(16, 1), passwordHash: Buffer.alloc(32, 2), scryptN: 32768, scryptR: 8, scryptP: 3,
              scryptKeyLength: 32, calendarTimezone: "Asia/Seoul", createdAt: NOW, updatedAt: NOW,
            });
            const token = createSessionToken();
            const sessionId = sessions.insert({ projectId: project.id, tokenHash: token.tokenHash, authVersion: project.authVersion, createdAt: NOW, expiresAt: "2026-10-01T00:00:00.000Z" });
            const addTask = (name: string, type: "task" | "summary", start: string, end: string, duration: number) => schedules.insertTask({
              projectId: project.id, externalId: randomUUID(), publicId: randomUUID(), name, type, scheduleMode: "auto",
              requestedStart: type === "summary" ? null : start, startDate: start, endDate: end, duration, progress: 0,
              parentId: null, sortOrder: schedules.nextRootSortOrder(project.id), createdAt: NOW, updatedAt: NOW,
            });
            const first = addTask("First", "task", "2026-09-14", "2026-09-20", 4);
            const second = addTask("Second", "task", "2026-09-14", "2026-09-20", 4);
            const legacy = addTask("Legacy", "task", "2026-09-14", "2026-09-20", 4);
            const summary = addTask("Summary reference", "summary", "2026-09-14", "2026-09-20", 4);
            schedules.insertHoliday(project.id, "2026-09-16", "Company holiday", NOW);
            return {
              database, project, schedules, first, second, legacy, summary,
              authorization: { projectId: project.id, projectPublicId: project.publicId, projectRevision: 1, projectAuthVersion: project.authVersion, sessionId, tokenHash: token.tokenHash, expiresAt: "2026-10-01T00:00:00.000Z" },
            };
          }

          describe("ResourceWorkloadService", () => {
            it("calculates calendar effort, clips ranges, detects overlap, keeps legacy unset and deduplicates multi-group totals", () => {
              const f = fixture();
              try {
                const resources = new ResourceCatalogService(f.database, { clock: () => new Date(NOW) });
                const admin = resources.unlockAdmin("correct-resource-admin-password", "correct-resource-admin-password");
                if (!admin) throw new Error("admin session not created");
                let catalog = resources.createTarget("resource", admin.rawToken, 1, { name: "Resource A", code: "R-A" });
                const resourceA = catalog.data.resources.at(-1)!;
                catalog = resources.createTarget("resource", admin.rawToken, catalog.data.revision, { name: "Resource B", code: "R-B" });
                const resourceB = catalog.data.resources.find((r) => r.code === "R-B")!;
                catalog = resources.createTarget("group", admin.rawToken, catalog.data.revision, { name: "Group A" });
                const groupA = catalog.data.groups.find((g) => g.name === "Group A")!;
                catalog = resources.createTarget("group", admin.rawToken, catalog.data.revision, { name: "Group B" });
                const groupB = catalog.data.groups.find((g) => g.name === "Group B")!;
                catalog = resources.replaceGroupMembers(groupA.id, admin.rawToken, catalog.data.revision, { resourceIds: [resourceA.id] });
                catalog = resources.replaceGroupMembers(groupB.id, admin.rawToken, catalog.data.revision, { resourceIds: [resourceA.id] });

                let revision = 1;
                revision = resources.replaceTaskAssignments(f.authorization, revision, f.first.publicId, {
                  catalogRevision: catalog.data.revision,
                  targets: [{ kind: "resource", id: resourceA.id, allocation: { percent: 50 } }],
                }).data.projectRevision;
                revision = resources.replaceTaskAssignments(f.authorization, revision, f.second.publicId, {
                  catalogRevision: catalog.data.revision,
                  targets: [{ kind: "resource", id: resourceA.id, allocation: { start: "2026-09-15", end: "2026-09-20", percent: 60 } }],
                }).data.projectRevision;
                revision = resources.replaceTaskAssignments(f.authorization, revision, f.legacy.publicId, {
                  catalogRevision: catalog.data.revision,
                  targets: [{ kind: "resource", id: resourceB.id }],
                }).data.projectRevision;
                resources.replaceTaskAssignments(f.authorization, revision, f.summary.publicId, {
                  catalogRevision: catalog.data.revision,
                  targets: [{ kind: "resource", id: resourceB.id, allocation: { start: "2026-09-14", end: "2026-09-20", percent: 80 } }],
                });

                const service = new ResourceWorkloadService(f.database);
                const full = service.get(f.project.publicId, "2026-09-14", "2026-09-20", "20")!;
                expect(full.data.grandTotalMd).toBe(3.8);
                expect(full.data.grandTotalMm).toBe(0.19);
                expect(full.data.unsetCount).toBe(1);
                const firstGroup = full.data.groups.find((g) => g.name === "Group A")!;
                const secondGroup = full.data.groups.find((g) => g.name === "Group B")!;
                expect(firstGroup.effortMd).toBe(3.8);
                expect(secondGroup.effortMd).toBe(3.8);
                expect(firstGroup.resources[0].overAllocated).toBe(true);
                const ungrouped = full.data.groups.find((g) => g.name === "미분류 리소스")!;
                expect(ungrouped.unsetCount).toBe(1);
                expect(ungrouped.resources[0].tasks).toHaveLength(1);
                expect(ungrouped.resources[0].tasks[0].taskName).toBe("Legacy");

                const clipped = service.get(f.project.publicId, "2026-09-15", "2026-09-17", "20")!;
                expect(clipped.data.grandTotalMd).toBe(2.2);
                expect(clipped.data.grandTotalMm).toBe(0.11);
              } finally { f.database.close(); }
            });
          });
          EOF

          cat > tests/server/resources/resource-workload-integrity.test.ts <<'EOF'
          import { randomUUID } from "node:crypto";
          import { join } from "node:path";

          import { describe, expect, it } from "vitest";

          import { openDatabase } from "../../../src/server/db/core";
          import { InvalidTaskInputError } from "../../../src/server/projects/project-service-core";
          import { TaskFieldProjectService } from "../../../src/server/projects/task-field-project-service";
          import { EditSessionRepository, ProjectRepository } from "../../../src/server/repositories/project-repository-core";
          import { ScheduleRepository } from "../../../src/server/repositories/schedule-repository-core";
          import { ResourceCatalogInvalidInputError, ResourceCatalogService } from "../../../src/server/resources/resource-catalog-service-core";
          import { createSessionToken } from "../../../src/server/security/session-core";

          const migrationsDirectory = join(process.cwd(), "db", "migrations");
          const NOW = "2026-09-15T12:00:00.000Z";

          describe("resource workload integrity", () => {
            it("rejects normalized-invalid dates and rolls back task reschedules that would invalidate explicit allocation bounds", () => {
              const { database } = openDatabase({ filename: ":memory:", migrationsDirectory });
              try {
                const projectsRepo = new ProjectRepository(database);
                const sessions = new EditSessionRepository(database);
                const schedules = new ScheduleRepository(database);
                const project = projectsRepo.insert({
                  publicId: randomUUID(), name: "Integrity fixture", description: "", passwordKdf: "scrypt",
                  passwordSalt: Buffer.alloc(16, 1), passwordHash: Buffer.alloc(32, 2), scryptN: 32768, scryptR: 8, scryptP: 3,
                  scryptKeyLength: 32, calendarTimezone: "Asia/Seoul", createdAt: NOW, updatedAt: NOW,
                });
                const token = createSessionToken();
                const sessionId = sessions.insert({ projectId: project.id, tokenHash: token.tokenHash, authVersion: project.authVersion, createdAt: NOW, expiresAt: "2026-10-01T00:00:00.000Z" });
                const task = schedules.insertTask({
                  projectId: project.id, externalId: randomUUID(), publicId: randomUUID(), name: "Long task", type: "task", scheduleMode: "auto",
                  requestedStart: "2026-02-02", startDate: "2026-02-02", endDate: "2026-03-06", duration: 25, progress: 0,
                  parentId: null, sortOrder: 0, createdAt: NOW, updatedAt: NOW,
                });
                const authorization = { projectId: project.id, projectPublicId: project.publicId, projectRevision: 1, projectAuthVersion: project.authVersion, sessionId, tokenHash: token.tokenHash, expiresAt: "2026-10-01T00:00:00.000Z" };
                const resources = new ResourceCatalogService(database, { clock: () => new Date(NOW) });
                const admin = resources.unlockAdmin("correct-resource-admin-password", "correct-resource-admin-password");
                if (!admin) throw new Error("admin session not created");
                const catalog = resources.createTarget("resource", admin.rawToken, 1, { name: "Resource" });
                const resource = catalog.data.resources[0];

                expect(() => resources.replaceTaskAssignments(authorization, 1, task.publicId, {
                  catalogRevision: catalog.data.revision,
                  targets: [{ kind: "resource", id: resource.id, allocation: { start: "2026-02-30", end: "2026-03-02", percent: 50 } }],
                })).toThrow(ResourceCatalogInvalidInputError);

                const assigned = resources.replaceTaskAssignments(authorization, 1, task.publicId, {
                  catalogRevision: catalog.data.revision,
                  targets: [{ kind: "resource", id: resource.id, allocation: { start: "2026-02-10", end: "2026-02-20", percent: 50 } }],
                });
                expect(assigned.data.projectRevision).toBe(2);

                const projects = new TaskFieldProjectService(database, { clock: () => new Date(NOW) });
                expect(() => projects.updateTask({ ...authorization, projectRevision: 2 }, 2, task.publicId, {
                  start: "2026-02-23", duration: 5,
                })).toThrow(InvalidTaskInputError);

                const snapshot = projects.getReadonlySnapshot(project.publicId)!;
                expect(snapshot.data.project.revision).toBe(2);
                expect(snapshot.data.tasks[0]).toMatchObject({ start: "2026-02-02", end: "2026-03-06", duration: 25 });
                expect(snapshot.data.assignments?.[0]).toMatchObject({
                  taskId: task.publicId,
                  allocation: { start: "2026-02-10", end: "2026-02-20", percent: 50 },
                });
              } finally { database.close(); }
            });
          });
          EOF

          git rm .github/workflows/issue-56-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/resources/resource-catalog-service-core.ts src/server/resources/resource-workload-service-core.ts src/server/projects/task-field-project-service.ts deploy/compose.yml docs/DB_SCHEMA.md tests/server/resources/resource-workload-service.test.ts tests/server/resources/resource-workload-integrity.test.ts
          git commit -m "fix: Issue #56 리뷰 결함 및 공수 회귀 테스트 보강"
          git push origin HEAD:feat/issue-56-resource-workload
