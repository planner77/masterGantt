name: Issue 19 Route Inventory Fix

on:
  push:
    branches: [feat/issue-19-resource-catalog]
    paths:
      - .github/workflows/issue19-route-inventory-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Update exact route inventory expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/server/projects/edit-authorization-handlers.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '''      "DELETE /api/projects/{publicId}/tasks/{taskId}",\n    ]);'''
          new = '''      "DELETE /api/projects/{publicId}/tasks/{taskId}",\n      "POST /api/resource-catalog/admin-sessions",\n      "DELETE /api/resource-catalog/admin-sessions",\n      "GET /api/resources",\n      "POST /api/resources",\n      "PATCH /api/resources/{resourceId}",\n      "GET /api/resource-groups",\n      "POST /api/resource-groups",\n      "PATCH /api/resource-groups/{groupId}",\n      "PUT /api/resource-groups/{groupId}/members",\n      "GET /api/projects/{publicId}/assignment-targets",\n      "GET /api/projects/{publicId}/assigned-targets",\n      "PUT /api/projects/{publicId}/tasks/{taskId}/assignments",\n    ]);'''
          if old not in text:
              raise SystemExit('route inventory expectation anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/issue19-route-inventory-fix.yml
      - name: Commit test maintenance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(security): Issue 19 route inventory 기대값 갱신 (#19)"
          git push origin HEAD:feat/issue-19-resource-catalog
