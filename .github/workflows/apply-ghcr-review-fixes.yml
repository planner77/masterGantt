name: GHCR 정책 리뷰 보완 적용

on:
  push:
    branches:
      - chore/ghcr-ephemeral-cleanup

permissions:
  contents: write

jobs:
  apply:
    name: 리뷰 문서와 workflow 보완 결과 생성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/ghcr-ephemeral-cleanup
      - name: 리뷰 보완 적용
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-ghcr-review-fixes.py

          mkdir -p .tmp-ghcr-review
          cp .github/workflows/ci.yml .tmp-ghcr-review/ci.yml
          cp .github/workflows/release-image.yml .tmp-ghcr-review/release-image.yml
          git restore .github/workflows/ci.yml .github/workflows/release-image.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TEST_PLAN.md docs/DEPLOYMENT.md docs/SECURITY.md docs/ARCHITECTURE.md .tmp-ghcr-review
          git commit -m "docs: GHCR 임시 이미지 정책 검증 계약 보완"
          git push origin HEAD:chore/ghcr-ephemeral-cleanup
