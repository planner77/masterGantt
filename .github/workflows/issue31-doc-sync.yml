name: Issue 31 관련 문서 일회성 동기화

on:
  push:
    branches:
      - feat/issue-31-task-context-delete

permissions:
  contents: write

jobs:
  sync-docs:
    name: Issue 31 문서 계약 동기화
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/issue-31-task-context-delete
          fetch-depth: 0
      - name: 문서 갱신 스크립트 실행
        run: python3 scripts/issue31-doc-sync.py
      - name: 변경이 있을 때 문서 커밋
        shell: bash
        run: |
          if git diff --quiet -- docs CHANGELOG.md; then
            echo "Issue #31 문서는 이미 동기화되어 있습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs CHANGELOG.md
          git commit -m "docs: Issue 31 삭제 계약과 검증 계획 갱신"
          git push origin HEAD:feat/issue-31-task-context-delete
