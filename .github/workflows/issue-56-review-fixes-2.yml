name: Issue 56 review fixes 2

on:
  push:
    branches:
      - feat/issue-56-resource-workload
    paths:
      - .github/workflows/issue-56-review-fixes-2.yml

permissions:
  contents: write

jobs:
  fix:
    name: Apply Issue 56 review fixes v3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-56-resource-workload
          fetch-depth: 0
      - name: Patch review findings and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Strict Gregorian date validation for allocation dates.
          p = Path('src/server/resources/resource-catalog-service-core.ts')
          s = p.read_text()
          anchor = 'import { ProjectRepository, EditSessionRepository } from "../repositories/project-repository-core";'
          if 'import { parseDateOnly } from "../../domain/scheduling/date-only";' not in s:
              if anchor not in s: raise SystemExit('catalog import anchor missing')
              s = s.replace(anchor, 'import { parseDateOnly } from "../../domain/scheduling/date-only";\n' + anchor, 1)
          s = s.replace('const DATE_ONLY = /^\\d{4}-\\d{2}-\\d{2}$/;\n', '')
          a = s.index('function validDateOrNull(')
          b = s.index('\n}\n\nexport class ResourceCatalogService', a) + 2
          s = s[:a] + '''function validDateOrNull(value: unknown): value is string | null | undefined {
            if (value === undefined || value === null) return true;
            if (typeof value !== "string") return false;
            try { parseDateOnly(value, "allocationDate"); return true; } catch { return false; }
          }''' + s[b:]
          p.write_text(s)

          # Summary/Milestone resource references do not participate in workload or unset warnings.
          p = Path('src/server/resources/resource-workload-service-core.ts')
          s = p.read_text()
          old = 'if (!task || !resource) continue;\n      const effectiveStart'
          if old not in s: raise SystemExit('workload task anchor missing')
          s = s.replace(old, 'if (!task || !resource || task.type !== "task") continue;\n      const effectiveStart', 1)
          s = s.replace('const configured = assignment.allocationPercent !== null && task.type === "task";', 'const configured = assignment.allocationPercent !== null;', 1)
          p.write_text(s)

          # Canonical Project snapshots keep allocation data; task reschedules cannot invalidate explicit allocation bounds.
          p = Path('src/server/projects/task-field-project-service.ts')
          s = p.read_text()
          marker = 'import {\n  ProjectService,\n  type AuthorizedEditSession,'
          if '  InvalidTaskInputError,\n  ProjectService,' not in s:
              if marker not in s: raise SystemExit('TaskField import anchor missing')
              s = s.replace(marker, 'import {\n  InvalidTaskInputError,\n  ProjectService,\n  type AuthorizedEditSession,', 1)
          fn_start = s.index('function assignmentDtos(')
          fn_end = s.index('\n}\n\n/**', fn_start) + 2
          s = s[:fn_start] + '''function assignmentDtos(repository: ResourceCatalogRepository, projectId: number): ProjectAssignmentDto[] {
            return repository.listAssignments(projectId).map((assignment) => ({
              id: assignment.publicId,
              taskId: assignment.taskPublicId,
              target: { kind: assignment.kind, id: assignment.targetPublicId },
              allocation: assignment.kind === "resource"
                ? { start: assignment.assignmentStart, end: assignment.assignmentEnd, percent: assignment.allocationPercent }
                : null,
            }));
          }''' + s[fn_end:]
          update_anchor = '      const response = super.updateTask(authorization, expectedRevision, taskPublicId, input);\n'
          if 'const invalidAllocation = this.resourcesForFields.listAssignments' not in s:
              if update_anchor not in s: raise SystemExit('TaskField update anchor missing')
              addition = '''      const updatedSchedule = this.schedulesForFields.findTaskByPublicId(authorization.projectId, taskPublicId);
              if (!updatedSchedule) throw new Error("Updated task schedule could not be read back.");
              if (updatedSchedule.type === "task") {
                const invalidAllocation = this.resourcesForFields.listAssignments(authorization.projectId).some((assignment) =>
                  assignment.kind === "resource" && assignment.taskPublicId === taskPublicId &&
                  ((assignment.assignmentStart !== null && (assignment.assignmentStart < updatedSchedule.startDate || assignment.assignmentStart > updatedSchedule.endDate)) ||
                    (assignment.assignmentEnd !== null && (assignment.assignmentEnd < updatedSchedule.startDate || assignment.assignmentEnd > updatedSchedule.endDate))),
                );
                if (invalidAllocation) throw new InvalidTaskInputError();
              }
          '''
              s = s.replace(update_anchor, update_anchor + addition, 1)
          p.write_text(s)

          # Forward M/M conversion policy through canonical Compose deployments.
          p = Path('deploy/compose.yml')
          s = p.read_text()
          if 'RESOURCE_MD_PER_MM:' not in s:
              marker = '      LOG_LEVEL: ${LOG_LEVEL:-info}\n'
              if marker not in s: raise SystemExit('compose env anchor missing')
              s = s.replace(marker, marker + '      # 조직의 1 M/M 환산 근무일 수. 빈 값이면 M/M 조회를 비활성화한다.\n      RESOURCE_MD_PER_MM: "${RESOURCE_MD_PER_MM:-}"\n', 1)
          p.write_text(s)

          # Database schema source of truth for migration 0005.
          p = Path('docs/DB_SCHEMA.md')
          s = p.read_text()
          intro = 'Issue #54에서 Project 표시용 Owner를 위한 `0004_project_owner.sql`을 추가했다.'
          if 'Issue #56에서 Resource 계획 투입 기간/투입률' not in s:
              s = s.replace(intro, intro + ' Issue #56에서 Resource 계획 투입 기간/투입률과 workload 조회 index를 위한 `0005_resource_workload.sql`을 추가했다.', 1)
          assignment = 'Task/Summary/Milestone과 글로벌 Resource 또는 Group의 직접 할당을 저장한다. `(project_id, task_id)` composite FK로 Project 경계를 DB에서도 강제하고, `resource_id`와 `group_id`는 XOR CHECK로 정확히 하나만 허용한다. 부분 UNIQUE index로 같은 Task에 같은 Resource/Group의 중복 할당을 차단한다. Task/Project 삭제에는 assignment가 cascade되지만 글로벌 catalog FK는 `ON DELETE RESTRICT`다. Group assignment는 팀 참조이며 Group member 개인 assignment로 자동 확장하지 않는다.'
          if '`0005_resource_workload.sql`은 기존 row 호환' not in s:
              s = s.replace(assignment, assignment + '\n\n`0005_resource_workload.sql`은 기존 row 호환을 위해 Resource assignment의 `assignment_start`, `assignment_end`, `allocation_percent`를 nullable로 추가한다. 두 날짜는 `YYYY-MM-DD` 길이 제약을 DB에서 두고 실제 Gregorian 날짜 검증은 Scheduling Domain의 `parseDateOnly`가 담당한다. `allocation_percent`는 NULL 또는 `0 < value <= 100`만 허용한다. 기존 NULL allocation은 100%로 추정하지 않고 `공수 미설정`으로 취급한다. Group assignment에는 이 세 필드를 사용하지 않는다. 명시 Resource allocation 기간은 leaf Task의 확정 `start_date/end_date` 안에 있어야 하며 Task 일정 변경도 같은 invariant를 다시 검증해 위반 시 transaction 전체를 rollback한다.', 1)
          idx = 'task_assignments(resource_id) WHERE resource_id IS NOT NULL\n'
          widx = 'task_assignments(project_id, resource_id, assignment_start, assignment_end) WHERE resource_id IS NOT NULL\n'
          if widx not in s:
              if idx not in s: raise SystemExit('DB index anchor missing')
              s = s.replace(idx, idx + widx, 1)
          p.write_text(s)
          PY

          git rm .github/workflows/issue-56-review-fixes.yml .github/workflows/issue-56-review-fixes-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/resources/resource-catalog-service-core.ts src/server/resources/resource-workload-service-core.ts src/server/projects/task-field-project-service.ts deploy/compose.yml docs/DB_SCHEMA.md
          git commit -m "fix: Issue #56 리뷰 결함 수정"
          git push origin HEAD:feat/issue-56-resource-workload
