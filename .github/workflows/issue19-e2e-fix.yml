name: Issue 19 E2E Fix

on:
  push:
    branches: [feat/issue-19-resource-catalog]
    paths:
      - .github/workflows/issue19-e2e-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Update E2E expectations and assignment fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          notifications = Path('tests/e2e/project-notifications.spec.ts')
          text = notifications.read_text(encoding='utf-8')
          old = '''    const projectLink = navigation.getByRole("link", { name: "프로젝트", exact: true });\n    const demoLink = navigation.getByRole("link", { name: "Gantt 데모", exact: true });'''
          new = '''    const projectLink = navigation.getByRole("link", { name: "프로젝트", exact: true });\n    const resourceLink = navigation.getByRole("link", { name: "리소스", exact: true });\n    const demoLink = navigation.getByRole("link", { name: "Gantt 데모", exact: true });'''
          if old not in text:
              raise SystemExit('navigation link anchor not found')
          text = text.replace(old, new, 1)
          old = '''    await expect(navigationLinks).toHaveCount(1);\n    await expect(projectLink).toBeVisible();\n    await expect(demoLink).toHaveCount(0);'''
          new = '''    await expect(navigationLinks).toHaveCount(2);\n    await expect(projectLink).toBeVisible();\n    await expect(resourceLink).toBeVisible();\n    await expect(demoLink).toHaveCount(0);'''
          if old not in text:
              raise SystemExit('navigation count anchor not found')
          notifications.write_text(text.replace(old, new, 1), encoding='utf-8')

          editor = Path('tests/e2e/project-task-editor.spec.ts')
          text = editor.read_text(encoding='utf-8')
          anchor = '''    if (path === `${apiPath}/edit-sessions/current` && request.method() === "GET") {\n      await route.fulfill({ json: { data: fixture.editable ? { permission: "edit", expiresAt: "2099-01-01T00:00:00Z" } : { permission: "readonly" } } });\n      return;\n    }\n'''
          replacement = anchor + '''    if (path === `${apiPath}/assigned-targets` && request.method() === "GET") {\n      await route.fulfill({ json: { data: { projectRevision: fixture.project.revision, catalogRevision: 1, assignments: [], targets: [] } } });\n      return;\n    }\n    if (path === `${apiPath}/assignment-targets` && request.method() === "GET") {\n      await route.fulfill({ json: { data: { catalogRevision: 1, targets: [] } } });\n      return;\n    }\n'''
          if anchor not in text:
              raise SystemExit('task editor fixture anchor not found')
          editor.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          rm .github/workflows/issue19-e2e-fix.yml
      - name: Commit E2E maintenance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(e2e): Issue 19 메뉴와 assignment fixture 반영 (#19)"
          git push origin HEAD:feat/issue-19-resource-catalog
