name: Issue #33 변경 적용

on:
  push:
    branches:
      - fix/issue-33-remove-gantt-demo-nav

permissions:
  contents: write

jobs:
  apply:
    name: Gantt 데모 메뉴 제거와 버전 동기화
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/issue-33-remove-gantt-demo-nav
          fetch-depth: 0
      - name: Node.js 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Issue #33 소스·테스트·문서 반영
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/components/workspace-shell.tsx",
              '''            <Link className="nav-link" href="/gantt-demo">\n              Gantt 데모\n            </Link>\n''',
              "",
          )

          replace_once(
              "tests/e2e/project-notifications.spec.ts",
              '''    const demoLink = navigation.getByRole("link", { name: "Gantt 데모", exact: true });\n    const brand = page.getByRole("link", { name: "masterGantt 홈", exact: true });''',
              '''    const projectLink = navigation.getByRole("link", { name: "프로젝트", exact: true });\n    const demoLink = navigation.getByRole("link", { name: "Gantt 데모", exact: true });\n    const brand = page.getByRole("link", { name: "masterGantt 홈", exact: true });''',
          )
          replace_once(
              "tests/e2e/project-notifications.spec.ts",
              '''    await expect(navigationLinks).toHaveCount(2);\n    await expect(demoLink).toBeVisible();''',
              '''    await expect(navigationLinks).toHaveCount(1);\n    await expect(projectLink).toBeVisible();\n    await expect(demoLink).toHaveCount(0);''',
          )
          replace_once(
              "tests/e2e/project-notifications.spec.ts",
              "    const centerIsLink = await demoLink.evaluate((element) => {",
              "    const centerIsLink = await projectLink.evaluate((element) => {",
          )
          replace_once(
              "tests/e2e/project-notifications.spec.ts",
              '''    await demoLink.click();\n    await expect(page).toHaveURL(/\\/gantt-demo$/);\n    await expect(page.getByRole("heading", { name: "Gantt 최소 통합", exact: true })).toBeVisible();\n    await brand.click();\n    await expect(page).toHaveURL(/\\/$/);''',
              '''    await projectLink.click();\n    await expect(page).toHaveURL(/\\/$/);''',
          )

          replace_once(
              "README.md",
              "Reparent/FS 및 Summary 직접 일정 편집은 후속이며 `/gantt-demo`는 저장 없는 fixture다.",
              "Reparent/FS 및 Summary 직접 일정 편집은 후속이다. `/gantt-demo`는 저장 없는 CI/개발 검증용 fixture로 유지하지만 운영 상단 주요 메뉴에는 노출하지 않는다.",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## [Unreleased]\n"
          if "## [0.8.1]" in text:
              raise SystemExit("CHANGELOG already contains 0.8.1")
          if text.count(marker) != 1:
              raise SystemExit("CHANGELOG Unreleased marker mismatch")
          entry = '''## [0.8.1] - 2026-09-15\n\n### Fixed\n\n- Issue #33: 운영 상단 주요 메뉴에서 `Gantt 데모` 링크를 제거한다. `/gantt-demo` route와 fixture는 SVAR 통합·timezone/hydration E2E 검증 자산으로 유지하고, 헤더 회귀 테스트는 프로젝트 메뉴와 알림 hit-area 및 데모 링크 미노출을 검증한다.\n\n'''
          changelog.write_text(text.replace(marker, marker + "\n" + entry, 1), encoding="utf-8")

          Path("docs/ISSUE_33_REVIEW.md").write_text('''# Issue #33 분석·설계·검증 기록\n\n## 목적\n\n운영 화면 우측 상단의 `Gantt 데모` 항목을 제거하되 기존 프로젝트/Gantt 기능과 헤더 navigation, 알림 UI에 회귀가 없도록 한다.\n\n## 기준과 분석\n\n- 기준 `main`: `1415ad24718fe679ab9464292263cb6a45f25ed9`, application `0.8.0`.\n- `src/components/workspace-shell.tsx`가 주요 메뉴에 `/`의 `프로젝트`와 `/gantt-demo`의 `Gantt 데모`를 노출한다. 해당 데모 링크에는 별도 이벤트 핸들러가 없다.\n- `/gantt-demo` route와 `src/features/gantt/gantt-demo.tsx`는 단순 운영 기능이 아니라 `tests/e2e/gantt-demo.spec.ts`의 SVAR browser integration 및 server/browser timezone·hydration 검증 fixture로 사용된다. 따라서 route/fixture 삭제는 Issue #33의 UI 정리보다 검증 범위를 불필요하게 축소한다.\n- `tests/e2e/project-notifications.spec.ts`의 10개 viewport 헤더 회귀는 현재 `Gantt 데모` 링크 존재 및 클릭을 전제로 한다. 메뉴 제거와 함께 기대값을 프로젝트 메뉴 1개, 데모 링크 0개로 변경해야 한다.\n\n## 구현 결정\n\n1. `WorkspaceShell`에서 `Gantt 데모` navigation link만 제거한다.\n2. `/gantt-demo` route, SVAR fixture, 전용 E2E는 내부 검증 자산으로 유지한다. 운영 navigation에서 접근 경로만 제거한다.\n3. 기존 320/360/361/375/390/400/401/414/768/1440px 헤더 E2E는 프로젝트 링크·브랜드·알림 버튼의 hit area가 겹치지 않고 `Gantt 데모` 링크가 존재하지 않는지 검증한다.\n4. API, DB, scheduling contract, SVAR package에는 변경을 만들지 않는다.\n\n## 버저닝\n\n현재 `0.8.0`에서 **`0.8.1` PATCH**로 증가한다. 신규 기능/API 추가가 아니라 운영 UI에 잘못 노출된 데모 진입점을 제거하는 호환성 유지 수정으로 판단한다. `package.json`과 `package-lock.json`은 같은 버전을 사용한다.\n\n## 검증 계획\n\n- release version consistency\n- TypeScript typecheck / ESLint / 전체 Vitest / npm audit / Markdown link / production build\n- Chromium 전체 E2E: 특히 헤더 10개 viewport와 기존 `/gantt-demo` fixture E2E가 함께 통과해야 한다.\n- Docker build/runtime/SQLite persistence 및 production HTTP·HTTPS transport 회귀\n- PR head의 GitHub Actions 결과를 공식 완료 근거로 사용한다. 실행 전 상태는 **NOT TESTED**다.\n\n## 범위 밖\n\n- `/gantt-demo` route 자체 삭제\n- SVAR fixture 제거 또는 테스트 축소\n- 다른 헤더 메뉴의 재설계\n- Gantt 기능/API/일정 엔진 변경\n\n## 결과\n\nPR 및 GitHub Actions 결과는 최종 head 검증 후 이 문서에 갱신한다.\n''', encoding="utf-8")

          Path("docs/exec-plans/active/ISSUE_33_PLAN.md").write_text('''# Issue #33 실행 계획\n\n기준 main은 `1415ad24718fe679ab9464292263cb6a45f25ed9`, 작업 branch는 `fix/issue-33-remove-gantt-demo-nav`다.\n\n1. **분석** — 주요 navigation과 `/gantt-demo` 사용처를 확인한다. 검증 fixture로 사용되는 route는 보존한다.\n2. **구현** — `WorkspaceShell`에서 `Gantt 데모` 링크를 제거한다. 별도 이벤트/handler는 없으므로 추가 삭제는 하지 않는다.\n3. **회귀 테스트** — 기존 responsive header E2E를 프로젝트 메뉴 1개와 데모 미노출 계약으로 갱신하고 `/gantt-demo` 전용 E2E는 유지한다.\n4. **버전·문서** — SemVer PATCH `0.8.1`, lockfile 동기화, CHANGELOG/README/Issue 검토 기록을 갱신한다.\n5. **원격 검증** — PR을 생성하고 최종 head의 GitHub Actions quality/e2e/docker를 모두 통과시킨다. 실패 시 원인을 수정한 새 head를 다시 검증한다.\n6. **완료 경계** — PR 생성과 CI PASS까지 수행한다. 사용자가 별도로 요청하지 않았으므로 main 병합과 `v0.8.1` 릴리스는 수행하지 않는다.\n\n담당 논리 역할: frontend(헤더/E2E), qa_docs(계약·문서), infra(CI), Manager(통합). 현재 상태: **NOT TESTED**.\n''', encoding="utf-8")
          PY

          npm version 0.8.1 --no-git-tag-version --allow-same-version
          git diff --check

      - name: 변경 커밋 및 push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/workspace-shell.tsx tests/e2e/project-notifications.spec.ts README.md CHANGELOG.md docs/ISSUE_33_REVIEW.md docs/exec-plans/active/ISSUE_33_PLAN.md package.json package-lock.json
          git commit -m "fix: 운영 헤더에서 Gantt 데모 메뉴 제거 (#33)"
          git push origin HEAD:fix/issue-33-remove-gantt-demo-nav
