name: Finalize v0.10.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v0.10.0-release.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-v0.10.0-release
  cancel-in-progress: false

jobs:
  finalize:
    name: Tag, verify release image, publish GitHub Release, cleanup branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: v0.10.0
      TARGET_SHA: 426e4703909563771623de56ec42ca6c292bffde
      FEATURE_BRANCH: feat/issue-34-task-relations
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify release target and version
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          package_version="$(git show "$TARGET_SHA:package.json" | jq -r '.version')"
          lock_version="$(git show "$TARGET_SHA:package-lock.json" | jq -r '.version')"
          test "$package_version" = "0.10.0"
          test "$lock_version" = "0.10.0"
          git cat-file -e "$TARGET_SHA:.github/workflows/release-image.yml"

      - name: Create annotated release tag when absent
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"
            echo "$RELEASE_TAG already exists at the expected target."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG

Issue #34: Task Editor predecessor/successor relation view.
PR #49 merged after CI #169 passed."
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch release image workflow explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-image.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"

      - name: Find dispatched release workflow run
        id: release_run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-image.yml --limit 20 --json databaseId,headSha,event,status --jq "map(select(.headSha == \"$TARGET_SHA\" and .event == \"workflow_dispatch\")) | first | .databaseId // empty")"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Release workflow run: $run_id"

      - name: Wait for release image workflow success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release_run.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Create GitHub Release when absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG GitHub Release already exists."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Issue #34: Grid·Chart·Context Menu의 기존 Task Editor에서 선행·후행 작업 관계를 조회할 수 있도록 개선했습니다. 관계는 작업명, externalId, 유형과 lag를 표시하며 동일 Project revision snapshot만 사용합니다. 버전은 Semantic Versioning minor 증가로 0.10.0입니다. PR #49 및 CI #169 검증을 통과했습니다."
          fi

      - name: Delete completed feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$FEATURE_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$FEATURE_BRANCH"
          else
            echo "$FEATURE_BRANCH already deleted."
          fi

# 이 파일은 릴리스 완료 확인 후 제거한다.
