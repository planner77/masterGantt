name: Finalize v0.10.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v0.10.0-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-v0.10.0-release
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize v0.10.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: v0.10.0
      TARGET_SHA: 426e4703909563771623de56ec42ca6c292bffde
      FEATURE_BRANCH: feat/issue-34-task-relations
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Tag, publish release image, create release, and cleanup branch
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          test "$(git show "$TARGET_SHA:package.json" | jq -r '.version')" = "0.10.0"
          test "$(git show "$TARGET_SHA:package-lock.json" | jq -r '.version')" = "0.10.0"
          git cat-file -e "$TARGET_SHA:.github/workflows/release-image.yml"

          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG - Issue #34 Task Editor relation view"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          existing_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-image.yml --event workflow_dispatch --limit 30 --json databaseId,headSha,status,conclusion --jq ".[] | select(.headSha == \"$TARGET_SHA\" and (.status == \"queued\" or .status == \"in_progress\" or .conclusion == \"success\")) | .databaseId" | head -n 1)"
          if [[ -z "$existing_run" ]]; then
            gh workflow run release-image.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          fi

          release_run=""
          for _ in $(seq 1 60); do
            release_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-image.yml --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n 1)"
            [[ -n "$release_run" ]] && break
            sleep 2
          done
          test -n "$release_run"

          for _ in $(seq 1 120); do
            status="$(gh run view "$release_run" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(gh run view "$release_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
              test "$conclusion" = "success"
              break
            fi
            sleep 10
          done
          test "$(gh run view "$release_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = "success"

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Issue #34: Grid·Chart·Context Menu의 기존 Task Editor에서 선행·후행 작업 관계를 조회할 수 있도록 개선했습니다. 관계는 작업명, externalId, 유형과 lag를 표시하며 동일 Project revision snapshot만 사용합니다. Semantic Versioning minor 증가로 0.10.0을 릴리스합니다. PR #49 및 CI #169 검증을 통과했습니다."
          fi

          if git ls-remote --exit-code --heads origin "$FEATURE_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$FEATURE_BRANCH"
          fi

          echo "v0.10.0 release finalized."
