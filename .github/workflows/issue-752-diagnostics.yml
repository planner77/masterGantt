name: "Issue #752 — 반복 PR 실패 진단"
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('수동 제한 진단 · PR #{0} · Issue #{1}', inputs.pr_number, inputs.issue_number) || format('PR Full 실패 확인 · CI #{0}.{1}', github.event.workflow_run.run_number, github.event.workflow_run.run_attempt) }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "현재 열린 PR 번호"
        type: string
        required: true
      issue_number:
        description: "정규 Primary Issue 번호"
        type: string
        required: true
      expected_head_sha:
        description: "최신 PR Head SHA (소문자 40자리)"
        type: string
        required: true

# Controller runs from default main; no untrusted PR code gets a write token.
permissions:
  contents: read
concurrency:
  group: issue-752-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  observe:
    name: 반복 Full CI 실패 출처 인증 (권고 전용)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      recommended: ${{ steps.check.outputs.recommended }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: 원본 Artifact·Full Job·과거 Run/Attempt 검증
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue_752_diagnostics.py observe --source-run "$SOURCE_RUN_ID" --report-dir issue-752-output
          python3 - <<'PY'
          import json,os
          r=json.load(open("issue-752-output/diagnosis.json",encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("recommended="+str(r.get("status")=="DIAGNOSIS_RECOMMENDED").lower()+"\n")
          PY
      - name: 권고 진단 증거 보존
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-752-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-752-output/diagnosis.*
          retention-days: 14
          if-no-files-found: warn

  observe_notify:
    name: 비차단 진단 권고 댓글 갱신
    needs: [observe]
    if: needs.observe.outputs.recommended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-752-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-752-output
      - name: PR 댓글 중복 방지 갱신 (필수 Gate 변경 없음)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/issue_752_diagnostics.py notify --report issue-752-output/diagnosis.json

  prepare:
    name: 수동 진단 권한·정확한 PR 소스 동결
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      approved: ${{ steps.allow.outputs.approved }}
      head_sha: ${{ steps.allow.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: 실행자·Issue·Head/Base/Test-merge·이력 인증
        id: allow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ inputs.pr_number }}
          TARGET_ISSUE: ${{ inputs.issue_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue_752_diagnostics.py prepare --pr "$TARGET_PR" --issue "$TARGET_ISSUE" --expected-head "$EXPECTED_HEAD" --report-dir issue-752-output
      - name: 차단된 준비 단계도 증거 보존
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-752-plan-${{ github.run_id }}
          path: issue-752-output/plan.json
          retention-days: 14
          if-no-files-found: warn

  bounded_e2e:
    name: 제한 E2E 진단 ${{ matrix.part }} (승인 증거 아님)
    needs: [prepare]
    if: needs.prepare.outputs.approved == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-752-plan-${{ github.run_id }}
          path: control
      - name: 동결된 HEAD와 승인된 SHA 일치 확인
        shell: bash
        env:
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Node/npm 준비 (비신뢰 코드·읽기 전용)
        uses: ./.github/actions/node-setup
        with:
          node-version: "22"
          use-local-node-headers: "true"
      - name: Playwright Chromium 준비
        uses: ./.github/actions/playwright-setup
      - name: 누적 실패 집합 실행 (재시도·조기 중단 없음)
        shell: bash
        env:
          PART: ${{ matrix.part }}
          SOURCE_HEAD: ${{ needs.prepare.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          CI_E2E_FULLY_PARALLEL: "true"
        run: |
          set -euo pipefail
          mkdir -p "part-$PART"
          mapfile -t files < <(python3 - <<'PY'
          import json,os
          p=json.load(open("control/plan.json",encoding="utf-8"))
          for path in p["parts"][int(os.environ["PART"])]:
              print(path)
          PY
          )
          if (( ${#files[@]} == 0 )); then
            echo "할당된 테스트가 없는 파트: NOT RUN."
            exit 0
          fi
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/issue-752-raw-$PART.json"
          set +e
          npm run test:e2e -- "${files[@]}" --project=chromium --workers=1 --retries=0 --max-failures=0 --reporter=json
          code=$?
          set -e
          # Worker artifacts are public to Actions readers: rewrite the JSON to a
          # strict allowlist BEFORE upload (no errors, network details, traces).
          # Playwright JSON reporter may use testDir-relative spec paths.
          # Sanitize errors/traces/URLs before any public Actions artifact upload.
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          n=int(os.environ["PART"])
          allowed=set(json.load(open("control/plan.json",encoding="utf-8"))["parts"][n])
          path=Path(f"part-{n}/playwright.json")
          raw=Path(os.environ["PLAYWRIGHT_JSON_OUTPUT_FILE"])
          def normalize(value):
              if not isinstance(value,str) or not value or len(value)>1000:
                  return None
              file=value.replace("\\","/")
              if file.startswith("./"):
                  file=file[2:]
              if "/tests/e2e/" in file:
                  file="tests/e2e/"+file.rsplit("/tests/e2e/",1)[1]
              elif not file.startswith("tests/e2e/"):
                  if file.startswith("/") or (len(file)>1 and file[1]==":"):
                      return None
                  file="tests/e2e/"+file
              if (not re.fullmatch(r"tests/e2e/[A-Za-z0-9_./-]+\.spec\.ts",file)
                  or "//" in file or "/../" in file or "/./" in file):
                  return None
              return file if file in allowed else None
          if raw.exists() and raw.stat().st_size<=6_000_000:
              try:
                  source=json.loads(raw.read_text(encoding="utf-8"))
                  suites=[]
                  def walk(node,inherited=None):
                      file=normalize(node.get("file")) or inherited
                      for spec in node.get("specs",[]):
                          if not isinstance(spec,dict):
                              continue
                          spec_file=normalize(spec.get("file")) or file
                          if spec_file not in allowed:
                              continue
                          tests=[]
                          for test in spec.get("tests",[]):
                              if not isinstance(test,dict):
                                  continue
                              results=[]
                              for item in test.get("results",[]):
                                  if not isinstance(item,dict):
                                      continue
                                  duration=item.get("duration")
                                  duration=duration if type(duration) in (int,float) and 0<=duration<=7200000 else None
                                  status=item.get("status")
                                  status=status if status in ("passed","failed","skipped","timedOut","interrupted") else "UNKNOWN"
                                  results.append({"status":status,"duration":duration})
                              tid=re.sub(r"[^A-Za-z0-9._:-]","_",str(test.get("id") or ""))[:90]
                              tests.append({"id":tid,"results":results})
                          if tests:
                              suites.append({"file":spec_file,"specs":[{"tests":tests}]})
                      for child in node.get("suites",[]):
                          if isinstance(child,dict):
                              walk(child,file)
                  for suite in source.get("suites",[]):
                      if isinstance(suite,dict):
                          walk(suite)
                  path.write_text(json.dumps({"suites":suites},ensure_ascii=False),encoding="utf-8")
              except (ValueError,TypeError,KeyError,OSError,AttributeError,IndexError):
                  path.unlink(missing_ok=True)
          elif path.exists():
              path.unlink()
          raw.unlink(missing_ok=True)
          PY
          python3 - "$code" <<'PY'
          import json,os,sys
          n=int(os.environ["PART"])
          p=json.load(open("control/plan.json",encoding="utf-8"))
          data={"schemaVersion":1,"part":n,"files":sorted(p["parts"][n]),
                "headSha":os.environ["SOURCE_HEAD"],
                "diagnosisRunId":int(os.environ["RUN_ID"]),"exitCode":int(sys.argv[1])}
          with open(f"part-{n}/execution.json","w",encoding="utf-8") as f:
              json.dump(data,f)
          PY
          if (( code != 0 && code != 1 )); then
            echo "Playwright Runner/준비 오류: INCOMPLETE."
            exit 1
          fi
      - name: 진단 Runner 산출물 보존 (Git 기록 금지)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-752-part-${{ matrix.part }}
          path: part-${{ matrix.part }}/
          retention-days: 14
          if-no-files-found: warn

  finish:
    name: 실행 간 진단 결과 정제 및 JSON/Markdown 작성
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [prepare, bounded_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: 원본 동결 계획 다운로드 (존재 시)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-752-plan-${{ github.run_id }}
          path: control
      - name: 제한 진단 Worker 산출물 다운로드 (존재 시)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: issue-752-part-*
          path: issue-752-output
          merge-multiple: false
      - name: Worker 누락·불일치 결과를 INCOMPLETE 처리
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issue-752-output
          for n in 0 1 2 3; do
            if [[ -d "issue-752-output/issue-752-part-$n" ]]; then
              mv "issue-752-output/issue-752-part-$n" "issue-752-output/part-$n"
            fi
          done
          if [[ -s control/plan.json ]]; then
            python3 scripts/issue_752_diagnostics.py finalize --plan control/plan.json --report-dir issue-752-output
          else
            echo '{"schemaVersion":1,"status":"BLOCKED","missing":["PLAN_NOT_AVAILABLE"]}' > issue-752-output/diagnosis.json
            echo 'BLOCKED: 원본 계획 누락, 승인 또는 진단 실행 근거 없음.' > issue-752-output/diagnosis.md
            exit 1
          fi
      - name: 정제 보고서 14일 보존 (불완전 포함)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-752-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            issue-752-output/diagnosis.json
            issue-752-output/diagnosis.md
          retention-days: 14
          if-no-files-found: warn

  finish_notify:
    name: 필수 검사 변경 없이 PR 진단 상태 갱신
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [prepare, finish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: 정제 보고서 조회 (존재 시)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-752-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-752-output
      - name: 신뢰된 보고서 확인 시에만 댓글 작성
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -s issue-752-output/diagnosis.json ]]; then
            python3 scripts/issue_752_diagnostics.py notify --report issue-752-output/diagnosis.json
          else
            echo "REPORT_MISSING: DIAGNOSIS_READY 판정 금지." >> "$GITHUB_STEP_SUMMARY"
          fi
