name: 이슈 8 정합성 일회성 보완
on:
  push:
    branches: [feat/issue-8-internal-http]
    paths: [.github/workflows/issue8-finalize-once.yml]
permissions: {}
concurrency:
  group: issue8-finalize-once
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'planner77/masterGantt' && github.ref == 'refs/heads/feat/issue-8-internal-http'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: feat/issue-8-internal-http
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: 기존 검사와 설명을 새 설정 계약에 맞춤
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              if required: assert old in s, (path,old)
              p.write_text(s.replace(old,new))
          edit('tests/server/projects/edit-authorization-handlers.test.ts', '{ service: api, environment: "production", requestId: () => "request-id" }', '{ ...common, service: api }')
          edit('.env.example', '아래 세 값은 아직 사용하지 않습니다.', '아래 두 값은 아직 사용하지 않습니다.')
          edit('.env.example', '# 운영 환경에서는 APP_BASE_URL에 HTTPS 주소를, DATABASE_PATH에 /data 하위의 정규화된 경로를 지정해야 합니다.', '# 운영 환경은 기본 HTTPS입니다. 명시적 ALLOW_INSECURE_HTTP=true일 때만 HTTP를 허용합니다.\n# DATABASE_PATH는 운영에서 /data 하위의 정규화된 경로여야 합니다.')
          edit('docs/SECURITY.md', '- 전송은 HTTPS만 사용', '- 전송은 기본 HTTPS를 사용한다. Issue #8의 명시적 내부망 HTTP opt-in에서는 평문 전송 위험을 별도로 수용해야 한다.')
          edit('docs/SECURITY.md', 'Local HTTP 개발은 별도 비-prefix name을 사용하되 production에서 `Secure` 누락을 허용하지 않는다.', 'Local HTTP 개발과 명시적으로 허용한 production HTTP는 `mastergantt_edit`를 사용한다. HTTPS production에서는 `Secure`와 `__Host-` 이름을 항상 유지한다.')
          edit('docs/SECURITY.md', 'Local HTTP는 `mastergantt_edit` 이름과 Secure 없음으로 분리한다.', 'HTTP는 개발/명시적 production opt-in에서 `mastergantt_edit` 이름과 Secure 없음으로 분리한다.')
          edit('docs/DEPLOYMENT.md', '- Reverse proxy는 TLS 종료, public hostname 전달, HTTP→HTTPS redirect를 담당한다.', '- Reverse proxy는 public hostname과 원본 요청을 전달한다. HTTPS 구성에서는 TLS 종료와 HTTP→HTTPS redirect를 적용하고, 명시적 HTTP 구성에서는 인증서·HTTPS redirect를 요구하지 않는다.')
          edit('docs/DEPLOYMENT.md', '| `APP_BASE_URL` | 예 | canonical public `https` origin; trailing slash/path/query/fragment/userinfo 금지 |', '| `APP_BASE_URL` | 예 | canonical 외부 origin. 기본 HTTPS; ALLOW_INSECURE_HTTP=true일 때 HTTP 허용. trailing slash/path/query/fragment/userinfo 금지 |\n| `ALLOW_INSECURE_HTTP` | 선택 | 미설정/false는 HTTPS-only, true만 HTTP 허용. 빈 값/기타 리터럴은 설정 오류 |')
          edit('docs/DEPLOYMENT.md', '| `SESSION_COOKIE_SECURE` | 예약 | 현재 미사용. Cookie Secure는 `NODE_ENV`와 `APP_BASE_URL`에서 강제 |\n', '')
          edit('docs/DEPLOYMENT.md', 'protocol은 정확히 `https:`,', 'protocol은 기본 `https:`이며 명시적 `ALLOW_INSECURE_HTTP=true`에서만 `http:`도 허용한다. 나머지 검증에서')
          edit('docs/DEPLOYMENT.md', 'port는 HTTPS default 또는 승인한 명시 port만 허용하며', 'port는 선택한 HTTP/HTTPS scheme의 default 또는 승인한 명시 port만 허용하며')
          edit('README.md', '앱이 발행하는 `__Host-mastergantt_edit`의', 'HTTPS production에서 앱이 발행하는 `__Host-mastergantt_edit`의', False)
          PY
          git diff --check
          npm ci
          npm run typecheck
          npm test
          node scripts/check-markdown-links.mjs
      - name: 검증한 일반 파일을 전용 브랜치에 반영
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/server/projects/edit-authorization-handlers.test.ts .env.example docs/SECURITY.md docs/DEPLOYMENT.md README.md
          git commit -m 'fix: 세션 조회 테스트 설정과 HTTP·HTTPS 운영 문구 정합성 보완'
          python3 - <<'PY'
          import base64,os,subprocess
          env=os.environ.copy()
          env['GIT_TERMINAL_PROMPT']='0'
          env['GIT_CONFIG_COUNT']='1'
          env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          r=subprocess.run(['git','push','origin','HEAD:refs/heads/feat/issue-8-internal-http'],env=env,capture_output=True,timeout=60)
          if r.returncode: raise SystemExit('전용 브랜치 반영 실패. force/권한 확대 없음.')
          print('타입 검사·전체 단위 테스트와 문서 검사 후 정합성 변경 반영 완료. PR 전체 CI는 별도 검증.')
          PY
