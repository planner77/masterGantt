name: Issue #282 자동 release finalize

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-282-finalizer.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release_finalize:
    name: v0.53.3 정식 릴리스 및 Issue #282 종료
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FEATURE_PR: "292"
      FINALIZER_BRANCH: ops/issue-282-finalize
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: v0.53.3 정식 릴리스 실행
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue_lifecycle.py release \
            --issue 282 \
            --pr "$FEATURE_PR" \
            --release-required true \
            --release-authorized true \
            --expected-version 0.53.3 \
            --authorization-note "사용자가 2026-09-29에 Issue #283에서 사용한 자동 release finalize workflow를 Issue #282에도 실행하도록 명시 요청."

      - name: Finalizer 브랜치 안전 정리
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          finalizer_pr="$(
            gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&head=$owner:$FINALIZER_BRANCH&per_page=20" |
              jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)] | last | .number // empty'
          )"
          test -n "$finalizer_pr"
          python3 scripts/safe_branch_cleanup.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$finalizer_pr" \
            --branch "$FINALIZER_BRANCH" \
            --target-sha "$GITHUB_SHA" \
            --delete

      - name: Feature 브랜치 정리 및 Issue #282 종료
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue_lifecycle.py finalize \
            --issue 282 \
            --pr "$FEATURE_PR" \
            --release-required true \
            --release-authorized true \
            --expected-version 0.53.3 \
            --authorization-note "사용자가 2026-09-29에 Issue #283에서 사용한 자동 release finalize workflow를 Issue #282에도 실행하도록 명시 요청."
