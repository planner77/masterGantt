name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR CI {0} · {1} · PR #{2} · Run #{3}.{4}', github.event.action == 'edited' && '[메타데이터 검증]' || '[전체 검증]', github.event.pull_request.title, github.event.pull_request.number, github.run_number, github.run_attempt) || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Issue #') && !contains(toJSON(github.event.head_commit.message), '\n') && !contains(toJSON(github.event.head_commit.message), '\r') && format('Main CI · {0} · Run #{1}.{2}', github.event.head_commit.message, github.run_number, github.run_attempt) || github.event_name == 'push' && format('Main CI · 기존 병합/직접 Push · {0} · Run #{1}.{2}', github.sha, github.run_number, github.run_attempt) || inputs.issue_number != '' && format('수동 CI · Issue #{0} · {1} · Run #{2}.{3}', inputs.issue_number, github.ref_name, github.run_number, github.run_attempt) || format('수동 CI · {0} · Run #{1}.{2}', github.ref_name, github.run_number, github.run_attempt) }}

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "관련 Primary Issue 번호(선택; 진단 실행은 비워 둘 수 있음)"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # 새 PR head가 올라오면 이전 실행을 즉시 취소해 runner 낭비를 줄인다.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.action == 'edited' && 'metadata' || 'full') || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: 변경 경로 판정
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ github.event_name == 'workflow_dispatch' || (github.event.action != 'edited' && steps.filter.outputs.node == 'true') }}
      policy: ${{ github.event_name == 'workflow_dispatch' || (github.event.action != 'edited' && steps.filter.outputs.policy == 'true') }}
      e2e: ${{ github.event_name == 'workflow_dispatch' || (github.event.action != 'edited' && steps.filter.outputs.e2e == 'true') }}
      docker: ${{ github.event_name == 'workflow_dispatch' || (github.event.action != 'edited' && steps.filter.outputs.docker == 'true') }}
      docker_baseline: ${{ github.event_name == 'pull_request' && steps.filter.outputs.docker_baseline == 'true' }}
      transport: ${{ github.event_name != 'pull_request' || steps.filter.outputs.transport == 'true' }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      version_changed: ${{ steps.release_candidate.outputs.changed || 'false' }}
      current_version: ${{ steps.release_candidate.outputs.current_version }}
      metadata_only: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' }}
    steps:
      # actions/checkout v7.0.1
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"

      - name: CI 실행 추적 메타데이터 검증
        run: python3 scripts/verify-ci-run-trace.py

      # dorny/paths-filter v4.0.3
      # workflow-level paths는 required check를 Pending으로 남길 수 있어 사용하지 않는다.
      - name: 무거운 CI 대상 경로 판정
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          token: ${{ github.token }}
          filters: |
            node:
              - 'src/**'
              - 'public/**'
              - 'db/**'
              - 'scripts/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'next.config.*'
              - 'eslint.config.*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            policy:
              # 정책 검증의 실제 입력. application code뿐 아니라 문서·workflow·검증 script 변경도 포함한다.
              - 'src/**'
              - 'public/**'
              - 'db/**'
              - 'scripts/**'
              - 'tests/**'
              - 'deploy/**'
              - 'docs/**'
              - '*.md'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'next.config.*'
              - 'eslint.config.*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - '.dockerignore'
              - '.github/workflows/**'
              - '.github/actions/**'
            e2e:
              - 'src/**'
              - 'public/**'
              - 'db/**'
              - 'tests/e2e/**'
              - 'tests/config/playwright.config.ts'
              - 'tests/config/e2e-shard-plan.json'
              - 'scripts/e2e-shard-planner.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            docker:
              - 'src/**'
              - 'public/**'
              - 'db/**'
              - 'scripts/**'
              - 'deploy/**'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            docker_baseline:
              # Standalone migration hard gate는 완료됐다. 후속 PR의 baseline 비교는
              # image/runtime 구조 변경에만 실행해 일반 기능 PR의 이중 build를 피한다.
              - 'deploy/docker/**'
              - '.dockerignore'
              - 'next.config.*'
              - 'scripts/prepare-standalone-runtime.mjs'
              - 'scripts/verify-image-policy.sh'
              - 'scripts/verify-image-size-reduction.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            transport:
              # PR에서는 Origin/cookie/auth/reverse-proxy 계약에 영향을 주는 변경에만
              # browser transport smoke를 실행한다. main/manual은 output에서 항상 true다.
              - 'deploy/**'
              - 'scripts/verify-transport-smoke.sh'
              - 'tests/transport/**'
              - 'tests/config/transport.config.ts'
              - 'src/server/security/**'
              - 'src/server/http/**'
              - 'src/server/projects/**'
              - 'src/app/api/projects/**'
              - 'src/app/api/resource-catalog/**'
              - 'src/app/api/logistics-catalog/**'
              - 'src/app/api/project-master/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

      - name: main docs-only 변경 판정
        id: classify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -d '' -t changed_files < <(git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA")
          if (( ${#changed_files[@]} == 0 )); then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          for path in "${changed_files[@]}"; do
            if [[ "$path" == docs/* || ( "$path" != */* && "$path" == *.md ) ]]; then
              continue
            fi
            docs_only=false
            break
          done
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: main release candidate version 판정
        id: release_candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "이전 main SHA가 없어 release candidate version 비교를 신뢰할 수 없습니다." >&2
            exit 1
          fi
          previous_version="$(git show "$BEFORE_SHA:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          changed=false
          if [[ "$current_version" != "$previous_version" ]]; then
            changed=true
          fi
          {
            echo "changed=$changed"
            echo "current_version=$current_version"
            echo "previous_version=$previous_version"
          } >> "$GITHUB_OUTPUT"

      - name: 변경 경로 요약
        shell: bash
        env:
          NODE_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.node == 'true' }}
          POLICY_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.policy == 'true' }}
          E2E_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.e2e == 'true' }}
          DOCKER_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
          DOCKER_BASELINE: ${{ github.event_name == 'pull_request' && steps.filter.outputs.docker_baseline == 'true' }}
          TRANSPORT: ${{ github.event_name != 'pull_request' || steps.filter.outputs.transport == 'true' }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only || 'N/A' }}
          VERSION_CHANGED: ${{ steps.release_candidate.outputs.changed || 'N/A' }}
          CURRENT_VERSION: ${{ steps.release_candidate.outputs.current_version || 'N/A' }}
        run: |
          {
            echo "## CI change routing"
            echo
            printf -- '- node: `%s`\n' "$NODE_CHANGED"
            printf -- '- policy: `%s`\n' "$POLICY_CHANGED"
            printf -- '- e2e: `%s`\n' "$E2E_CHANGED"
            printf -- '- docker: `%s`\n' "$DOCKER_CHANGED"
            printf -- '- docker_baseline(PR): `%s`\n' "$DOCKER_BASELINE"
            printf -- '- transport(PR selective, main/manual full): `%s`\n' "$TRANSPORT"
            printf -- '- docs_only(main): `%s`\n' "$DOCS_ONLY"
            printf -- '- version_changed(main): `%s`\n' "$VERSION_CHANGED"
            printf -- '- current_version(main): `%s`\n' "$CURRENT_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"


  metadata_evidence:
    name: PR metadata가 기존 전체 CI 증거를 보존하는지 검증
    if: github.event_name == 'pull_request' && github.event.action == 'edited'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # changes와 metadata_evidence는 별도 Runner: 명시적으로 작업 브랜치 checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 현재 PR Head 및 동일 SHA 전체 CI 증거 즉시 판정
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: python3 scripts/verify-pr-metadata-evidence.py --mode evidence

  policy:
    name: 정책·저장소 계약 검사
    if: needs.changes.outputs.policy == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      # ~/.npm download cache만 재사용한다. npm ci는 node_modules를 매번 재구성한다.
      - run: node scripts/verify-release-version.mjs
      - name: 루트·외부 cwd 테스트 탐색 계약 검증
        run: node scripts/verify-test-discovery.mjs
      - name: production dependency audit
        run: npm audit --omit=dev
      - run: node scripts/check-markdown-links.mjs
      - name: 작업 브랜치 cleanup 안전 정책 검증
        run: python3 scripts/verify-safe-branch-cleanup.py
      - name: 범용 Issue Lifecycle 계약·시나리오 검증
        run: python3 scripts/verify-issue-lifecycle.py
      - name: PR metadata 증거 판정 M1~M8 회귀
        run: python3 scripts/test-pr-metadata-evidence.py
      - name: 배포 shell 구문 검증
        run: |
          sh -n deploy/docker/container-entrypoint.sh
          bash -n scripts/verify-compose-smoke.sh
          bash -n scripts/verify-image-size-reduction.sh

  typecheck:
    name: TypeScript 타입 검사
    if: needs.changes.outputs.node == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      # actions/cache v4.3.0 — TypeScript incremental metadata 재사용
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ hashFiles('package-lock.json') }}-
      - run: npm run typecheck

  lint:
    name: ESLint
    if: needs.changes.outputs.node == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run lint

  unit:
    name: Vitest 단위·통합 테스트
    if: needs.changes.outputs.node == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm test

  build:
    name: Next.js production build
    if: needs.changes.outputs.node == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Next.js 공식 CI build cache 대상인 .next/cache를 commit 간 재사용한다.
      - name: Next.js cache 계측 시작
        id: next-cache-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Next.js build cache 복원
        id: next-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
      - name: Next.js cache 시간·hit 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric next-build-cache --started-ms "${{ steps.next-cache-start.outputs.started_ms }}" --cache "exact-hit=${{ steps.next-cache.outputs.cache-hit || 'false' }}"
      - run: npm run build
      - name: build setup 계측 artifact 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-setup-metrics-build
          path: ${{ runner.temp }}/ci-setup-metrics-${{ github.job }}.jsonl
          if-no-files-found: error
          retention-days: 30

  # Ruleset의 기존 required check 이름을 유지하는 aggregate gate
  quality:
    name: Build, static checks, and unit tests
    if: always()
    needs: [changes, metadata_evidence, policy, typecheck, lint, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 병렬 quality 결과 집계
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NODE_REQUIRED: ${{ needs.changes.outputs.node }}
          POLICY_REQUIRED: ${{ needs.changes.outputs.policy }}
          METADATA_ONLY: ${{ needs.changes.outputs.metadata_only }}
          METADATA_EVIDENCE: ${{ needs.metadata_evidence.result }}
          POLICY: ${{ needs.policy.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "변경 경로 판정 job이 실패하거나 취소되어 quality 결과를 신뢰할 수 없습니다: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$METADATA_ONLY" == "true" ]]; then
            [[ "$METADATA_EVIDENCE" == "success" ]] || {
              echo "PR metadata edit는 동일 head SHA의 성공한 전체 CI 증거를 요구합니다: $METADATA_EVIDENCE" >&2
              exit 1
            }
            echo "PR metadata trace와 기존 전체 CI 증거를 함께 확인했습니다."
            exit 0
          fi
          if [[ "$POLICY_REQUIRED" == "true" && "$POLICY" != "success" ]]; then
            echo "정책·저장소 계약 검사가 실패하거나 취소되었습니다: $POLICY" >&2
            exit 1
          fi
          if [[ "$NODE_REQUIRED" != "true" ]]; then
            echo "관련 코드 변경이 없어 typecheck/lint/unit/build 검사를 생략했습니다."
            exit 0
          fi
          for result in "$TYPECHECK" "$LINT" "$UNIT" "$BUILD"; do
            [[ "$result" == "success" ]] || {
              echo "병렬 quality 구현 job이 실패하거나 취소되었습니다: $result" >&2
              exit 1
            }
          done

  # workers=1 안정성 계약은 유지하고 runner 6개로 test-level sharding
  e2e_shard:
    name: Chromium E2E shard ${{ matrix.shard }}/6
    if: needs.changes.outputs.e2e == 'true'
    needs: changes
    runs-on: ubuntu-latest
    # Playwright OS dependency install can stall on runner mirrors.
    # #487: allow healthy tests to finish after bounded setup/retry.
    # Six shards, workers=1 and fail-closed aggregate checks stay unchanged.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Playwright setup 계측
        uses: ./.github/actions/playwright-setup
      - name: E2E shard 실행
        env:
          CI_E2E_FULLY_PARALLEL: "true"
          E2E_TIMING_OUTPUT: test-results/e2e-timing-shard-${{ matrix.shard }}.json
          E2E_TIMING_SHARD: ${{ matrix.shard }}
          E2E_TIMING_SHARD_COUNT: "6"
        shell: bash
        run: |
          set -euo pipefail
          export E2E_RUN_STARTED_MS="$(date +%s%3N)"
          set +e
          selection="$(node scripts/e2e-shard-planner.mjs select --plan tests/config/e2e-shard-plan.json --shard "${{ matrix.shard }}" --total 6)"
          selection_status=$?
          set -e
          if [[ "$selection_status" -eq 0 ]]; then
            mapfile -t shard_files < <(printf '%s\n' "$selection" | sed '/^$/d')
            if (( ${#shard_files[@]} == 0 )); then
              echo "Historical shard plan assigned zero files; refusing to run an accidental full suite." >&2
              exit 1
            fi
            echo "Historical timing shard plan 사용: ${#shard_files[@]} files"
            npm run test:e2e -- "${shard_files[@]}"
          else
            echo "Historical timing plan 없음/불일치 — Playwright native 6-way sharding fallback"
            npm run test:e2e -- --shard=${{ matrix.shard }}/6
          fi
      - name: E2E timing artifact 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-timing-ci-shard-${{ matrix.shard }}
          path: test-results/e2e-timing-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: E2E setup 계측 artifact 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-setup-metrics-e2e-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-setup-metrics-${{ github.job }}.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: 실패 shard Playwright report 업로드
        if: failure()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Chromium end-to-end tests
    if: always()
    needs: [changes, metadata_evidence, e2e_shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: E2E shard 결과 집계
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.e2e }}
          METADATA_ONLY: ${{ needs.changes.outputs.metadata_only }}
          METADATA_EVIDENCE: ${{ needs.metadata_evidence.result }}
          RESULT: ${{ needs.e2e_shard.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "변경 경로 판정 job이 실패하거나 취소되어 E2E 결과를 신뢰할 수 없습니다: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$METADATA_ONLY" == "true" ]]; then
            [[ "$METADATA_EVIDENCE" == "success" ]] || {
              echo "PR metadata edit는 동일 head SHA의 성공한 전체 E2E 증거를 요구합니다: $METADATA_EVIDENCE" >&2
              exit 1
            }
            echo "PR metadata trace와 기존 전체 E2E 증거를 함께 확인했습니다."
            exit 0
          fi
          if [[ "$REQUIRED" != "true" ]]; then
            echo "E2E 관련 변경이 없어 Chromium E2E를 생략했습니다."
            exit 0
          fi
          [[ "$RESULT" == "success" ]] || {
            echo "하나 이상의 Chromium E2E shard가 실패하거나 취소되었습니다: $RESULT" >&2
            exit 1
          }

  # Docker smoke도 quality를 기다리지 않고 변경 판정 직후 병렬 시작
  docker_smoke:
    name: Docker smoke 구현
    if: needs.changes.outputs.docker == 'true'
    needs: changes
    runs-on: ubuntu-latest
    # Bounded Playwright OS dependency retries plus full transport/Compose smoke.
    timeout-minutes: 40
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: Docker Buildx setup 계측 시작
        id: buildx-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Docker Buildx setup 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric docker-buildx-setup --started-ms "${{ steps.buildx-start.outputs.started_ms }}"
      - name: Docker build/cache 계측 시작
        id: docker-build-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Docker image build
        id: docker-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: mastergantt:ci
          build-args: VERSION=ci-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=mastergantt-docker
          cache-to: type=gha,mode=max,scope=mastergantt-docker
      - name: Docker build/cache 시간 기록
        if: always()
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric docker-build-cache --started-ms "${{ steps.docker-build-start.outputs.started_ms }}" --cache "gha-summary"
      - name: image content policy 검증
        run: sh scripts/verify-image-policy.sh mastergantt:ci
      - name: PR 기준 image와 크기 비교
        if: needs.changes.outputs.docker_baseline == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/mastergantt-image-baseline"
          git worktree add --detach "$baseline_dir" "$BASE_SHA"
          baseline_build_log="$RUNNER_TEMP/mastergantt-baseline-build.log"
          for attempt in 1 2; do
            # npm registry 연결 오류만 한 차례 재시도한다. 그 외 build 실패는 즉시 실패 처리.
            if docker build --progress=plain \
              --file "$baseline_dir/deploy/docker/Dockerfile" \
              --tag mastergantt:baseline \
              --build-arg VERSION=baseline-"$BASE_SHA" \
              "$baseline_dir" 2>&1 | tee "$baseline_build_log"; then
              break
            fi
            if [[ "$attempt" -eq 2 ]] || ! grep -Eq 'npm error code (ECONNRESET|ETIMEDOUT|EAI_AGAIN)' "$baseline_build_log"; then
              echo "Docker 기준 이미지 빌드가 실패했습니다. transient npm 연결 오류 외에는 재시도하지 않습니다." >&2
              exit 1
            fi
            echo "npm registry 일시 연결 오류로 Docker 기준 이미지 빌드를 1회 재시도합니다."
            sleep 5
          done

          baseline_standalone=false
          candidate_standalone=false
          grep -Eq 'output:[[:space:]]*"standalone"' "$baseline_dir/next.config.ts" && baseline_standalone=true
          grep -Eq 'output:[[:space:]]*"standalone"' next.config.ts && candidate_standalone=true

          if [[ "$baseline_standalone" == false && "$candidate_standalone" == true ]]; then
            # Issue #283의 one-time standalone migration acceptance gate.
            bash scripts/verify-image-size-reduction.sh mastergantt:baseline mastergantt:ci 25
            size_gate="standalone migration: >=25% reduction required"
          else
            # 이후 PR은 이미 slim한 base 대비 25% 추가 감소를 요구하지 않는다.
            size_gate="observational comparison only"
          fi

          {
            echo "## Docker image size"
            echo
            printf -- '- Gate: `%s`\n' "$size_gate"
            bash scripts/verify-image-size-reduction.sh mastergantt:baseline mastergantt:ci 0 --summary-only
            echo
            echo "### Runtime artifact footprint"
            echo
            echo 'Baseline:'
            echo '~~~text'
            docker run --rm --entrypoint sh mastergantt:baseline -c 'du -sh /app/node_modules /app/.next /app/src 2>/dev/null || true'
            echo '~~~'
            echo 'Candidate:'
            echo '~~~text'
            docker run --rm --entrypoint sh mastergantt:ci -c 'du -sh /app/node_modules /app/.next /app/runtime-tools /app/db 2>/dev/null || true'
            echo '~~~'
            echo
            echo "### Largest image layers"
            echo
            echo 'Baseline:'
            echo '~~~text'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' mastergantt:baseline | head -n 12
            echo '~~~'
            echo 'Candidate:'
            echo '~~~text'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' mastergantt:ci | head -n 12
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 잘못된 production HTTP 설정 조기 거부 검증
        shell: bash
        run: |
          set +e
          timeout 15s docker run --rm --name mastergantt-invalid-config             --env APP_BASE_URL=http://gantt.example.invalid             mastergantt:ci
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            docker rm --force --volumes mastergantt-invalid-config 2>/dev/null || true
            exit 1
          fi
      - name: migration·readiness 검증
        run: |
          docker run --detach --name mastergantt-ci             --env APP_BASE_URL=https://gantt.example.invalid             --publish 127.0.0.1:3000:3000             mastergantt:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs mastergantt-ci
          exit 1
      - name: SQLite native persistence 검증
        shell: bash
        run: |
          set -euo pipefail
          docker exec mastergantt-ci node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH); db.exec('CREATE TABLE IF NOT EXISTS ci_smoke (value TEXT NOT NULL)'); db.prepare('INSERT INTO ci_smoke (value) VALUES (?)').run('persisted'); db.close()"
          docker restart mastergantt-ci
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec mastergantt-ci node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH, { readonly: true }); const row = db.prepare('SELECT COUNT(*) AS count FROM ci_smoke WHERE value = ?').get('persisted'); db.close(); if (row.count !== 1) process.exit(1)"
      - name: transport smoke용 Node/npm setup 계측
        if: needs.changes.outputs.transport == 'true'
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: transport smoke용 Playwright setup 계측
        if: needs.changes.outputs.transport == 'true'
        uses: ./.github/actions/playwright-setup
      - name: production HTTP·HTTPS 전송 정책 검증
        if: needs.changes.outputs.transport == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx libnss3-tools
          bash scripts/verify-transport-smoke.sh mastergantt:ci
      - name: Compose configuration·persistence 검증
        run: bash scripts/verify-compose-smoke.sh
      - name: 실패 시 container logs
        if: failure()
        run: docker logs mastergantt-ci || true
      - name: Docker setup 계측 artifact 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-setup-metrics-docker
          path: ${{ runner.temp }}/ci-setup-metrics-${{ github.job }}.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: smoke container 정리
        if: always()
        run: docker rm --force --volumes mastergantt-ci || true

  docker:
    name: Docker build and runtime smoke test
    if: always()
    needs: [changes, metadata_evidence, docker_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Docker smoke 결과 집계
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.docker }}
          METADATA_ONLY: ${{ needs.changes.outputs.metadata_only }}
          METADATA_EVIDENCE: ${{ needs.metadata_evidence.result }}
          RESULT: ${{ needs.docker_smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "변경 경로 판정 job이 실패하거나 취소되어 Docker smoke 결과를 신뢰할 수 없습니다: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$METADATA_ONLY" == "true" ]]; then
            [[ "$METADATA_EVIDENCE" == "success" ]] || {
              echo "PR metadata edit는 동일 head SHA의 성공한 전체 Docker 증거를 요구합니다: $METADATA_EVIDENCE" >&2
              exit 1
            }
            echo "PR metadata trace와 기존 전체 Docker 증거를 함께 확인했습니다."
            exit 0
          fi
          if [[ "$REQUIRED" != "true" ]]; then
            echo "Docker/runtime 관련 변경이 없어 smoke test를 생략했습니다."
            exit 0
          fi
          [[ "$RESULT" == "success" ]] || {
            echo "Docker smoke 구현 job이 실패하거나 취소되었습니다: $RESULT" >&2
            exit 1
          }

  publish-commit-image:
    name: Main 임시 commit 이미지 게시·검증·정리
    # Optional implementation jobs may be skipped while the required aggregate
    # gates still succeed. always() prevents transitive skip propagation; the
    # explicit direct-result checks keep this registry mutation fail-closed.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Shared Playwright setup may perform two bounded 360s OS-deps installs.
    # Allow enough budget for image build/push, digest pull and transport smoke.
    timeout-minutes: 50
    needs: [changes, quality, e2e, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout 계측 시작
        id: checkout-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: checkout 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric checkout --started-ms "${{ steps.checkout-start.outputs.started_ms }}"
      - name: 임시 GHCR 참조 계산
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "name=$image_name"
            echo "tag=ci-$GITHUB_SHA"
            echo "reference=$image_name:ci-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Main image Buildx setup 계측 시작
        id: main-buildx-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Main image Buildx setup 시간 기록
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric main-image-buildx-setup --started-ms "${{ steps.main-buildx-start.outputs.started_ms }}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 기존 임시 commit 이미지 덮어쓰기 거부
        shell: bash
        run: |
          set -euo pipefail
          if docker manifest inspect "${{ steps.image.outputs.reference }}" >/dev/null 2>&1; then
            echo "Refusing to overwrite temporary commit image: ${{ steps.image.outputs.reference }}" >&2
            exit 1
          fi
      - name: Main image build/push 계측 시작
        id: main-image-start
        shell: bash
        run: echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: 임시 commit 이미지 빌드·게시
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.changes.outputs.current_version }}
          build-args: VERSION=${{ needs.changes.outputs.current_version }}
          platforms: linux/amd64
          cache-from: type=gha,scope=mastergantt-docker
          cache-to: type=gha,mode=max,scope=mastergantt-docker
          provenance: mode=max
          sbom: true
      - name: Main image build/push 시간 기록
        if: always()
        shell: bash
        run: node scripts/record-ci-setup-metric.mjs --metric main-image-build-push --started-ms "${{ steps.main-image-start.outputs.started_ms }}" --cache "gha-summary"
      - name: exact published digest pull
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: 게시 image policy 검증
        run: sh scripts/verify-image-policy.sh "${{ steps.digest.outputs.image }}"
      - name: 게시 image readiness 검증
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name mastergantt-commit-smoke             --env APP_BASE_URL=https://gantt.example.invalid             --publish 127.0.0.1:3000:3000             "${{ steps.digest.outputs.image }}"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs mastergantt-commit-smoke
          exit 1
      - name: 게시 image SQLite persistence 검증
        shell: bash
        run: |
          set -euo pipefail
          docker exec mastergantt-commit-smoke node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH); db.exec('CREATE TABLE IF NOT EXISTS commit_smoke (value TEXT NOT NULL)'); db.prepare('INSERT INTO commit_smoke (value) VALUES (?)').run('persisted'); db.close()"
          docker restart mastergantt-commit-smoke
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec mastergantt-commit-smoke node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH, { readonly: true }); const row = db.prepare('SELECT COUNT(*) AS count FROM commit_smoke WHERE value = ?').get('persisted'); db.close(); if (row.count !== 1) process.exit(1)"
      - name: Project·Task API persistence 검증
        run: node scripts/verify-registry-api-smoke.mjs http://127.0.0.1:3000 mastergantt-commit-smoke
      - name: 게시 digest transport Node/npm setup 계측
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 게시 digest transport Playwright setup 계측
        uses: ./.github/actions/playwright-setup
      - name: 게시 digest HTTP·HTTPS browser 검증
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx libnss3-tools
          bash scripts/verify-transport-smoke.sh "${{ steps.digest.outputs.image }}"
      - name: 임시 image 검증 결과 기록
        if: success()
        shell: bash
        run: |
          {
            echo "## Verified temporary main commit image"
            echo
            printf -- '- Reference: `%s`\n' '${{ steps.digest.outputs.image }}'
            printf -- '- Digest: `%s`\n' '${{ steps.push.outputs.digest }}'
            echo "- BuildKit SBOM/provenance: generated."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 실패 시 smoke logs
        if: failure()
        run: docker logs mastergantt-commit-smoke || true
      - name: smoke container 정리
        if: always()
        run: docker rm --force --volumes mastergantt-commit-smoke || true
      - name: Main image setup 계측 artifact 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-setup-metrics-main-image
          path: ${{ runner.temp }}/ci-setup-metrics-${{ github.job }}.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: GHCR main commit image lifecycle handoff
        if: always() && steps.push.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" != "success" ]]; then
            node scripts/delete-ghcr-package-version-by-tag.mjs "ci-${GITHUB_SHA}"
            echo "- GHCR cleanup: failed validation candidate ci-${GITHUB_SHA} deleted." >> "$GITHUB_STEP_SUMMARY"
            echo "Main artifact 검증이 성공하지 않아 ci-${GITHUB_SHA}를 lifecycle candidate로 보존하지 않습니다." >&2
            exit 1
          fi
          echo "- GHCR retention: verified ci-${GITHUB_SHA} retained until Generic Release Finalizer resolves release or cleanup." >> "$GITHUB_STEP_SUMMARY"
