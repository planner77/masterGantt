name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # 새 PR head가 올라오면 이전 실행을 즉시 취소해 runner 낭비를 줄인다.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: 변경 경로 판정
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.node == 'true' }}
      policy: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.policy == 'true' }}
      e2e: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.e2e == 'true' }}
      docker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}

      # dorny/paths-filter v4.0.3
      # workflow-level paths는 required check를 Pending으로 남길 수 있어 사용하지 않는다.
      - name: 무거운 CI 대상 경로 판정
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          token: ${{ github.token }}
          filters: |
            node:
              - 'src/**'
              - 'public/**'
              - 'db/**'
              - 'scripts/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'next.config.*'
              - 'eslint.config.*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            policy:
              # 정책 검증의 실제 입력. application code뿐 아니라 문서·workflow·검증 script 변경도 포함한다.
              - 'src/**'
              - 'public/**'
              - 'db/**'
              - 'scripts/**'
              - 'tests/**'
              - 'deploy/**'
              - 'docs/**'
              - '*.md'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'next.config.*'
              - 'eslint.config.*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - '.dockerignore'
              - '.github/workflows/**'
              - '.github/actions/**'
            e2e:
              - 'src/**'
              - 'public/**'
              - 'db/**'
              - 'tests/e2e/**'
              - 'tests/config/playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            docker:
              - 'src/**'
              - 'public/**'
              - 'db/**'
              - 'scripts/**'
              - 'deploy/**'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

      - name: main docs-only 변경 판정
        id: classify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -d '' -t changed_files < <(git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA")
          if (( ${#changed_files[@]} == 0 )); then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          for path in "${changed_files[@]}"; do
            if [[ "$path" == docs/* || ( "$path" != */* && "$path" == *.md ) ]]; then
              continue
            fi
            docs_only=false
            break
          done
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: 변경 경로 요약
        shell: bash
        env:
          NODE_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.node == 'true' }}
          POLICY_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.policy == 'true' }}
          E2E_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.e2e == 'true' }}
          DOCKER_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only || 'N/A' }}
        run: |
          {
            echo "## CI change routing"
            echo
            printf -- '- node: `%s`\n' "$NODE_CHANGED"
            printf -- '- policy: `%s`\n' "$POLICY_CHANGED"
            printf -- '- e2e: `%s`\n' "$E2E_CHANGED"
            printf -- '- docker: `%s`\n' "$DOCKER_CHANGED"
            printf -- '- docs_only(main): `%s`\n' "$DOCS_ONLY"
          } >> "$GITHUB_STEP_SUMMARY"

  policy:
    name: 정책·저장소 계약 검사
    if: needs.changes.outputs.policy == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      # setup-node의 npm cache를 재사용한다. npm ci는 node_modules를 삭제하므로 node_modules 자체는 cache하지 않는다.
      - run: npm ci --prefer-offline --no-audit
      - run: node scripts/verify-release-version.mjs
      - name: 루트·외부 cwd 테스트 탐색 계약 검증
        run: node scripts/verify-test-discovery.mjs
      - name: production dependency audit
        run: npm audit --omit=dev
      - run: node scripts/check-markdown-links.mjs
      - name: 작업 브랜치 cleanup 안전 정책 검증
        run: python3 scripts/verify-safe-branch-cleanup.py
      - name: 범용 Issue Lifecycle 계약·시나리오 검증
        run: python3 scripts/verify-issue-lifecycle.py
      - name: 배포 shell 구문 검증
        run: |
          sh -n deploy/docker/container-entrypoint.sh
          bash -n scripts/verify-compose-smoke.sh
          bash -n scripts/verify-image-size-reduction.sh

  typecheck:
    name: TypeScript 타입 검사
    if: needs.changes.outputs.node == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      # actions/cache v4.3.0 — TypeScript incremental metadata 재사용
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline --no-audit
      - run: npm run typecheck

  lint:
    name: ESLint
    if: needs.changes.outputs.node == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - run: npm run lint

  unit:
    name: Vitest 단위·통합 테스트
    if: needs.changes.outputs.node == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - run: npm test

  build:
    name: Next.js production build
    if: needs.changes.outputs.node == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      # Next.js 공식 CI build cache 대상인 .next/cache를 commit 간 재사용한다.
      - name: Next.js build cache 복원
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build

  # Ruleset의 기존 required check 이름을 유지하는 aggregate gate
  quality:
    name: Build, static checks, and unit tests
    if: always()
    needs: [changes, policy, typecheck, lint, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 병렬 quality 결과 집계
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NODE_REQUIRED: ${{ needs.changes.outputs.node }}
          POLICY_REQUIRED: ${{ needs.changes.outputs.policy }}
          POLICY: ${{ needs.policy.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "변경 경로 판정 job이 실패하거나 취소되어 quality 결과를 신뢰할 수 없습니다: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$POLICY_REQUIRED" == "true" && "$POLICY" != "success" ]]; then
            echo "정책·저장소 계약 검사가 실패하거나 취소되었습니다: $POLICY" >&2
            exit 1
          fi
          if [[ "$NODE_REQUIRED" != "true" ]]; then
            echo "관련 코드 변경이 없어 typecheck/lint/unit/build 검사를 생략했습니다."
            exit 0
          fi
          for result in "$TYPECHECK" "$LINT" "$UNIT" "$BUILD"; do
            [[ "$result" == "success" ]] || {
              echo "병렬 quality 구현 job이 실패하거나 취소되었습니다: $result" >&2
              exit 1
            }
          done

  # workers=1 안정성 계약은 유지하고 runner 4개로 file sharding
  e2e_shard:
    name: Chromium E2E shard ${{ matrix.shard }}/4
    if: needs.changes.outputs.e2e == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit
      # Playwright 공식 가이드에 따라 browser binary cache 대신 필요한 headless shell만 설치
      - name: Chromium headless shell 설치
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: E2E shard 실행
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: 실패 shard Playwright report 업로드
        if: failure()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Chromium end-to-end tests
    if: always()
    needs: [changes, e2e_shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: E2E shard 결과 집계
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.e2e }}
          RESULT: ${{ needs.e2e_shard.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "변경 경로 판정 job이 실패하거나 취소되어 E2E 결과를 신뢰할 수 없습니다: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$REQUIRED" != "true" ]]; then
            echo "E2E 관련 변경이 없어 Chromium E2E를 생략했습니다."
            exit 0
          fi
          [[ "$RESULT" == "success" ]] || {
            echo "하나 이상의 Chromium E2E shard가 실패하거나 취소되었습니다: $RESULT" >&2
            exit 1
          }

  # Docker smoke도 quality를 기다리지 않고 변경 판정 직후 병렬 시작
  docker_smoke:
    name: Docker smoke 구현
    if: needs.changes.outputs.docker == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Docker image build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: mastergantt:ci
          build-args: VERSION=ci-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=mastergantt-docker
          cache-to: type=gha,mode=max,scope=mastergantt-docker
      - name: image content policy 검증
        run: sh scripts/verify-image-policy.sh mastergantt:ci
      - name: PR 기준 image와 크기 비교
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/mastergantt-image-baseline"
          git worktree add --detach "$baseline_dir" "$BASE_SHA"
          docker build \
            --file "$baseline_dir/deploy/docker/Dockerfile" \
            --tag mastergantt:baseline \
            --build-arg VERSION=baseline-"$BASE_SHA" \
            "$baseline_dir"

          baseline_standalone=false
          candidate_standalone=false
          grep -Eq 'output:[[:space:]]*"standalone"' "$baseline_dir/next.config.ts" && baseline_standalone=true
          grep -Eq 'output:[[:space:]]*"standalone"' next.config.ts && candidate_standalone=true

          if [[ "$baseline_standalone" == false && "$candidate_standalone" == true ]]; then
            # Issue #283의 one-time standalone migration acceptance gate.
            bash scripts/verify-image-size-reduction.sh mastergantt:baseline mastergantt:ci 25
            size_gate="standalone migration: >=25% reduction required"
          else
            # 이후 PR은 이미 slim한 base 대비 25% 추가 감소를 요구하지 않는다.
            size_gate="observational comparison only"
          fi

          {
            echo "## Docker image size"
            echo
            printf -- '- Gate: `%s`\n' "$size_gate"
            bash scripts/verify-image-size-reduction.sh mastergantt:baseline mastergantt:ci 0 --summary-only
            echo
            echo "### Runtime artifact footprint"
            echo
            echo 'Baseline:'
            echo '~~~text'
            docker run --rm --entrypoint sh mastergantt:baseline -c 'du -sh /app/node_modules /app/.next /app/src 2>/dev/null || true'
            echo '~~~'
            echo 'Candidate:'
            echo '~~~text'
            docker run --rm --entrypoint sh mastergantt:ci -c 'du -sh /app/node_modules /app/.next /app/runtime-tools /app/db 2>/dev/null || true'
            echo '~~~'
            echo
            echo "### Largest image layers"
            echo
            echo 'Baseline:'
            echo '~~~text'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' mastergantt:baseline | head -n 12
            echo '~~~'
            echo 'Candidate:'
            echo '~~~text'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' mastergantt:ci | head -n 12
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 잘못된 production HTTP 설정 조기 거부 검증
        shell: bash
        run: |
          set +e
          timeout 15s docker run --rm --name mastergantt-invalid-config             --env APP_BASE_URL=http://gantt.example.invalid             mastergantt:ci
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            docker rm --force --volumes mastergantt-invalid-config 2>/dev/null || true
            exit 1
          fi
      - name: migration·readiness 검증
        run: |
          docker run --detach --name mastergantt-ci             --env APP_BASE_URL=https://gantt.example.invalid             --publish 127.0.0.1:3000:3000             mastergantt:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs mastergantt-ci
          exit 1
      - name: SQLite native persistence 검증
        shell: bash
        run: |
          set -euo pipefail
          docker exec mastergantt-ci node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH); db.exec('CREATE TABLE IF NOT EXISTS ci_smoke (value TEXT NOT NULL)'); db.prepare('INSERT INTO ci_smoke (value) VALUES (?)').run('persisted'); db.close()"
          docker restart mastergantt-ci
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec mastergantt-ci node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH, { readonly: true }); const row = db.prepare('SELECT COUNT(*) AS count FROM ci_smoke WHERE value = ?').get('persisted'); db.close(); if (row.count !== 1) process.exit(1)"
      - name: transport smoke용 Node 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: production HTTP·HTTPS 전송 정책 검증
        run: |
          npm ci --prefer-offline --no-audit
          npx --no-install playwright install --with-deps --only-shell chromium
          sudo apt-get update
          sudo apt-get install --yes nginx libnss3-tools
          bash scripts/verify-transport-smoke.sh mastergantt:ci
      - name: Compose configuration·persistence 검증
        run: bash scripts/verify-compose-smoke.sh
      - name: 실패 시 container logs
        if: failure()
        run: docker logs mastergantt-ci || true
      - name: smoke container 정리
        if: always()
        run: docker rm --force --volumes mastergantt-ci || true

  docker:
    name: Docker build and runtime smoke test
    if: always()
    needs: [changes, docker_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Docker smoke 결과 집계
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.docker }}
          RESULT: ${{ needs.docker_smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "변경 경로 판정 job이 실패하거나 취소되어 Docker smoke 결과를 신뢰할 수 없습니다: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$REQUIRED" != "true" ]]; then
            echo "Docker/runtime 관련 변경이 없어 smoke test를 생략했습니다."
            exit 0
          fi
          [[ "$RESULT" == "success" ]] || {
            echo "Docker smoke 구현 job이 실패하거나 취소되었습니다: $RESULT" >&2
            exit 1
          }

  publish-commit-image:
    name: Main 임시 commit 이미지 게시·검증·정리
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, quality, e2e, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 임시 GHCR 참조 계산
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "name=$image_name"
            echo "tag=ci-$GITHUB_SHA"
            echo "reference=$image_name:ci-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 기존 임시 commit 이미지 덮어쓰기 거부
        shell: bash
        run: |
          set -euo pipefail
          if docker manifest inspect "${{ steps.image.outputs.reference }}" >/dev/null 2>&1; then
            echo "Refusing to overwrite temporary commit image: ${{ steps.image.outputs.reference }}" >&2
            exit 1
          fi
      - name: 임시 commit 이미지 빌드·게시
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=ci-${{ github.sha }}
          build-args: VERSION=ci-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=mastergantt-docker
          cache-to: type=gha,mode=max,scope=mastergantt-docker
          provenance: mode=max
          sbom: true
      - name: exact published digest pull
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: 게시 image policy 검증
        run: sh scripts/verify-image-policy.sh "${{ steps.digest.outputs.image }}"
      - name: 게시 image readiness 검증
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name mastergantt-commit-smoke             --env APP_BASE_URL=https://gantt.example.invalid             --publish 127.0.0.1:3000:3000             "${{ steps.digest.outputs.image }}"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs mastergantt-commit-smoke
          exit 1
      - name: 게시 image SQLite persistence 검증
        shell: bash
        run: |
          set -euo pipefail
          docker exec mastergantt-commit-smoke node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH); db.exec('CREATE TABLE IF NOT EXISTS commit_smoke (value TEXT NOT NULL)'); db.prepare('INSERT INTO commit_smoke (value) VALUES (?)').run('persisted'); db.close()"
          docker restart mastergantt-commit-smoke
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec mastergantt-commit-smoke node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH, { readonly: true }); const row = db.prepare('SELECT COUNT(*) AS count FROM commit_smoke WHERE value = ?').get('persisted'); db.close(); if (row.count !== 1) process.exit(1)"
      - name: Project·Task API persistence 검증
        run: node scripts/verify-registry-api-smoke.mjs http://127.0.0.1:3000 mastergantt-commit-smoke
      - name: 게시 digest transport smoke용 Node 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 게시 digest HTTP·HTTPS browser 검증
        run: |
          npm ci --prefer-offline --no-audit
          npx --no-install playwright install --with-deps --only-shell chromium
          sudo apt-get update
          sudo apt-get install --yes nginx libnss3-tools
          bash scripts/verify-transport-smoke.sh "${{ steps.digest.outputs.image }}"
      - name: 임시 image 검증 결과 기록
        if: success()
        shell: bash
        run: |
          {
            echo "## Verified temporary main commit image"
            echo
            printf -- '- Reference: `%s`\n' '${{ steps.digest.outputs.image }}'
            printf -- '- Digest: `%s`\n' '${{ steps.push.outputs.digest }}'
            echo "- BuildKit SBOM/provenance: generated."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 실패 시 smoke logs
        if: failure()
        run: docker logs mastergantt-commit-smoke || true
      - name: smoke container 정리
        if: always()
        run: docker rm --force --volumes mastergantt-commit-smoke || true
      - name: GHCR 임시 main commit image 삭제
        if: always() && steps.push.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          node scripts/delete-ghcr-package-version-by-tag.mjs "ci-${{ github.sha }}"
          echo "- GHCR cleanup: temporary ci-${{ github.sha }} package version deleted." >> "$GITHUB_STEP_SUMMARY"
