name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Fork PR에는 read-only token만 필요하다. publish 권한은 release workflow에 한정한다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, static checks, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Record Node and npm versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: node scripts/verify-release-version.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: node scripts/check-markdown-links.mjs
      - run: npm run build

  e2e:
    name: Chromium end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker build and runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # docker/setup-buildx-action v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Record Docker version
        run: docker version --format '{{.Server.Version}}'
      # docker/build-push-action v7.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          tags: mastergantt:ci
          build-args: VERSION=ci-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image content policy
        run: sh scripts/verify-image-policy.sh mastergantt:ci
      - name: Reject insecure production runtime configuration before migration
        shell: bash
        run: |
          set +e
          timeout 15s docker run --rm --name mastergantt-invalid-config \
            --env APP_BASE_URL=http://gantt.example.invalid \
            mastergantt:ci
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "Expected invalid production APP_BASE_URL to exit 1 before startup; got $status." >&2
            docker rm --force --volumes mastergantt-invalid-config 2>/dev/null || true
            exit 1
          fi
      - name: Verify image runs migrations and serves readiness
        run: |
          docker run --detach --name mastergantt-ci \
            --env APP_BASE_URL=https://gantt.example.invalid \
            --env SESSION_COOKIE_SECURE=true \
            --publish 127.0.0.1:3000:3000 \
            mastergantt:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs mastergantt-ci
          exit 1
      - name: Verify SQLite native access persists across restart
        shell: bash
        run: |
          set -euo pipefail
          docker exec mastergantt-ci node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH); db.exec('CREATE TABLE IF NOT EXISTS ci_smoke (value TEXT NOT NULL)'); db.prepare('INSERT INTO ci_smoke (value) VALUES (?)').run('persisted'); db.close()"
          docker restart mastergantt-ci
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec mastergantt-ci node -e "const Database = require('better-sqlite3'); const db = new Database(process.env.DATABASE_PATH, { readonly: true }); const row = db.prepare('SELECT COUNT(*) AS count FROM ci_smoke WHERE value = ?').get('persisted'); db.close(); if (row.count !== 1) process.exit(1)"
      - name: Show container logs on failure
        if: failure()
        run: docker logs mastergantt-ci || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force --volumes mastergantt-ci || true
