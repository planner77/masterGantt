name: One-time Release v0.13.0 Final

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-release-v0.13.0-final.yml

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_SHA: 0d3b529ea8afe3e52dbf64d38b4192137c4d298f
      MAIN_CI_RUN_ID: "35166466210"
      TAG_NAME: v0.13.0
      VERSION: 0.13.0
      WORK_BRANCH: feat/issue-28-excel-export
      ISSUE_NUMBER: "58"
      WORKFLOW_PATH: .github/workflows/one-time-release-v0.13.0-final.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 검증 CI 필수 gate 확인
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_CI_RUN_ID/jobs?filter=latest&per_page=100")"
          node - "$jobs" <<'NODE'
          const data = JSON.parse(process.argv[2]);
          const required = [
            'Build, static checks, and unit tests',
            'Chromium end-to-end tests',
            'Docker build and runtime smoke test',
            'Publish and verify immutable main commit image',
          ];
          for (const name of required) {
            const ok = data.jobs.some((job) => job.name === name && job.status === 'completed' && job.conclusion === 'success');
            if (!ok) {
              console.error(`Required gate not successful: ${name}`);
              process.exit(1);
            }
          }
          NODE

      - name: 릴리스 대상과 버전 검증
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          version="$(git show "$TARGET_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          test "$version" = "$VERSION"

      - name: annotated tag 생성
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            test "$(git rev-parse "$TAG_NAME^{}")" = "$TARGET_SHA"
            test "$(git cat-file -t "$TAG_NAME")" = tag
          else
            git tag -a "$TAG_NAME" "$TARGET_SHA" -m "masterGantt $TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: release image workflow 실행 및 성공 확인
        id: release_image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run release-image.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG_NAME"
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-image.yml --branch "$TAG_NAME" --event workflow_dispatch --limit 10 --json databaseId,headSha --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success

      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git show "$TARGET_SHA:docs/releases/v0.13.0.md" > /tmp/v0.13.0.md
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "$TAG_NAME" --notes-file /tmp/v0.13.0.md
          else
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$TARGET_SHA" --title "$TAG_NAME" --notes-file /tmp/v0.13.0.md
          fi

      - name: 작업 브랜치 삭제
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$WORK_BRANCH" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$WORK_BRANCH"
          fi

      - name: 릴리스 문서 최종 상태 갱신
        env:
          RELEASE_RUN_ID: ${{ steps.release_image.outputs.run_id }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          node - <<'NODE'
          const fs = require('fs');
          const path = 'docs/releases/v0.13.0.md';
          let text = fs.readFileSync(path, 'utf8');
          const marker = '## 최종 릴리스 상태';
          if (!text.includes(marker)) {
            text += `\n\n${marker}\n\n- main CI Run #271 (35166466210): 전체 PASS\n- annotated tag: v0.13.0\n- GitHub Release: v0.13.0 게시 완료\n- GHCR release image: release-image workflow 성공 (run ${process.env.RELEASE_RUN_ID})\n- 작업 브랜치 feat/issue-28-excel-export: 삭제 완료\n`;
          }
          fs.writeFileSync(path, text);
          NODE

      - name: 추적 이슈 완료 처리
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ steps.release_image.outputs.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "v0.13.0 릴리스 정리를 완료했습니다.\n\n- tag: v0.13.0\n- release-image workflow: $RELEASE_RUN_ID 성공\n- GitHub Release: 생성 완료\n- 작업 브랜치: 삭제 완료\n- 릴리스 문서: 최종 상태 반영"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: 문서 반영 및 일회성 workflow 제거
        run: |
          set -euo pipefail
          git rm "$WORKFLOW_PATH"
          git add docs/releases/v0.13.0.md
          git diff --cached --check
          git commit -m "docs: v0.13.0 릴리스 상태 확정"
          git push origin HEAD:main
