name: Issue 35 cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/issue-35-release-minimal.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Remove Issue 35 work branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune
          if git ls-remote --exit-code --heads origin feat/issue-35-gantt-scale-toggle >/dev/null 2>&1; then
            git push origin --delete feat/issue-35-gantt-scale-toggle
          else
            echo "Issue #35 work branch already removed."
          fi
