name: Issue 97 릴리스 완료 자동화

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-97-release-helper.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

jobs:
  release:
    name: v0.22.0 GHCR 릴리스·브랜치 정리·이슈 종료
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      TARGET_SHA: ${{ github.sha }}
      RELEASE_TAG: v0.22.0
      WORK_BRANCH: feat/issue-97-link-persistence
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 승인된 Issue #97 Lifecycle 완료
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "0.22.0"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

          app_sha="$(git rev-parse "$TARGET_SHA^")"
          pr100="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/100")"
          test "$(jq -r '.merged_at // ""' <<<"$pr100")" != ""
          test "$(jq -r '.base.ref' <<<"$pr100")" = "main"
          test "$(jq -r '.merge_commit_sha' <<<"$pr100")" = "$app_sha"

          main_ci_url=""
          for _ in $(seq 1 300); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=50")"
            run="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
              test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
              main_ci_url="$(jq -r .html_url <<<"$run")"
              break
            fi
            sleep 15
          done
          test -n "$main_ci_url"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"

          dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/dispatches" -f ref="$RELEASE_TAG"
          release_run_url=""
          for _ in $(seq 1 480); do
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/release-image.yml/runs?event=workflow_dispatch&per_page=100")"
            run="$(jq -c --arg sha "$TARGET_SHA" --arg tag "$RELEASE_TAG" --arg after "$dispatched_after" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .created_at >= $after)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == "completed" ]]; then
              test "$(jq -r '.conclusion // ""' <<<"$run")" = "success"
              release_run_url="$(jq -r .html_url <<<"$run")"
              break
            fi
            sleep 15
          done
          test -n "$release_run_url"

          owner="${GITHUB_REPOSITORY%%/*}"
          encoded="${WORK_BRANCH//\//%2F}"
          branch_http="$(curl -sSLo /tmp/branch.json -w '%{http_code}' -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded")"
          if [[ "$branch_http" == "200" ]]; then
            branch_sha="$(jq -r '.commit.sha' /tmp/branch.json)"
            test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=$owner:$WORK_BRANCH&per_page=1" --jq 'length')" = "0"
            test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&base=$WORK_BRANCH&per_page=1" --jq 'length')" = "0"
            git push --porcelain --force-with-lease="refs/heads/$WORK_BRANCH:$branch_sha" origin ":refs/heads/$WORK_BRANCH" >/dev/null
          else
            test "$branch_http" = "404"
          fi

          body="$(printf '%s\n' "Issue Lifecycle 완료:" "- 버전: 0.22.0" "- main CI: $main_ci_url" "- GHCR 정식 릴리스 이미지: $release_run_url" "- 정식 릴리스 태그: $RELEASE_TAG" "- 작업 브랜치 정리: $WORK_BRANCH")"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/97/comments" -f body="$body"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/97" -f state="closed" -f state_reason="completed"
