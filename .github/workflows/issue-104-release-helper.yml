name: Issue 104 release cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/issue-104-release-helper.yml"

permissions:
  contents: write
  actions: read

jobs:
  cleanup:
    name: v0.23.1 릴리스 검증 및 작업 브랜치 정리
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: a450d866cbb335c0d31276ebdd54fd55c972f983
      RELEASE_TAG: v0.23.1
      WORK_BRANCH: fix/issue-104-context-menu-link-scope
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 정식 릴리스 성공 검증
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"
          test "$(git show "$TARGET_SHA:package.json" | jq -r .version)" = "0.23.1"

          runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100")"
          success_count="$(jq -r --arg sha "$TARGET_SHA" '
            [.workflow_runs[]
              | select(.name == "Publish release image")
              | select(.event == "workflow_dispatch")
              | select(.head_sha == $sha)
              | select(.status == "completed")
              | select(.conclusion == "success")]
            | length
          ' <<<"$runs")"
          test "$success_count" -ge 1

      - name: Issue #104 작업 브랜치 삭제 및 확인
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$WORK_BRANCH" >/dev/null 2>&1; then
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$WORK_BRANCH"
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$WORK_BRANCH" >/dev/null 2>&1; then
            echo "작업 브랜치 삭제에 실패했습니다: $WORK_BRANCH" >&2
            exit 1
          fi

      - name: 완료 요약
        shell: bash
        run: |
          {
            echo "## Issue #104 cleanup 완료"
            echo
            echo "- release tag: `$RELEASE_TAG`"
            echo "- release commit: `$TARGET_SHA`"
            echo "- deleted branch: `$WORK_BRANCH`"
          } >> "$GITHUB_STEP_SUMMARY"
