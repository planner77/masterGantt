# 기존 배포는 실행 중인 Compose project 이름을 유지한다. 신규 설치 예시는 .env.example 참고.
name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME to the existing project name}

services:
  app:
    # 작은 SQLite 배포는 app replica 하나만 사용한다. replicas/별도 DB service를 추가하지 않는다.
    # 운영 경로는 prebuilt registry image만 사용한다. local build는 compose.build.yml override에서만 제공한다.
    image: ${IMAGE_NAME:?Set IMAGE_NAME to an exact SemVer tag or verified digest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /data/mastergantt.sqlite3
      # 운영자는 compose 실행 전에 실제 canonical 외부 origin을 명시해야 한다.
      APP_BASE_URL: ${APP_BASE_URL:?Set the canonical browser origin}
      # 미설정은 HTTPS-only. 내부망 HTTP는 명시적인 true만 허용한다.
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 리소스 카탈로그 관리자 비밀번호는 Docker 배포에서도 필수이며 누락 시 Compose config 단계에서 실패한다.
      RESOURCE_CATALOG_ADMIN_PASSWORD: ${RESOURCE_CATALOG_ADMIN_PASSWORD:?Set RESOURCE_CATALOG_ADMIN_PASSWORD}
      # 조직의 1 M/M 환산 근무일 수. 빈 값이면 M/M 조회를 비활성화한다.
      RESOURCE_MD_PER_MM: "${RESOURCE_MD_PER_MM:-}"
    # Reverse proxy가 같은 Docker network에 있으면 이 port mapping을 제거하고 내부 port만 사용한다.
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      # DB, WAL, SHM은 image가 아닌 Docker-managed persistent volume에만 둔다.
      - mastergantt-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/api/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

volumes:
  mastergantt-data:
    # Compose project를 삭제해도 `docker compose down`만으로는 volume을 제거하지 않는다.
    name: ${MASTERGANTT_VOLUME_NAME:-mastergantt-data}
